<!doctype html>
<meta charset="utf-8" />
<title>c</title>
<style>
  #box { width: 100px; height: 100px; background: #0c6; }
</style>
<div id="box"></div>
<p id="c">c</p>
<script>
  fetch("/hold").catch(() => {})
  // Moves every frame from its load: one presented frame per vsync.
  let x = 0
  const step = () => {
    x = (x + 3) % 300
    document.getElementById("box").style.transform = `translateX(${x}px)`
    requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
</script>
