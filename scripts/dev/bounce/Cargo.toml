# Dev harness for the launch-feedback primitives (not shipped; see harness.rs). Its own target folder:
#   cargo run --manifest-path scripts/dev/bounce/Cargo.toml -- <mode> ...
[package]
name = "bounce-dev"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bounce-dev"
path = "harness.rs"

[dependencies]
strobe = { path = "../../.." }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
