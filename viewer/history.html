<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Strobe History</title>
<style>
:root {
  --canvas: #f6f7f9; --surface: #ffffff; --surface-subtle: #f0f2f6;
  --ink: #0f172a; --ink-2: #475569; --ink-3: #64748b; --ink-4: #94a3b8;
  --border: rgba(15, 23, 42, 0.085); --hairline: rgba(15, 23, 42, 0.065);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
  --win: #059669; --win-bg: rgba(5, 150, 105, 0.09); --win-border: rgba(5, 150, 105, 0.24);
  --loss: #dc2626; --loss-bg: rgba(220, 38, 38, 0.09); --loss-border: rgba(220, 38, 38, 0.24);
  --warn: #d97706; --warn-bg: rgba(217, 119, 6, 0.085); --warn-border: rgba(217, 119, 6, 0.26);
  --neutral-pill-bg: rgba(15, 23, 42, 0.055); --neutral-pill-border: rgba(15, 23, 42, 0.12);
  --accent: #2563eb; --head-tone: #1e293b; --base-tone: #94a3b8;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --display: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0b0d11; --surface: #12161e; --surface-subtle: #171c26;
    --ink: #f1f5f9; --ink-2: #cbd5e1; --ink-3: #94a3b8; --ink-4: #64748b;
    --border: rgba(255, 255, 255, 0.085); --hairline: rgba(255, 255, 255, 0.065);
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    --win: #34d399; --win-bg: rgba(52, 211, 153, 0.12); --win-border: rgba(52, 211, 153, 0.28);
    --loss: #f87171; --loss-bg: rgba(248, 113, 113, 0.12); --loss-border: rgba(248, 113, 113, 0.28);
    --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.10); --warn-border: rgba(251, 191, 36, 0.28);
    --neutral-pill-bg: rgba(255, 255, 255, 0.07); --neutral-pill-border: rgba(255, 255, 255, 0.13);
    --accent: #60a5fa; --head-tone: #e2e8f0; --base-tone: #64748b;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: 76px; background: var(--canvas); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
.shell { max-width: 1040px; margin: 0 auto; padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 26px; }
.mono { font: 12px/18px var(--mono); font-variant-numeric: tabular-nums; }
h1 { font: 600 22px/28px var(--display); letter-spacing: -0.01em; }
h2 { font: 600 16px/22px var(--display); }
.sub { color: var(--ink-3); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; border: 1px solid var(--neutral-pill-border); background: var(--neutral-pill-bg); color: var(--ink-2); white-space: nowrap; }
.pill.loss { color: var(--loss); background: var(--loss-bg); border-color: var(--loss-border); }
.pill.win { color: var(--win); background: var(--win-bg); border-color: var(--win-border); }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.chart { position: relative; }
.chart svg { width: 100%; height: 240px; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; line-height: 17px; display: none; max-width: 360px; z-index: 2; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
td { padding: 4px 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
td.num { text-align: right; white-space: nowrap; }
tr.invalid td { color: var(--ink-4); }
details summary { cursor: pointer; color: var(--ink-3); font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-3); font-size: 12px; }
.note { color: var(--ink-3); font-size: 13px; }
.topbar { position: sticky; top: 0; z-index: 3; background: var(--canvas); display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-top: -12px; padding: 12px 0 14px; border-bottom: 1px solid var(--border); }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface-subtle); border: 1px solid var(--border); }
.seg button { border: 0; background: transparent; padding: 3px 8px; border-radius: 5px; font: 500 12px/16px var(--mono); color: var(--ink-3); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
const DATA = /*STROBE_DATA*/null;
// Escaped for HTML, a time never breaking between its number and its unit (`4,000 µs` on one line).
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]).replace(/(\d) (µs|ms|s)(?!\w)/g, "$1\u00a0$2");

/* ---------- Time units (shared: viewer/report.html and viewer/history.html carry this block alike) ---------- */
// Rust's `{:.d}`, which the text and markdown print with: the nearest decimal, an exact tie to even
// (toFixed breaks a tie away from zero, so 12.5 MB read 13 MB here and 12 MB in the text). One that
// shows as zero has no sign (`0.00`, never `-0.00`).
function rfix(v, d) {
  const dv = new DataView(new ArrayBuffer(8));
  dv.setFloat64(0, Math.abs(v));
  const hi = dv.getUint32(0), lo = dv.getUint32(4), exp = (hi >>> 20) & 0x7ff;
  let mant = (BigInt(hi & 0xfffff) << 32n) | BigInt(lo);
  const e = exp === 0 ? -1074 : exp - 1075;
  if (exp !== 0) mant |= 1n << 52n;
  const fixed = () => { const s = v.toFixed(d); return Number.isFinite(v) && !/[1-9]/.test(s) ? s.replace(/^-/, "") : s; };
  if (!Number.isFinite(v) || e >= 0) return fixed();
  const num = mant * 10n ** BigInt(d), den = 1n << BigInt(-e);
  if ((num % den) * 2n !== den) return fixed();
  let q = num / den;
  if (q % 2n === 1n) q += 1n;
  const digits = q.toString().padStart(d + 1, "0");
  const body = d ? `${digits.slice(0, -d)}.${digits.slice(-d)}` : digits;
  return (v < 0 && q !== 0n ? "-" : "") + body;
}

// A measured time is stored in ms and shown in one unit for the whole page (fmt::TimeUnit): µs unless
// the address (`#unit=ms`) or the page's data (`default_unit`) says otherwise, never promoted to a
// larger unit as it grows. `finest`: the most decimals a time shows in the unit; a nonzero time that
// would print as 0 there prints `<0.01 µs`, never 0.
const TIME_UNITS = {
  us: { label: "µs", perMs: 1000, finest: 2, name: "microseconds" },
  ms: { label: "ms", perMs: 1, finest: 4, name: "milliseconds" },
  s: { label: "s", perMs: 0.001, finest: 6, name: "seconds" },
};
let TIME_UNIT = "us";

// `us`, `ms` or `s` from what an address or a page's data says (`µs` and `μs` too), else null.
function parseTimeUnit(s) {
  const k = String(s ?? "").trim().toLowerCase();
  return k === "µs" || k === "μs" ? "us" : Object.hasOwn(TIME_UNITS, k) ? k : null;
}

const timeLabel = (unit = TIME_UNIT) => TIME_UNITS[unit].label;

// Commas in a whole part of four or more digits: `18309038` → `18,309,038` (fmt::group).
const groupDigits = (s) => String(s).replace(/^([-−+]?)(\d+)/, (_, sign, int) => sign + int.replace(/\B(?=(\d{3})+(?!\d))/g, ","));

// Decimals a time of size `x` (≥ 0, in the shown unit) prints with (fmt::time_digits): every whole
// digit and at least three significant ones (`738,147`, `42.0`, `1.23`, `0.738`, `0.0420`), at most
// `finest`; taken again after rounding, so 99.96 prints `100`, not `100.0`.
function timeDigits(x, finest) {
  const d = (x) => {
    if (x >= 100) return 0;
    if (x >= 10) return 1;
    if (x >= 1) return 2;
    for (let k = 3; k <= Math.max(finest, 3); k++) if (x * 10 ** k >= 100) return Math.min(k, finest);
    return finest;
  };
  const first = d(x);
  return Math.min(d(parseFloat(rfix(x, first))), first);
}

// A time in ms in `unit` (fmt::time_parts): its digits grouped at `d` decimals (its own when null),
// `<0.01` for a nonzero one that would print as 0, the minus sign on a negative one and `+` on a
// positive one when `signed`. `num`: without the unit.
function timeText(ms, { d = null, signed = false, num = false, unit = TIME_UNIT } = {}) {
  if (!Number.isFinite(ms)) return "—";
  const t = TIME_UNITS[unit];
  const x = Math.abs(ms * t.perMs);
  const dd = d ?? timeDigits(x, t.finest);
  let body = "0";
  if (x !== 0) {
    const s = rfix(x, dd);
    body = /[1-9]/.test(s) ? groupDigits(s) : `<${rfix(10 ** -t.finest, t.finest)}`;
  }
  const sign = ms < 0 ? "−" : ms > 0 && signed ? "+" : "";
  return num ? sign + body : `${sign}${body} ${t.label}`;
}

// A time in ms with its unit: `18,309,038 µs`, `16.7 ms`, `0.0167 s` (fmt::time).
const fmtTime = (ms, unit = TIME_UNIT) => timeText(ms, { unit });
// Its number alone, where the unit is named once beside it (fmt::time_number): `18,309,038`.
const fmtTimeNum = (ms, unit = TIME_UNIT) => timeText(ms, { num: true, unit });
// A difference, signed (fmt::time_signed): `+1,234 µs`, `−42.0 µs`, `+<0.01 µs`, `0 µs`.
const fmtTimeSigned = (ms, unit = TIME_UNIT) => timeText(ms, { signed: true, unit });
// Times printed together, an estimate and its interval's ends (fmt::times): each as it prints alone
// (`+3.20 µs [−1.10 … +12.4 µs]`). Shared decimals would print a small end with fewer digits than its
// own (0.05 ms beside 250 ms as `0.1 ms`) or a large one with digits it does not have (`12.40`).
const fmtTimes = (list, signed = false, unit = TIME_UNIT) => list.map((v) => timeText(v, { signed, unit }));

// A comparison's verdict in words (stats::verdict_text): a time's absolute bound or margin (`same
// (±520 µs)`, `no worse (≤1.20 ms, faster)`, `worse (>0.500 s)`) drawn again from `bound` in the shown
// unit; any other verdict as it was stored. `unit`: the metric's.
function verdictText(c, unit) {
  const v = String(c?.verdict ?? "");
  const b = c?.bound;
  if (c?.relative !== false || unit !== "ms" || !(Number.isFinite(b) && b > 0)) return v;
  for (const p of ["same (±", "no worse (≤", "worse (>"]) {
    if (!v.startsWith(p)) continue;
    const rest = v.slice(p.length);
    const ends = [rest.indexOf(")"), rest.indexOf(", ")].filter((i) => i >= 0);
    if (!ends.length) break;
    return p + timeText(b) + rest.slice(Math.min(...ends));
  }
  return v;
}

// An axis tick in ms, in `unit` at the decimals the ticks' step needs (`250,000 µs`, `0.25 s`), signed
// when `signed`; a sign only on what shows a nonzero digit (never `−0 µs`).
function fmtTimeTick(t, ticks, signed = false, unit = TIME_UNIT) {
  const { perMs: k, finest } = TIME_UNITS[unit];
  const fin = ticks.filter(Number.isFinite);
  const step = (fin.length > 1 ? Math.abs(fin[1] - fin[0]) : Math.abs(fin[0] || 0)) * k;
  // Never finer than a time prints (0.01 µs, 0.0001 ms, 0.000001 s): `timeAxis` keeps a step that large.
  const d = step > 0 ? Math.min(finest, Math.max(0, -Math.floor(Math.log10(step) + 1e-9))) : 0;
  const body = `${groupDigits(rfix(Math.abs(t) * k, d))} ${timeLabel(unit)}`;
  if (!/[1-9]/.test(body)) return body;
  return t < 0 ? "−" + body : signed && t > 0 ? "+" + body : body;
}

// A time axis's range in ms, widened about its middle to at least four of the shown unit's finest
// steps, so no two of its ticks print alike (`0.000004 s` three times on one axis).
function timeAxis(lo, hi, unit = TIME_UNIT) {
  const { perMs, finest } = TIME_UNITS[unit];
  const min = (4 * 10 ** -finest) / perMs;
  if (!(hi - lo < min)) return [lo, hi];
  const mid = (lo + hi) / 2;
  return [mid - min / 2, mid + min / 2];
}

// Rust's f64::round: half away from zero (Math.round takes −0.5 to 0).
const rround = (x) => Math.sign(x) * Math.round(Math.abs(x));

// fmt::digits_for: decimals that show a number's first significant digit, from `min` to `max`.
function digitsFor(v, min, max) {
  const a = Math.abs(v);
  if (!Number.isFinite(a) || a === 0) return min;
  // Dust no decimal up to max shows reads at min (fmt::digits_for), not `0.000`.
  let d = 0;
  while (d <= max && rround(a * 10 ** d) < 1) d++;
  if (d > max) d = min;
  return Math.min(max, Math.max(min, d));
}

// The text's `fmt::value`, so every surface prints a number the same way.
function fmtVal(v, u) {
  if (!Number.isFinite(v)) return "—";
  if (u === "ms") return fmtTime(v);
  const d0 = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : digitsFor(v, 2, 4);
  // A value that rounds to zero prints as 0 at two decimals, without a sign (fmt::value).
  let d = d0;
  if (rround(v * 10 ** d) === 0) { v = 0; d = Math.min(d, 2); }
  if (u === "%") return rfix(v, d) + "%";
  if (u === "pp") return rfix(v, d) + " pp";
  // Like every unit (fmt::value): a 0.287 MB heap once printed `0 MB` beside a ±4% interval.
  if (u === "MB") return rfix(v, d) + " MB";
  if (u === "MB/min") return rfix(v, d) + " MB/min";
  if (u === "count/min") return (Math.abs(v) >= 10 ? Math.round(v).toLocaleString("en-US") : rfix(v, 1)) + " /min";
  if (u === "Hz") return rfix(v, 0) + " Hz";
  if (u === "/s") return rfix(v, d) + "/s";
  if (u === "value") return rfix(v, d);
  if (u === "bytes") {
    // fmt::bytes: three significant digits at most, the unit's whole number at least.
    const a = Math.abs(v);
    const scaled = (x, unit) => rfix(x, Math.abs(x) >= 100 ? 0 : Math.abs(x) >= 10 ? 1 : 2) + " " + unit;
    if (a >= 1024 ** 3) return scaled(v / 1024 ** 3, "GB");
    if (a >= 1024 ** 2) return scaled(v / 1024 ** 2, "MB");
    if (a >= 1024) return rfix(v / 1024, Math.abs(v / 1024) >= 10 ? 0 : 1) + " KB";
    return rfix(v, 0) + " B";
  }
  // Grouped like a time (fmt::value): `1,234,567`.
  if (u === "count") return groupDigits(Math.abs(v - Math.round(v)) < 1e-9 ? String(rround(v)) : rfix(v, 1));
  if (u === "instructions") {
    const a = Math.abs(v);
    if (a >= 1e9) return rfix(v / 1e9, 2) + " G instr";
    if (a >= 1e7) return rfix(v / 1e6, 1) + " M instr";
    if (a >= 1e6) return rfix(v / 1e6, 2) + " M instr";
    if (a >= 1e3) return rfix(v / 1e3, 0) + " k instr";
    return rfix(v, 0) + " instr";
  }
  return rfix(v, d) + (u ? " " + u : "");
}

// Round ticks across [lo, hi], about `count` of them: 1, 2 or 5 times a power of ten apart.
function niceTicks(lo, hi, count) {
  if (!(hi > lo)) return [lo];
  const raw = (hi - lo) / Math.max(1, count);
  const mag = 10 ** Math.floor(Math.log10(raw));
  const f = raw / mag;
  const step = (f >= 7.5 ? 10 : f >= 3.5 ? 5 : f >= 1.5 ? 2 : 1) * mag;
  const out = [];
  for (let i = Math.ceil(lo / step - 1e-9); i * step <= hi + 1e-9; i++) {
    out.push(i === 0 ? 0 : +(i * step).toPrecision(10));
  }
  return out;
}
/* ---------- end of the shared time units ---------- */

// A point's value as the text prints it (fmt::value, the shared block's fmtVal); a port's point,
// ln(head / base), as the change.
function val(v, unit) {
  if (v == null || !isFinite(v)) return "—";
  if (unit === "ln_ratio") return pct(Math.exp(v) - 1);
  return fmtVal(v, unit || "");
}
// Values printed together, a median and its interval's ends (fmt::values): times at one set of digits.
const vals = (vs, unit) => unit === "ms" ? fmtTimes(vs) : vs.map(v => val(v, unit));
// fmt::pct: none from 10%, one decimal from 0.1%, below that the first significant digit (up to three),
// so a nonzero change never prints as 0.0%; no sign on what rounds to zero.
const pct = r => {
  if (r == null || !isFinite(r)) return "—";
  const p = Math.abs(r * 100);
  let d = p >= 10 ? 0 : 1;
  if (p > 0 && p < 0.1) {
    while (d <= 3 && Math.round(p * 10 ** d) < 1) d++;
    if (d > 3) d = 1;
  }
  const body = rfix(p, d);
  return (!/[1-9]/.test(body) ? "" : r < 0 ? "−" : "+") + body + "%";
};
// What a point is made of and how sure its interval is: `6 blocks · 97%`, a port's `3 pairs · 75%`.
const sizeOf = (s, p) => `${p.n} ${s.meta.comparison === "implementations" ? "pairs" : "blocks"}${p.confidence ? " · " + Math.round(p.confidence * 100) + "%" : ""}`;
const tone = c => c.state === "confirmed" ? (c.direction === "regression" ? "loss" : "win") : c.state === "rejected" ? "" : "warn";
const colorOf = c => ({ loss: "var(--loss)", win: "var(--win)", warn: "var(--warn)", "": "var(--ink-4)" })[tone(c)];

function chart(s, host) {
  const unit = s.meta.unit || "";
  const pts = s.points;
  const W = 960, H = 240, R = 12, T = 14, B = 26;
  const ys = pts.filter(p => p.valid).flatMap(p => [p.lo ?? p.median, p.hi ?? p.median]).filter(v => v != null);
  if (!ys.length) { host.innerHTML = `<p class="note">No point with a value yet.</p>`; return; }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
  if (unit === "ms") [lo, hi] = timeAxis(lo, hi);
  // The y-axis's labels: round ticks (1, 2 or 5 times a power of ten apart), a time axis in the page's
  // unit at the decimals its step needs (never promoted to seconds); the left margin as wide as the
  // widest label.
  // Bytes print in binary units: their ticks are round in the unit they print in (3.2, 3.3 MB), not in
  // bytes (100,000 B apart reads 3.24, 3.34, 3.43 MB).
  const big = Math.max(Math.abs(lo), Math.abs(hi));
  const per = unit === "bytes" ? (big >= 1024 ** 3 ? 1024 ** 3 : big >= 1024 ** 2 ? 1024 ** 2 : big >= 1024 ? 1024 : 1) : 1;
  const raw = niceTicks(lo / per, hi / per, 4).map(v => v * per);
  const label = v => unit === "ms" ? fmtTimeTick(v, raw) : val(v, unit);
  // A tick that prints like the one below it says nothing more (a score's 0.00002 steps read 0.00):
  // left out.
  const ticks = raw.filter((v, i) => i === 0 || label(v) !== label(raw[i - 1]));
  const labels = ticks.map(label);
  const L = Math.max(64, Math.ceil(Math.max(...labels.map(l => l.length)) * 11 * 0.62) + 10);
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  ticks.forEach((v, k) => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hairline)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(labels[k])}</text>`;
  });
  // Segment medians between change points that are not rejected.
  const cps = s.changes.filter(c => c.state !== "rejected").map(c => ({ c, i: pts.findIndex(p => p.commit === c.bad) })).filter(o => o.i > 0).sort((a, b) => a.i - b.i);
  // A comparator update starts another baseline: no segment median spans it.
  const epochs = (s.marks || []).filter(m => m.t === "epoch").map(m => ({ m, i: pts.findIndex(p => p.commit === m.commit) })).filter(o => o.i > 0);
  const bounds = [...new Set([0, ...cps.map(o => o.i), ...epochs.map(o => o.i), pts.length])].sort((a, b) => a - b);
  for (let k = 0; k + 1 < bounds.length; k++) {
    const seg = pts.slice(bounds[k], bounds[k + 1]).filter(p => p.valid).map(p => p.median).sort((a, b) => a - b);
    if (!seg.length) continue;
    const m = seg.length % 2 ? seg[(seg.length - 1) / 2] : (seg[seg.length / 2 - 1] + seg[seg.length / 2]) / 2;
    g += `<line x1="${x(bounds[k])}" x2="${x(bounds[k + 1] - 1)}" y1="${y(m)}" y2="${y(m)}" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="2"/>`;
  }
  for (const { m, i } of epochs) {
    const cx = (x(i - 1) + x(i)) / 2;
    g += `<line x1="${cx}" x2="${cx}" y1="${T}" y2="${H - B}" stroke="var(--ink-4)" stroke-dasharray="1 3"/><text x="${cx + 4}" y="${H - B - 6}" font-size="11" fill="var(--ink-3)">comparator updated${m.name ? " · " + esc(m.name) : ""}</text>`;
  }
  for (const { c, i } of cps) {
    const cx = (x(i - 1) + x(i)) / 2;
    g += `<line x1="${cx}" x2="${cx}" y1="${T}" y2="${H - B}" stroke="${colorOf(c)}" stroke-dasharray="4 3"/><text x="${cx + 4}" y="${T + 10}" font-size="11" fill="${colorOf(c)}">${esc(c.state)}${c.culprit && c.culprit.short ? " · " + esc(c.culprit.short.slice(0, 7)) : ""}</text>`;
  }
  pts.forEach((p, i) => {
    if (!p.valid) { g += `<text x="${x(i)}" y="${H - B - 4}" text-anchor="middle" font-size="12" fill="var(--ink-4)" data-i="${i}">×</text>`; return; }
    if (p.lo != null && p.hi != null) g += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(p.lo)}" y2="${y(p.hi)}" stroke="var(--base-tone)" stroke-width="2"/>`;
    g += `<circle cx="${x(i)}" cy="${y(p.median)}" r="3.5" fill="var(--head-tone)"/>`;
  });
  pts.forEach((p, i) => { g += `<rect x="${x(i) - 8}" y="${T}" width="16" height="${H - T - B}" fill="transparent" data-i="${i}"/>`; });
  const step = Math.max(1, Math.ceil(pts.length / 10));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="${pts.length > 1 && i === 0 ? "start" : pts.length > 1 && i === pts.length - 1 ? "end" : "middle"}" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">${esc((p.short || "").slice(0, 7))}</text>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg><div class="tip"></div>`;
  const tip = host.querySelector(".tip");
  host.querySelector("svg").addEventListener("mousemove", e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i == null) { tip.style.display = "none"; return; }
    const p = pts[+i];
    tip.innerHTML = `<div class="mono">${esc(p.short)} · ${esc((p.at || "").slice(0, 16))}</div><div>${esc(p.subject)}</div>` +
      (p.valid ? `<div class="mono">${(([m, l, h]) => `${esc(m)} [${esc(l)} … ${esc(h)}]`)(vals([p.median, p.lo, p.hi], unit))} · ${esc(sizeOf(s, p))}</div>` : `<div>no value: ${esc(p.why)}</div>`) +
      `<div class="mono sub">${esc(p.exp)}</div>`;
    const r = host.getBoundingClientRect();
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 300) + "px";
    tip.style.top = (e.clientY - r.top + 12) + "px";
  });
  host.querySelector("svg").addEventListener("mouseleave", () => tip.style.display = "none");
}

function changeRow(s, c) {
  // A port's confirmation compares the head alone, in its metric's unit (never a log ratio).
  const unit = (s.meta.comparison === "implementations" ? s.meta.metric_unit : s.meta.unit) || "";
  // A change is signed either way: a difference in the unit too (`−1.20 ms`, not `1.20 ms`).
  const f = (v, rel) => rel ? pct(v) : v == null || !isFinite(v) ? "—" : unit === "ms" ? fmtTimeSigned(v) : (val(Math.abs(v), unit) === val(0, unit) ? "" : v < 0 ? "−" : v > 0 ? "+" : "") + val(Math.abs(v), unit);
  const cf = c.confirm || {};
  // A paired difference of times and its interval at the digits they share (fmt::times).
  const [ce, cl, ch] = !cf.relative && unit === "ms" && [cf.estimate, cf.lo, cf.hi].every(Number.isFinite) ? fmtTimes([cf.estimate, cf.lo, cf.hi], true) : [f(cf.estimate, cf.relative), f(cf.lo, cf.relative), f(cf.hi, cf.relative)];
  return `<tr><td class="mono">${esc(c.id)}</td><td><span class="pill ${tone(c)}">${esc(c.state)} ${esc(c.direction)}</span></td>
    <td class="mono">${esc(c.good_short)}..${esc(c.bad_short)}</td><td class="num mono">${esc(f(c.estimate, c.relative))}</td>
    <td class="mono">${cf.verdict ? esc(ce) + " [" + esc(cl) + " … " + esc(ch) + "] " + esc(verdictText(cf, unit)) + "<br><span class='sub'>" + esc(cf.exp) + "</span>" : esc(c.why || "")}</td>
    <td>${c.culprit && c.culprit.short ? `<span class="mono">${esc(c.culprit.short)}</span> ${esc(c.culprit.subject)}` : c.bisect && c.bisect.verdict ? esc(c.bisect.verdict) : "—"}${c.alerted ? `<div class="sub">alerted: ${esc(c.alerted.text)}</div>` : ""}</td></tr>`;
}

function render() {
  const app = document.getElementById("app");
  if (!DATA) { app.innerHTML = "<p>No data.</p>"; return; }
  const units = Object.entries(TIME_UNITS).map(([k, t]) => `<button type="button" data-unit="${k}" aria-pressed="${TIME_UNIT === k}" title="Times in ${t.name}">${t.label}</button>`).join("");
  let html = `<header class="topbar"><div><h1>History</h1><div class="sub">${esc(DATA.device)} · ${DATA.series.length} series · ${esc(DATA.created)}</div></div>
    <div class="seg" role="group" aria-label="Time unit" title="Show every time in this unit">${units}</div></header>
    <div class="legend"><span>● median of a commit's blocks</span><span>│ its interval (each point says how sure: 6 blocks reach 97%, 3 pairs 75%)</span><span>— segment median</span><span>┊ change point (confirmed regressions red, improvements green, unconfirmed amber, rejected grey)</span><span>┆ comparator updated (a new baseline: segments restart)</span><span>× no value (refused)</span></div>`;
  DATA.series.forEach((s, k) => {
    const fp = s.meta.fingerprint || {};
    const m = fp.machine || {};
    const port = s.meta.comparison === "implementations";
    html += `<section class="card"><div><h2>${esc(s.meta.label)} · ${esc(s.meta.metric)}${port ? ` · ${esc(s.meta.head_name)} / ${esc(s.meta.base_name)}` : ""}</h2>
      <div class="sub mono">${esc(s.id)} · ${esc(s.meta.file)}</div>
      <div class="sub">${esc([m.os, m.cpu, m.gpu, "strobe " + m.strobe, "power " + fp.power, "session " + fp.session, "display " + fp.display, fp.pin].filter(Boolean).join(" · "))}</div></div>
      <div class="chart" id="c${k}"></div>
      ${s.changes.length ? `<table><tr><th>change</th><th>state</th><th>range</th><th>history</th><th>paired A/B</th><th>culprit</th></tr>${s.changes.map(c => changeRow(s, c)).join("")}</table>` : `<p class="note">No change points.</p>`}
      <details><summary>${s.points.length} points</summary><table><tr><th>date</th><th>commit</th><th>subject</th><th>median</th><th>interval</th><th>n</th><th>experiment</th></tr>
      ${s.points.slice().reverse().map(p => `<tr class="${p.valid ? "" : "invalid"}"><td class="mono">${esc((p.at || "").slice(0, 10))}</td><td class="mono">${esc(p.short)}</td><td>${esc(p.subject)}</td>
        ${(([m, l, h]) => `<td class="num mono">${p.valid ? esc(m) : "—"}</td><td class="mono">${p.valid ? esc(l) + " … " + esc(h) : esc(p.why)}</td>`)(vals([p.median, p.lo, p.hi], s.meta.unit))}<td class="num mono">${p.valid ? esc(sizeOf(s, p)) : p.n}</td><td class="mono sub">${esc(p.exp)}</td></tr>`).join("")}</table></details>
      ${(s.marks || []).length ? `<p class="note">${s.marks.map(m => m.t === "epoch" ? `Comparator updated (${esc(m.name)} ${esc(m.from)} → ${esc(m.to)}) at ${esc(m.short)}` : `${esc(m.from)} → ${esc(m.to)} at ${esc(m.short)}`).join("<br>")}</p>` : ""}
      <p class="note">${port ? `Points are ln(${esc(s.meta.head_name)} / ${esc(s.meta.base_name)}) of a few alternating pairs and never decide anything: a change point is a suspicion until a paired A/B of ${esc(s.meta.head_name)} alone at the commits around it confirms it.` : "Points are single-build blocks and never decide anything: a change point is a suspicion until a paired A/B of the commits around it confirms it."}</p></section>`;
  });
  // Redrawn in place: the points tables stay open as they were.
  const open = [...app.querySelectorAll("details")].map(d => d.open);
  app.innerHTML = html;
  app.querySelectorAll("details").forEach((d, i) => { if (open[i]) d.open = true; });
  app.querySelectorAll('[aria-label="Time unit"] button').forEach(b => b.addEventListener("click", () => setTimeUnit(b.dataset.unit)));
  DATA.series.forEach((s, k) => chart(s, document.getElementById("c" + k)));
}

// Every time on the page in one unit (`#unit=us|ms|s` in the address, kept with any other keys there).
function setTimeUnit(unit) {
  if (!Object.hasOwn(TIME_UNITS, unit)) return;
  TIME_UNIT = unit;
  const p = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  p.set("unit", unit);
  history.replaceState(null, "", "#" + p.toString());
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

TIME_UNIT = parseTimeUnit(new URLSearchParams((location.hash || "").replace(/^#/, "")).get("unit")) || parseTimeUnit(DATA?.default_unit) || "us";
// An address edited by hand to another unit redraws in it; one without `unit=` goes back to the page's own.
addEventListener("hashchange", () => {
  const u = parseTimeUnit(new URLSearchParams(location.hash.replace(/^#/, "")).get("unit")) || parseTimeUnit(DATA?.default_unit) || "us";
  if (u !== TIME_UNIT) { TIME_UNIT = u; render(); }
});
render();
</script>
</body>
</html>
