<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Strobe Report</title>
<style>
:root {
  --canvas: #f6f7f9;
  --surface: #ffffff;
  --surface-subtle: #f0f2f6;
  --surface-hover: #f3f5f8;
  --surface-drawer: #f8fafc;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #64748b;
  --ink-4: #94a3b8;
  --border: rgba(15, 23, 42, 0.085);
  --border-strong: rgba(15, 23, 42, 0.15);
  --hairline: rgba(15, 23, 42, 0.065);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);

  --win: #059669;
  --win-ink: #065f46;
  --win-bg: rgba(5, 150, 105, 0.09);
  --win-border: rgba(5, 150, 105, 0.24);

  --loss: #dc2626;
  --loss-ink: #991b1b;
  --loss-bg: rgba(220, 38, 38, 0.09);
  --loss-border: rgba(220, 38, 38, 0.24);

  --warn: #d97706;
  --warn-ink: #92400e;
  --warn-bg: rgba(217, 119, 6, 0.085);
  --warn-border: rgba(217, 119, 6, 0.26);

  --neutral-pill-bg: rgba(15, 23, 42, 0.055);
  --neutral-pill-border: rgba(15, 23, 42, 0.12);

  --accent: #2563eb;
  --accent-bg: rgba(37, 99, 235, 0.08);
  --base-tone: #94a3b8;
  --head-tone: #1e293b;
  --equiv-band: rgba(15, 23, 42, 0.042);
  --equiv-stroke: rgba(15, 23, 42, 0.16);

  /* Phase colors (Script, Style, Layout, Other) */
  --ph-script: #3b82f6;
  --ph-style: #8b5cf6;
  --ph-layout: #d97706;
  --ph-other: #cbd5e1;

  --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --display: "SF Pro Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0b0d11;
    --surface: #12161e;
    --surface-subtle: #171c26;
    --surface-hover: #1a202c;
    --surface-drawer: #0f131a;
    --ink: #f1f5f9;
    --ink-2: #cbd5e1;
    --ink-3: #94a3b8;
    --ink-4: #64748b;
    --border: rgba(255, 255, 255, 0.085);
    --border-strong: rgba(255, 255, 255, 0.16);
    --hairline: rgba(255, 255, 255, 0.065);
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.28);

    --win: #34d399;
    --win-ink: #6ee7b7;
    --win-bg: rgba(52, 211, 153, 0.12);
    --win-border: rgba(52, 211, 153, 0.28);

    --loss: #f87171;
    --loss-ink: #fca5a5;
    --loss-bg: rgba(248, 113, 113, 0.12);
    --loss-border: rgba(248, 113, 113, 0.28);

    --warn: #fbbf24;
    --warn-ink: #fcd34d;
    --warn-bg: rgba(251, 191, 36, 0.10);
    --warn-border: rgba(251, 191, 36, 0.28);

    --neutral-pill-bg: rgba(255, 255, 255, 0.07);
    --neutral-pill-border: rgba(255, 255, 255, 0.13);

    --accent: #60a5fa;
    --accent-bg: rgba(96, 165, 250, 0.13);
    --base-tone: #64748b;
    --head-tone: #e2e8f0;
    --equiv-band: rgba(255, 255, 255, 0.045);
    --equiv-stroke: rgba(255, 255, 255, 0.16);

    --ph-script: #60a5fa;
    --ph-style: #a78bfa;
    --ph-layout: #fbbf24;
    --ph-other: #334155;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: var(--canvas);
  color: var(--ink);
  font: 14px/20px var(--sans);
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}

body { min-width: 320px; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font: 12px/18px var(--mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }

/* Page shell */
.shell {
  max-width: 1040px;
  margin: 0 auto;
  padding: 28px 32px 80px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

@media (max-width: 640px) {
  .shell { padding: 16px 16px 56px; gap: 20px; }
}

/* Top bar */
header.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  min-width: 0;
}

.wordmark {
  font: 600 14px/20px var(--display);
  letter-spacing: -0.02em;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.wordmark::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--ink);
}

.sep { color: var(--ink-4); user-select: none; }
.meta-suite { font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.meta-dim { color: var(--ink-3); font-size: 13px; }

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.ref-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  color: var(--ink-2);
  font: 12px/16px var(--mono);
  max-width: 340px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.aa-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  color: var(--warn-ink);
  font: 600 12px/16px var(--sans);
}

.btn-ghost {
  height: 28px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-2);
  font: 500 12px/16px var(--sans);
  cursor: pointer;
  white-space: nowrap;
  transition: background 120ms, color 120ms, border-color 120ms;
}
.btn-ghost:hover { background: var(--surface-hover); color: var(--ink); }
.btn-ghost[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.btn-ghost.copied { color: var(--win-ink); border-color: var(--win-border); }

/* Multi-series Experiment Scorecard */
.scorecard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

.sc-item {
  text-align: left;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 140ms, box-shadow 140ms, background 140ms;
}
.sc-item:hover { border-color: var(--border-strong); background: var(--surface-hover); }
.sc-item[aria-selected="true"] { border-color: var(--ink); box-shadow: var(--shadow); background: var(--surface); }

.sc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sc-name { font: 600 13px/18px var(--sans); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-4); }
.sc-dot.win { background: var(--win); }
.sc-dot.loss { background: var(--loss); }
.sc-dot.warn { background: var(--warn); }

.sc-verdict { font: 600 15px/20px var(--display); letter-spacing: -0.015em; color: var(--ink); font-variant-numeric: tabular-nums; }
.sc-verdict.win { color: var(--win-ink); }
.sc-verdict.loss { color: var(--loss-ink); }
.sc-verdict.warn { color: var(--warn-ink); }
.sc-sub { font: 12px/16px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Elevated Card Surface */
.card-surface {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* Verdict Hero & Multi-Warning Caveat Banner */
.caveat-bar {
  padding: 12px 32px;
  background: var(--warn-bg);
  border-bottom: 1px solid var(--warn-border);
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  line-height: 20px;
}
.caveat-item { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.caveat-label {
  font-weight: 600;
  color: var(--warn-ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.caveat-label::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
}
.caveat-text { color: var(--ink-2); flex: 1 1 260px; }

.hero-body {
  padding: 32px 36px 30px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

@media (max-width: 640px) {
  .caveat-bar { padding: 12px 18px; }
  .hero-body { padding: 22px 18px 20px; gap: 20px; }
}

.hero-header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font: 600 12px/18px var(--sans);
  background: var(--neutral-pill-bg);
  border: 1px solid var(--neutral-pill-border);
  color: var(--ink-2);
}
.status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-pill.win { background: var(--win-bg); border-color: var(--win-border); color: var(--win-ink); }
.status-pill.loss { background: var(--loss-bg); border-color: var(--loss-border); color: var(--loss-ink); }
.status-pill.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }

.eyebrow-meta { font: 500 12px/18px var(--sans); letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-3); }
.shown-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font: 400 12px/16px var(--sans); color: var(--ink-2); }
.shown-row.warn { color: var(--warn-ink); }
.vid-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.vid-side { margin: 0; min-width: 0; }
.vid-cap { font: 400 12px/16px var(--sans); color: var(--ink-2); margin-bottom: 6px; overflow-wrap: anywhere; }
.vid-el { display: block; width: 100%; background: #000; border-radius: 6px; border: 1px solid var(--border); }
.vid-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 6px; }
.vid-rates { display: inline-flex; gap: 4px; }
.vid-time { color: var(--ink-2); font-size: 12px; margin-left: auto; }
.vid-strip { display: block; width: 100%; height: auto; cursor: crosshair; }
.vid-strip .vid-tick { font: 9px var(--mono); fill: var(--ink-4); }
.vid-strip .vid-grid-line { stroke: var(--hairline); stroke-width: 1; vector-effect: non-scaling-stroke; }
.vid-strip .vid-run { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.vid-strip .vid-run.warm { fill: var(--surface-subtle); stroke: var(--border-strong); }
.vid-strip .vid-phase { fill: var(--ph-style); cursor: pointer; }
.vid-strip .vid-mark { cursor: pointer; }
.vid-strip .vid-mark line { stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.vid-strip .vid-mark circle { fill: var(--ink); }
.vid-strip .vid-mark circle.vid-react { fill: var(--win); }
.vid-strip .vid-mark:hover line { stroke: var(--accent); }
.vid-strip .vid-head { stroke: var(--loss); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.vid-legend { margin-top: 6px; }
.shown-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.shown-thumb { width: 96px; height: auto; border: 1px solid var(--border); display: block; }
.shown-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }

.hero-headline {
  font: 650 34px/42px var(--display);
  letter-spacing: -0.028em;
  color: var(--ink);
  text-wrap: balance;
}
@media (max-width: 640px) { .hero-headline { font-size: 26px; line-height: 32px; } }

.hero-prose { font: 15px/24px var(--sans); color: var(--ink-2); max-width: 66ch; text-wrap: pretty; }
.hero-prose strong { color: var(--ink); font-weight: 600; }

.hero-metrics-grid {
  padding-top: 22px;
  border-top: 1px solid var(--hairline);
  display: grid;
  grid-template-columns: minmax(295px, 0.95fr) minmax(0, 1.3fr);
  gap: 24px 32px;
  align-items: center;
}
@media (max-width: 820px) { .hero-metrics-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

.ba-compare {
  display: inline-grid;
  grid-template-columns: minmax(0, auto) auto minmax(0, auto);
  align-items: end;
  gap: 16px;
  max-width: 100%;
}
.ba-col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ba-label { font: 500 12px/16px var(--sans); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.swatch.base { border: 1.5px solid var(--base-tone); background: transparent; }
.swatch.head { background: var(--head-tone); }
.swatch.head.win { background: var(--win); }
.swatch.head.loss { background: var(--loss); }

.ba-val { font: 600 26px/32px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.ba-val.muted { color: var(--ink-2); font-weight: 500; }
.ba-arrow { font: 400 20px/32px var(--sans); color: var(--ink-4); }
.ba-commits {
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font: 12px/17px var(--sans);
  color: var(--ink-2);
}
.ba-commits div {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ba-commits span.k { color: var(--ink-3); font-family: var(--mono); font-size: 11px; margin-right: 6px; }

/* Single-sided attribution & Live Heap */
.single-row {
  display: grid;
  grid-template-columns: minmax(180px, 1.6fr) minmax(100px, 1.15fr) 92px 86px;
  column-gap: 16px;
  align-items: center;
  min-height: 38px;
  padding: 6px 24px;
  border-top: 1px solid var(--hairline);
}
.single-row.clickable { cursor: pointer; }
.single-row.clickable:hover { background: var(--surface-hover); }
.single-row.hd {
  border-top: 0;
  min-height: 30px;
  padding: 4px 24px;
  font-size: 11.5px;
  color: var(--ink-3);
  background: var(--surface-subtle);
}
@media (max-width: 720px) {
  .single-row {
    grid-template-columns: minmax(0, 1.4fr) minmax(64px, 0.8fr) 78px;
    padding: 7px 16px;
    column-gap: 10px;
  }
  .single-row .col-share { display: none; }
}

.share-track {
  height: 8px;
  border-radius: 4px;
  background: var(--surface-subtle);
  overflow: hidden;
}
.share-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
  opacity: 0.82;
}
.share-fill.warn { background: var(--warn); opacity: 0.88; }

.heap-explain {
  padding: 11px 24px;
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--hairline);
  font-size: 12.5px;
  line-height: 19px;
  color: var(--ink-2);
}
.heap-explain b { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .heap-explain { padding: 10px 16px; } }

.heap-subhd {
  padding: 12px 24px 6px;
  font: 600 11.5px/16px var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.heap-subhd span.sub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
@media (max-width: 640px) { .heap-subhd { padding: 10px 16px 6px; } }

.detached-banner {
  padding: 10px 24px;
  background: var(--warn-bg);
  border-top: 1px solid var(--warn-border);
  border-bottom: 1px solid var(--warn-border);
  font-size: 12.5px;
  color: var(--warn-ink);
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
@media (max-width: 640px) { .detached-banner { padding: 10px 16px; } }

.retainer-steps {
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.ret-step {
  display: flex;
  align-items: baseline;
  gap: 7px;
  font: 11.5px/17px var(--mono);
  min-width: 0;
}
.ret-idx { color: var(--ink-4); font-size: 10.5px; min-width: 18px; }
.ret-edge { color: var(--accent); white-space: nowrap; }
.ret-node { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.ret-meta { color: var(--ink-4); font-size: 11px; white-space: nowrap; }

.more-frames-btn {
  align-self: flex-start;
  margin: 3px 0 3px 16px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px dashed var(--border-strong);
  background: var(--surface-subtle);
  color: var(--ink-3);
  font: 500 11px/16px var(--sans);
  cursor: pointer;
}
.more-frames-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.ba-foot { margin-top: 8px; font: 12px/18px var(--sans); color: var(--ink-3); }

/* Equivalence & CI Ruler */
.ruler-box { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ruler-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; }
.ruler-title { color: var(--ink-2); }
.ruler-title b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ruler-ci-tag { color: var(--ink-3); font: 11.5px/16px var(--mono); }

/* Open Editorial 4-Pillar Strip */
.pillars-section { display: flex; flex-direction: column; gap: 12px; }
.sec-heading-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.sec-title { font: 600 15px/22px var(--display); letter-spacing: -0.012em; color: var(--ink); }
.sec-sub { font: 13px/20px var(--sans); color: var(--ink-3); }

.pillars-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--border-strong);
  border-bottom: 1px solid var(--border);
}

.pillar {
  padding: 18px 18px 18px 16px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.pillar:first-child { border-left: 0; padding-left: 0; }
.pillar:last-child { padding-right: 0; }

@media (max-width: 900px) {
  .pillars-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pillar:nth-child(1), .pillar:nth-child(3) { border-left: 0; padding-left: 0; }
  .pillar:nth-child(2), .pillar:nth-child(4) { padding-right: 0; }
  .pillar:nth-child(n+3) { border-top: 1px solid var(--border); }
}
@media (max-width: 520px) {
  .pillars-grid { grid-template-columns: minmax(0, 1fr); }
  .pillar { border-left: 0 !important; padding: 14px 0 !important; border-top: 1px solid var(--border); }
  .pillar:first-child { border-top: 0; }
}

.pil-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.pil-name { font: 600 12px/16px var(--sans); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
.pil-tag { font: 500 11px/16px var(--sans); color: var(--ink-3); }
.pil-tag.win { color: var(--win-ink); font-weight: 600; }
.pil-tag.loss { color: var(--loss-ink); font-weight: 600; }

.pil-big-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.pil-val { font: 600 22px/28px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.pil-val.inactive { font-size: 15px; line-height: 24px; font-weight: 500; color: var(--ink-3); }
.pil-delta { font: 500 12px/18px var(--mono); color: var(--ink-2); }
.pil-delta.win { color: var(--win-ink); font-weight: 600; }
.pil-delta.loss { color: var(--loss-ink); font-weight: 600; }
.pil-caption { font: 12px/18px var(--sans); color: var(--ink-3); margin-bottom: 6px; }

.pil-subs { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 4px; }
.pil-subrow { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 11.5px; line-height: 18px; }
.pil-subrow .k { color: var(--ink-3); white-space: nowrap; }
.pil-subrow .v { font-family: var(--mono); font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.pil-subrow .v.win { color: var(--win-ink); }
.pil-subrow .v.loss { color: var(--loss-ink); }

/* Editorial Deep-Dive Divider */
.zone-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-top: 8px;
}
.zone-divider-label {
  font: 600 11.5px/16px var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  white-space: nowrap;
}
.zone-divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--border-strong);
}

/* Structured Section Cards */
.card-hd {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.card-hd-left { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.card-hd-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-bd { padding: 20px 24px 22px; }
.card-bd.flush { padding: 0; }
@media (max-width: 640px) {
  .card-hd { padding: 14px 16px 12px; }
  .card-bd { padding: 16px; }
}

.win-count-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font: 500 12px/18px var(--sans);
  background: var(--surface-subtle);
  color: var(--ink-2);
}
.win-count-pill.win { background: var(--win-bg); color: var(--win-ink); font-weight: 600; }
.win-count-pill.loss { background: var(--loss-bg); color: var(--loss-ink); font-weight: 600; }

select.metric-picker {
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  font: 12px/18px var(--sans);
  max-width: 240px;
}

.seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 7px;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 3px 10px;
  border-radius: 5px;
  font: 500 12px/16px var(--sans);
  color: var(--ink-3);
  cursor: pointer;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

/* Pair-by-pair Evidence */
.evi-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 820px) { .evi-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
.plot-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.plot-caption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.plot-caption span.dim { color: var(--ink-3); font-size: 12px; }
.chart-host { position: relative; width: 100%; overflow: hidden; }

/* Main-Thread Phase Breakdown (Timed) */
.phase-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.phase-bar-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 76px; gap: 12px; align-items: center; }
.phase-track { height: 14px; border-radius: 4px; background: var(--surface-subtle); overflow: hidden; display: flex; }
.phase-seg { height: 100%; display: block; }
.ph-script { background: var(--ph-script); }
.ph-style { background: var(--ph-style); }
.ph-layout { background: var(--ph-layout); }
.ph-other { background: var(--ph-other); }

.phase-table { border-top: 1px solid var(--hairline); }
.phase-trow {
  display: grid;
  grid-template-columns: minmax(130px, 1.2fr) minmax(130px, 1.2fr) 92px minmax(110px, 1fr);
  gap: 12px;
  align-items: center;
  min-height: 34px;
  padding: 4px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 12.5px;
}
.phase-trow.hd { font-size: 11.5px; color: var(--ink-3); min-height: 28px; }
@media (max-width: 640px) {
  .phase-trow { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 78px; }
  .phase-trow .ph-ci-col { display: none; }
}
.ph-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 7px; }

/* Attribution Tables & Expandable Stack Drawers */
.attr-note {
  padding: 10px 24px;
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--hairline);
  font-size: 12.5px;
  line-height: 18px;
  color: var(--ink-2);
}

.attr-table { display: flex; flex-direction: column; }
.attr-row {
  display: grid;
  grid-template-columns: minmax(180px, 1.55fr) 136px minmax(110px, 1.35fr) 92px;
  column-gap: 16px;
  align-items: center;
  min-height: 38px;
  padding: 6px 24px;
  border-top: 1px solid var(--hairline);
}
.attr-row.clickable { cursor: pointer; }
.attr-row.clickable:hover { background: var(--surface-hover); }
.attr-row.hd {
  border-top: 0;
  min-height: 30px;
  padding: 4px 24px;
  font-size: 11.5px;
  color: var(--ink-3);
  background: var(--surface-subtle);
}

@media (max-width: 720px) {
  .attr-row {
    grid-template-columns: minmax(0, 1.4fr) minmax(72px, 0.9fr) 78px;
    padding: 7px 16px;
    column-gap: 10px;
  }
  .attr-row .col-ba { display: none; }
  .attr-note { padding: 10px 16px; }
}

.fn-stack-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fn-primary-line { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.row-exp-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-4);
  width: 12px;
  height: 12px;
  flex: none;
  transition: transform 120ms;
  position: relative;
  top: 1px;
}
.row-exp-icon.open { transform: rotate(90deg); color: var(--ink-2); }
.fn-name { font: 500 12.5px/18px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn-where { font: 11.5px/16px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 2; }
.fn-caller-hint {
  font: 11px/16px var(--mono);
  color: var(--ink-3);
  padding-left: 17px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fn-caller-hint b { font-weight: 500; color: var(--ink-2); }

@media (max-width: 640px) {
  .fn-primary-line { flex-wrap: wrap; gap: 2px 6px; }
}

.div-track { position: relative; height: 20px; }
.div-zero { position: absolute; left: 50%; top: 2px; bottom: 2px; width: 1px; background: var(--border-strong); }
.div-bar { position: absolute; top: 5px; height: 10px; border-radius: 2px; }
.div-bar.saved { background: var(--win); opacity: 0.85; }
.div-bar.saved-aa { background: var(--accent); opacity: 0.75; }
.div-bar.added { background: var(--ink-4); opacity: 0.75; }
.div-bar.added-warn { background: var(--loss); opacity: 0.78; }

/* Expanded Stack & Full Path Drawer */
.stack-drawer {
  padding: 12px 24px 16px 41px;
  background: var(--surface-drawer);
  border-top: 1px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 12px;
}
@media (max-width: 640px) { .stack-drawer { padding: 10px 16px 14px; } }

.full-loc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.full-loc-code {
  font: 11.5px/17px var(--mono);
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  overflow-wrap: anywhere;
}
.mini-copy {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-3);
  border-radius: 4px;
  padding: 2px 7px;
  font: 500 11px/15px var(--sans);
  cursor: pointer;
}
.mini-copy:hover { color: var(--ink); background: var(--surface-hover); }
.mini-copy.copied { color: var(--win-ink); border-color: var(--win-border); }

.stacks-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.stack-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stack-block-hd {
  font: 600 11px/15px var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
}
.stack-frames { display: flex; flex-direction: column; gap: 3px; }
.stack-fr {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font: 11.5px/17px var(--mono);
  min-width: 0;
}
.stack-fr .fr-arrow { color: var(--ink-4); flex: none; }
.stack-fr .fr-fn { color: var(--ink); font-weight: 500; white-space: nowrap; }
.stack-fr .fr-loc {
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.stack-fr .fr-loc:hover { color: var(--accent); text-decoration: underline; }

.attr-foot { padding: 10px 24px; border-top: 1px solid var(--hairline); font: 11.5px/18px var(--mono); color: var(--ink-3); }
@media (max-width: 640px) { .attr-foot { padding: 10px 16px; } }

/* Mini Summary Strip (used in Forced Layout & Allocations/GC) */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  border-bottom: 1px solid var(--hairline);
}
.stat-cell {
  padding: 14px 20px;
  border-left: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.stat-cell:first-child { border-left: 0; }
@media (max-width: 640px) {
  .stat-strip { grid-template-columns: 1fr 1fr; }
  .stat-cell:nth-child(odd) { border-left: 0; }
  .stat-cell:nth-child(n+3) { border-top: 1px solid var(--hairline); }
}
.stat-k { font: 600 11px/15px var(--sans); text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-3); }
.stat-v { font: 600 16px/22px var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.stat-sub { font: 11.5px/16px var(--mono); color: var(--ink-3); }

/* Frame Pacing */
.pacing-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 28px; align-items: center; }
@media (max-width: 820px) { .pacing-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
.missed-rows { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.missed-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 92px; gap: 10px; align-items: center; }
.missed-lbl { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.missed-bar-bg { height: 12px; border-radius: 4px; background: var(--surface-subtle); overflow: hidden; display: flex; }
.missed-seg-2 { background: var(--ink-4); opacity: 0.65; }
.missed-seg-3 { background: var(--warn); opacity: 0.85; }
.missed-seg-4 { background: var(--loss); opacity: 0.9; }

.legend-inline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }
.legend-inline > span { display: inline-flex; align-items: center; gap: 5px; }
.lg-box { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* Next steps */
.next-list { display: flex; flex-direction: column; gap: 14px; }
.next-item { display: flex; flex-direction: column; gap: 6px; }
.next-why { font-size: 13.5px; color: var(--ink-2); }
.next-why b { color: var(--ink); font-weight: 600; }
.cmd-box { display: flex; align-items: center; border-radius: 8px; background: var(--surface-subtle); border: 1px solid var(--border); overflow: hidden; }
.cmd-box code { flex: 1; padding: 8px 12px; font: 12px/18px var(--mono); color: var(--ink); overflow-x: auto; white-space: nowrap; }
.cmd-copy { border: 0; border-left: 1px solid var(--border); background: var(--surface); color: var(--ink-2); padding: 8px 14px; font: 500 12px/18px var(--sans); cursor: pointer; flex: none; }
.cmd-copy:hover { background: var(--surface-hover); color: var(--ink); }
.cmd-copy.copied { color: var(--win-ink); font-weight: 600; }

/* Progressive Disclosures (<details>) */
details.disclosure { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
details.disclosure > summary { list-style: none; cursor: pointer; padding: 15px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; user-select: none; }
details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary:hover { background: var(--surface-hover); }
details.disclosure[open] > summary { border-bottom: 1px solid var(--hairline); }
.chev { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; color: var(--ink-3); transition: transform 140ms; flex: none; }
details[open] > summary .chev { transform: rotate(90deg); }
@media (max-width: 640px) { details.disclosure > summary { padding: 14px 16px; } }

/* All Metrics Forest Table */
.forest-wrap { overflow-x: auto; }
.forest-row {
  display: grid;
  grid-template-columns: minmax(175px, 1.4fr) 74px 74px 72px minmax(150px, 1.8fr) 136px 116px;
  column-gap: 12px;
  align-items: center;
  min-height: 34px;
  padding: 4px 24px;
  border-top: 1px solid var(--hairline);
  cursor: pointer;
  min-width: 740px;
}
.forest-row:hover { background: var(--surface-hover); }
.forest-row.hd { border-top: 0; cursor: default; background: var(--surface-subtle); color: var(--ink-3); font-size: 11.5px; min-height: 30px; }
.forest-row.hd:hover { background: var(--surface-subtle); }
.forest-row.focused { background: var(--accent-bg); }
.forest-group { padding: 10px 24px 4px; font: 600 11px/16px var(--sans); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); border-top: 1px solid var(--border); min-width: 740px; }

.f-track { position: relative; height: 22px; }
.f-band { position: absolute; top: 3px; bottom: 3px; background: var(--equiv-band); border-left: 1px dashed var(--equiv-stroke); border-right: 1px dashed var(--equiv-stroke); }
.f-zero { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--ink-4); }
.f-ci { position: absolute; top: 10px; height: 2px; background: var(--ink-3); border-radius: 1px; }
.f-dot { position: absolute; top: 11px; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink-2); }
.f-clip { position: absolute; top: 4px; font: 600 11px/14px var(--mono); color: var(--ink-3); }
.f-clip.l { left: 0; }
.f-clip.r { right: 0; }
.f-row-win .f-ci, .f-row-win .f-dot { background: var(--win); }
.f-row-win .f-clip { color: var(--win); }
.f-row-loss .f-ci, .f-row-loss .f-dot { background: var(--loss); }
.f-row-loss .f-clip { color: var(--loss); }
.f-row-desc .f-dot { background: var(--surface); border: 1.5px solid var(--ink-3); }

/* Memory Recording (Leak Hunt) */
.leak-metrics-grid {
  padding-top: 20px;
  border-top: 1px solid var(--hairline);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px 24px;
}
@media (max-width: 860px) { .leak-metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .leak-metrics-grid { grid-template-columns: minmax(0, 1fr); } }

.leak-mcol { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.leak-mk { font: 600 11px/15px var(--sans); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
.leak-mv { font: 600 22px/28px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.leak-mv.warn { color: var(--warn-ink); }
.leak-mv.loss { color: var(--loss-ink); }
.leak-mv.win { color: var(--win-ink); }
.leak-msub { font: 12px/17px var(--sans); color: var(--ink-3); }

.coarse-note {
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  font-size: 12.5px;
  line-height: 19px;
  color: var(--ink-3);
}
.coarse-note b { color: var(--ink-2); font-weight: 600; }

.census-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 28px;
}
@media (max-width: 780px) { .census-grid { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* Insights, Leak Runs, Bisect & Process Memory Layers */
.insights-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.insight-card {
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 12px 16px;
  background: var(--surface-drawer);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.insight-card.warn {
  border-left-color: var(--warn);
  background: var(--warn-bg);
  border-color: var(--warn-border);
  border-left-width: 3px;
}
.ins-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ins-rule {
  font: 600 10.5px/15px var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-3);
}
.insight-card.warn .ins-rule { color: var(--warn-ink); border-color: var(--warn-border); }
.ins-title { font-size: 13px; line-height: 19px; color: var(--ink); overflow-wrap: anywhere; }
.ins-cmds { display: flex; flex-wrap: wrap; gap: 6px; }
.ins-cmd-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  font: 11.5px/16px var(--mono);
  color: var(--ink-2);
  cursor: pointer;
}
.ins-cmd-pill:hover { border-color: var(--accent); color: var(--ink); }
.ins-cmd-pill.copied { color: var(--win-ink); border-color: var(--win-border); }

.movers-block {
  margin-bottom: 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.movers-hd {
  padding: 8px 14px;
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--hairline);
  font: 600 11.5px/16px var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-3);
}
.mover-row {
  display: grid;
  grid-template-columns: 108px minmax(0, 1.4fr) 140px 88px auto;
  gap: 10px;
  align-items: center;
  padding: 6px 14px;
  border-top: 1px solid var(--hairline);
  font-size: 12.5px;
}
.mover-row:first-of-type { border-top: 0; }
@media (max-width: 720px) {
  .mover-row { grid-template-columns: 92px minmax(0, 1fr) 82px; }
  .mover-row .mv-ba, .mover-row .mv-act { display: none; }
}
.mv-kind { font: 500 11px/16px var(--mono); color: var(--ink-3); }

/* Leak Run App vs Engine Split Bar */
.split-bar-wrap { padding: 14px 24px; border-bottom: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 640px) { .split-bar-wrap { padding: 12px 16px; } }
.split-track { height: 12px; border-radius: 4px; background: var(--surface-subtle); overflow: hidden; display: flex; }
.split-app { background: var(--accent); height: 100%; }
.split-v8 { background: var(--ink-4); opacity: 0.45; height: 100%; }

/* Bisect Commit Line & Steps */
.bisect-rail {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 14px 24px;
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--hairline);
}
.bnode {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;

const STROBE = /*STROBE_DATA*/null;

/* Expand integer frame indices against each attribution side's `frame_table` in place (keeps legacy object-frame payloads working too) */
function hydrateAttributionSide(side) {
  const tbl = side?.frame_table;
  if (!Array.isArray(tbl) || !tbl.length) return;
  const lists = [side.rows, side.files, side.whole_host?.rows, side.whole_host?.files, side.startup?.rows, side.startup?.files, side.setup?.rows, side.setup?.files, side.alloc?.rows, side.alloc?.files, side.layout?.rows];
  for (const list of lists) {
    if (!Array.isArray(list)) continue;
    for (const row of list) {
      for (const st of row?.stacks || []) {
        if (Array.isArray(st?.frames)) {
          st.frames = st.frames.map((f) => (typeof f === "number" ? tbl[f] : f)).filter(Boolean);
        }
      }
    }
  }
}

(function hydratePayload(root) {
  const d = root?.data;
  if (!d) return;
  if (d.attribution) hydrateAttributionSide(d.attribution);
  for (const s of d.series || []) {
    if (s?.hotspots?.base) hydrateAttributionSide(s.hotspots.base);
    if (s?.hotspots?.head) hydrateAttributionSide(s.hotspots.head);
  }

const tip = document.getElementById("tip");

  series: 0,
  focusMetric: null,
  hoverPair: null,
  whyBy: "fn",
  /* A script target's CPU profile: its measured runs ("runs"), its whole host process ("host"), the host's startup ("startup") or the bench file's setup ("setup") alone */
  cpuScope: "runs",
  allocBy: "fn",
  cliOpen: false,
  metricsOpen: false,
  queriesOpen: false,
  distOpen: false,
  distKind: "gaps",
  distMode: "cdf",

/* ---------- DOM & SVG Helpers ---------- */

  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;

  const box = h("div", { class: "chart-host", style: `height:${height}px` });

        ? h("div", { style: "color:var(--ink-3)" }, "Only reachable via weak references.")
        : null,
    allocFrames.length
      ? h("div", {},
          h("div", { style: "font:600 11px/16px var(--sans);text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-3);margin-bottom:5px" },
            `Top allocation stack (×${allocSite.count || 1})`
          ),
          h("div", { class: "retainer-steps" },
            allocFrames.slice(0, 6).map((f, i) => {
              const fl = heapLocFull(f) || "";
              return h("div", { class: "ret-step" },
                h("span", { class: "ret-idx" }, i === 0 ? "•" : "←"),
                h("span", { class: "ret-node" }, f.name || "(anonymous)"),
                fl ? h("span", { class: "ret-meta" }, fl) : null
              );
            })
          )
        )
      : null
  );
}

/* ---------- Outcome Classification & Data Queries ---------- */
// A refused comparison's validator and why: its `refusal`, or in results from before it, its verdict's
// words (`refused (TailTooShort): 51 frames < 200`).
function refusalOf(c) {
  if (c?.refusal?.validator) return c.refusal;
  const m = /^refused\s*\(([^)]+)\):?\s*(.*)$/.exec(String(c?.verdict || ""));
  return m ? { validator: m[1], summary: m[2] } : {};
}

// What a comparison decided, from its verdict_kind (its words in results from before that field).
function classify(c, metric, aa) {
  const v = c?.verdict || "";
  const k = c?.verdict_kind;
  if (k === "descriptive" || v === "·") return { kind: "desc", tone: "neutral" };
  if (k === "refused" || /^refused/.test(v)) return { kind: "refused", tone: "warn" };
  if (k === "untested" || v === "—" || !v) return { kind: "unconfirmed", tone: "neutral" };
  if (k === "same" || (!k && v.startsWith("same"))) return { kind: "same", tone: "neutral" };
  // No worse: the interval's worse end inside the margin, which its other end may not be: never a shift.
  if (k === "no_worse" || (!k && v.startsWith("no worse"))) return { kind: "noworse", tone: "neutral" };
  // Only a better or worse verdict has a direction (a stopped or saturated series' interval may clear 0).
  if ((k ? k !== "better" && k !== "worse" : /^(unclear|underpowered|stopped|saturated)/.test(v)) || !(c.hi < 0 || c.lo > 0)) return { kind: "inconclusive", tone: "neutral" };
  if (aa) return { kind: "aa-fp", tone: "warn" };
  const improved = (c.hi < 0) !== higherBetter(metric, c);
  const small = /\(small\)/.test(v);
  return { kind: improved ? (small ? "win-small" : "win") : (small ? "loss-small" : "loss"), tone: improved ? "win" : "loss" };
}

function shortRef(v, other) {
  const raw = String(v?.label || v?.spec || "").replace(/^git:/, "");
  if (raw === ".") return "working tree";
  const sha = (s) => (/^[0-9a-f]{8,40}$/i.test(s) ? s.slice(0, 7) : s);
  const m = /^(.*?)@([0-9a-f]{7,40})(.*)$/i.exec(raw);
  if (!m) return sha(raw);
  const [, pre, rev, tail] = m;
  const otherPre = /^(.*?)@[0-9a-f]{7,40}/i.exec(String(other?.label || ""))?.[1];
  const keepPre = pre && !/^[0-9a-f]{7,40}$/i.test(pre) && !rev.startsWith(pre) && pre !== otherPre;
  return (keepPre ? `${pre}@` : "") + sha(rev) + tail;
}

const timedBlocks = (s) => (s?.blocks || []).filter((b) => finite(b.pair) && b.pair < 1e6);

function dedupWarnings(list) {
  const seen = new Set();
  return list.filter((w) => {
    if (!w) return false;
    const key = `${w.level || ""}\0${w.id || ""}\0${w.text || ""}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function allComparisons(s) {
  return [
    s.primary ? { c: s.primary, role: "primary" } : null,
    ...(s.secondaries || []).map((c) => ({ c, role: "secondary" })),
    ...(s.descriptive || []).map((c) => ({ c, role: "descriptive" })),
  ].filter((x) => x && x.c && x.c.metric);
}

// The blocks that measured `metric`: a series that counts cpu.instructions apart from its times (Linux
// perf events never run in a timing block, SPEC §7.5) keeps the other kind's blocks in `pass`
// (`counters`: whether they are the counter blocks), and so does one that probes HTTP apart from its
// times (SPEC §8.9; `http`: whether they are the probe blocks), as pr.rs `blocks_for`.
function blocksFor(s, metric) {
  const pass = s?.pass;
  if (!pass || !Array.isArray(pass.blocks) || !pass.blocks.length) return s?.blocks || [];
  const theirs = typeof pass.http === "boolean" ? metric.startsWith("http.") === pass.http : (metric === "cpu.instructions") === !!pass.counters;
  return theirs ? pass.blocks : s.blocks || [];
}

function pairsOf(s, metric) {
  // The primary's pairs are those of the look that decided it (`primary_pairs`): pairs run on past it
  // for the secondaries are not in its verdict, tally or plots.
  const k = metric === s?.primary?.metric && finite(s?.primary_pairs) ? s.primary_pairs : Infinity;
  return pairsAll(s, metric).filter((p) => p.pair < k);
}

function pairsAll(s, metric) {
  const blocks = blocksFor(s, metric).filter((b) => finite(b.pair) && b.pair < 1e6);
  const map = new Map();
  blocks.forEach((b, idx) => {
    const entry = map.get(b.pair) || {};
    entry[b.variant] = b;
    entry[b.variant + "Idx"] = idx;
    map.set(b.pair, entry);
  });
  return [...map.entries()]
    .sort((a, b) => a[0] - b[0])
    .filter(([, e]) => e.base && e.head)
    .map(([pair, e]) => ({
      pair,
      base: e.base,
      head: e.head,
      a: e.base.values?.[metric],
      b: e.head.values?.[metric],
      order: e.baseIdx < e.headIdx ? "A → B" : "B → A",
    }))
    .filter((p) => finite(p.a) && finite(p.b));
}

function displayHz(r, blocks) {
  const hz = median((blocks || []).map((b) => b.values?.["display.hz"]));
  return finite(hz) ? hz : finite(r?.refresh_hz) ? r.refresh_hz : NaN;
}

/* ---------- Main Orchestrator ---------- */
function render() {
  observers.forEach((o) => o.disconnect());
  observers = [];
  pairPaintFns = [];
  hideTip();
  const scrollPos = window.scrollY;

  if (!STROBE || !STROBE.data) {
    renderEmpty();
  } else if (STROBE.data.kind === "bisect") {
    renderBisect(STROBE.data);
  } else if (STROBE.view === "recording" || (!STROBE.data.series && STROBE.data.values)) {
    renderRecording(STROBE.data);
  } else {
    renderExperiment(STROBE.data);
  }
  app.querySelectorAll(".chart-host").forEach((box) => box.measureNow());
  window.scrollTo(0, scrollPos);
}

function renderEmpty() {
  document.title = "Strobe Report";
  app.replaceChildren(
    h("div", { class: "shell" },
      h("div", { class: "card-surface empty-card" },
        h("div", { class: "wordmark" }, "strobe"),
        h("h1", { style: "font: 600 22px/28px var(--display)" }, "Benchmark report template"),
        h("p", { style: "color: var(--ink-2)" }, "Generate a self-contained HTML report from any experiment or recording:"),
        cmdRow("strobe report experiment <exp_…> --open"),
        cmdRow("strobe report recording <rec_…> --open")
      )
    )
  );
}

function selectSeries(idx) {
  state.series = idx;
  state.focusMetric = null;
  state.hoverPair = null;
  state.distOpen = false;
  state.openRows.clear();
  state.flameZoom = 0;
  history.replaceState(null, "", "#series=" + idx);
  render();
}

function renderExperiment(r) {
  const seriesList = r.series || [];
  if (state.series >= seriesList.length) state.series = 0;
  const s = seriesList[state.series];
  const aa = !!r.plan?.aa;

  document.title = `strobe · ${r.id || "experiment"}${s ? " · " + (s.case || s.label) : ""}`;

  const baseVar = (r.variants || []).find((v) => v.role === "base");
  const headVar = (r.variants || []).find((v) => v.role === "head");
  const impl = isImpl(r);
  // Two implementations are named by their targets, never by build.
  const baseTag = impl ? sideName(baseVar, "base") : shortRef(baseVar, headVar);
  const headTag = impl ? sideName(headVar, "head") : shortRef(headVar, baseVar);
  SIDES = impl ? { base: baseTag, head: headTag } : null;

  const createdStr = r.created
    ? new Date(r.created).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : null;

  const topbar = h("header", { class: "topbar" },
    h("div", { class: "brand-cluster" },
      h("span", { class: "wordmark" }, "strobe"),
      r.file ? [h("span", { class: "sep" }, "/"), h("span", { class: "meta-suite", title: cleanPath(r.file) }, baseName(r.file))] : null,
      r.id ? [h("span", { class: "sep" }, "·"), h("span", { class: "mono meta-dim" }, r.id)] : null,
      createdStr ? [h("span", { class: "sep" }, "·"), h("span", { class: "meta-dim" }, createdStr)] : null
    ),
    h("div", { class: "top-actions" },
      aa
        ? h("span", { class: "aa-badge", title: "Identical build run on both sides to verify false-positive rate" }, `A/A Control · ${baseTag || headTag}`)
        : baseVar && headVar
          ? h("span", {
              class: "ref-pill",
              title: [
                `${impl ? baseTag : "Base"}: ${baseVar?.spec || baseTag}${baseVar?.subject ? " — " + baseVar.subject : ""}`,
                `${impl ? headTag : "Head"}: ${headVar?.spec || headTag}${headVar?.subject ? " — " + headVar.subject : ""}`,
              ].join("\n"),
            }, impl ? `${headTag} vs ${baseTag}` : `${baseTag} → ${headTag}`)
          : headVar
            ? h("span", { class: "ref-pill", title: `${headVar.spec || headTag}${headVar.subject ? " — " + headVar.subject : ""}` }, headTag)
            : null,
      r.text
        ? h("button", {
            type: "button",
            class: "btn-ghost",
            "aria-pressed": String(state.cliOpen),
            onclick: () => { state.cliOpen = !state.cliOpen; render(); },
          }, state.cliOpen ? "Report view" : "CLI output")
        : null
    )
  );

  const shell = h("div", { class: "shell" }, topbar);
  app.replaceChildren(shell);

  if (state.cliOpen && r.text) {
    shell.append(
      h("section", { class: "card-surface" },
        h("div", { class: "card-hd" },
          h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Plain-text CLI output")),
          h("div", { class: "card-hd-right" }, copyBtn(r.text, "Copy text"))
        ),
        h("pre", { class: "cli-pre" }, r.text)
      )
    );
    return;
  }

  const ledger = renderLedgerBanner(r);
  if (ledger) shell.append(ledger);

  if (!s) {
    shell.append(h("div", { class: "card-surface card-bd" }, "No series recorded in this experiment."));
    return;
  }

  if (s.kind === "leak") {
    renderLeakSeries(shell, r, s, seriesList, aa, baseVar, headVar, baseTag, headTag);
    return;
  }

  if (s.kind === "check") {
    appendKids(shell, [seriesList.length > 1 ? renderScorecard(seriesList, aa) : null, ...renderCheckSeries(r, s), renderHttpSection(seriesHttpEntries(s))]);
    return;
  }

  // `bench --blocks`: one build's blocks, nothing compared.
  if (s.kind === "blocks") {
    appendKids(shell, [seriesList.length > 1 ? renderScorecard(seriesList, aa) : null, ...renderBlocksSeries(r, s)]);
    return;
  }

  // Two implementations share no code: no function diffs, flame diffs or heap diffs, only each side
  // on its own (SPEC §11.2).
  if (impl) {
    const gap = isGap(s) || isUpfront(s);
    const impactI = gap ? null : buildImpactModel(r, s);
    appendKids(shell, [
      renderImplPanel(r, baseVar, headVar),
      gap ? null : renderVerdictCard(r, s, aa, baseTag, headTag, baseVar, headVar),
      gap ? null : renderImpactStrip(s, impactI, aa),
      gap ? null : renderVideoSection(s.video_player),
      gap ? null : renderEvidenceSection(r, s, aa),
      ...renderImplSeries(r, s, baseVar, headVar),
      gap ? null : renderHttpSection(seriesHttpEntries(s)),
      gap ? null : renderNextStepsSection(r, s, aa),
      gap || !impactI.hasStream ? null : renderFramePacingSection(r, s, impactI),
      gap || !impactI.hasStream || !state.distOpen ? null : renderDistExplorer(r, s, impactI),
      gap ? null : renderAllMetricsDisclosure(s, aa),
      gap ? null : renderPlanVsActual(r, s),
      gap ? null : renderRigFooter(r, s, impactI),
    ]);
    return;
  }

  if (isUpfront(s)) {
    appendKids(shell, [seriesList.length > 1 ? renderScorecard(seriesList, aa) : null, renderUpfrontRefusal(s)]);
    return;
  }

  const impact = buildImpactModel(r, s);
  const insightsSection = renderExperimentInsightsSection(r, s);
  const phaseSection = renderMainThreadPhaseSection(s, aa);
  const cpuSection = renderCpuHotspotsSection(s, aa);
  const flameSection = renderDiffFlameSection(s, aa);
  const layoutSection = renderForcedLayoutSection(s, aa);
  const allocGcSection = renderAllocGcSection(s, aa);
  const liveHeapSection = renderLiveHeapExperimentSection(s, aa);
  const procMemSection = renderProcessMemoryExperimentSection(s);
  const nativeMemSection = renderNativeMemoryDiffSection(s, aa);
  const httpSection = renderHttpSection(seriesHttpEntries(s));
  const pacingSection = impact.hasStream ? renderFramePacingSection(r, s, impact) : null;
  const distSection = state.distOpen ? renderDistExplorer(r, s, impact) : null;
  const metricsDisclosure = renderAllMetricsDisclosure(s, aa);
  const queriesDisclosure = renderTraceQueriesDisclosure(r, s);
  const planSection = renderPlanVsActual(r, s);

  const hasDeepDive = !!(insightsSection || phaseSection || cpuSection || flameSection || layoutSection || allocGcSection || liveHeapSection || procMemSection || nativeMemSection || httpSection || pacingSection || metricsDisclosure);

  appendKids(shell, [
    seriesList.length > 1 ? renderScorecard(seriesList, aa) : null,
    renderVerdictCard(r, s, aa, baseTag, headTag, baseVar, headVar),
    renderImpactStrip(s, impact, aa),
    renderVideoSection(s.video_player),
    renderEvidenceSection(r, s, aa),
    renderNextStepsSection(r, s, aa),
    hasDeepDive ? h("div", { class: "zone-divider" }, h("span", { class: "zone-divider-label" }, "Diagnostic deep dive · Why it changed & raw telemetry")) : null,
    insightsSection,
    phaseSection,
    cpuSection,
    flameSection,
    layoutSection,
    allocGcSection,
    liveHeapSection,
    procMemSection,
    nativeMemSection,
    httpSection,
    pacingSection,
    distSection,
    metricsDisclosure,
    queriesDisclosure,
    planSection,
    renderRigFooter(r, s, impact),
  ]);
}

/* ---------- Multi-Series Scorecard ---------- */
function classifyLeakVerdict(verdict, decided) {
  const v = String(verdict || "");
  if (v.startsWith("leaks")) return { kind: "loss", tone: "loss" };
  if (v.startsWith("no app leak") || v.startsWith("no growth") || v.startsWith("grows, then levels off")) {
    return { kind: "ok", tone: "win" };
  }
  return { kind: decided ? "same" : "inconclusive", tone: "neutral" };
}

function renderScorecard(seriesList, aa) {
  return h("nav", { class: "scorecard", "aria-label": "Benchmark cases" },
    seriesList.map((sr, i) => {
      if (sr.kind === "leak") {
        const lv = sr.primary?.verdict || sr.leak?.head?.js_heap?.verdict || "unclear";
        const cl = classifyLeakVerdict(lv, sr.decided);
        const shortLv = lv.startsWith("no app leak") ? "No app leak (JIT warmup)"
          : lv.startsWith("grows, then levels off") ? "Levels off (cache)"
          : lv.length > 34 ? lv.slice(0, 33) + "…" : lv;
        return h("button", {
          type: "button", class: "sc-item", "aria-selected": String(i === state.series), onclick: () => selectSeries(i),
        },
          h("div", { class: "sc-top" }, h("span", { class: "sc-name" }, capFirst(sr.case || sr.label || `Case ${i + 1}`)), h("span", { class: `sc-dot ${cl.tone}` })),
          h("div", { class: `sc-verdict ${cl.tone}` }, capFirst(shortLv)),
          h("div", { class: "sc-sub" }, `Leak run · ${sr.leak?.head?.runs || "?"} runs`)
        );
      }
      // A --check case: passed or failed in one run, nothing compared.
      if (sr.kind === "check") {
        const pm = sr.primary?.metric || "";
        const pv = sr.values?.[pm];
        return h("button", { type: "button", class: "sc-item", "aria-selected": String(i === state.series), onclick: () => selectSeries(i) },
          h("div", { class: "sc-top" }, h("span", { class: "sc-name" }, capFirst(sr.case || sr.label || `Case ${i + 1}`)), h("span", { class: `sc-dot ${sr.passed ? "neutral" : "loss"}` })),
          h("div", { class: `sc-verdict ${sr.passed ? "neutral" : "loss"}` }, sr.passed ? "Check passed" : "Check failed"),
          h("div", { class: "sc-sub" }, finite(pv) ? `${labelOf(pm)} ${fmtVal(pv, unitOf(pm))} · one run` : "one run, nothing compared")
        );
      }
      // A --blocks case: one build's median over its blocks, nothing compared.
      if (sr.kind === "blocks") {
        const p = sr.blocks_summary?.primary || {};
        const pm = p.metric || sr.primary?.metric || "";
        const refusedB = !!p.verdict || !!p.refused;
        const got = (p.values || []).filter(finite);
        const nb = sr.blocks_summary?.blocks ?? (sr.blocks || []).length;
        const word = refusedB ? "Refused" : finite(p.median) ? `Median ${fmtVal(p.median, unitOf(pm))}` : got.length === 1 ? fmtVal(got[0], unitOf(pm)) : "No value";
        return h("button", { type: "button", class: "sc-item", "aria-selected": String(i === state.series), onclick: () => selectSeries(i) },
          h("div", { class: "sc-top" }, h("span", { class: "sc-name" }, capFirst(sr.case || sr.label || `Case ${i + 1}`)), h("span", { class: `sc-dot ${refusedB ? "loss" : "neutral"}` })),
          h("div", { class: `sc-verdict ${refusedB ? "loss" : "neutral"}` }, word),
          h("div", { class: "sc-sub" }, `${labelOf(pm)} · ${nb} block${nb === 1 ? "" : "s"}, nothing compared`)
        );
      }
      const c = sr.primary || {};
      const m = c.metric || "";
      const u = unitOf(m);
      const cl = classify(c, m, aa);
      if (isUpfront(sr)) {
        return h("button", { type: "button", class: "sc-item", "aria-selected": String(i === state.series), onclick: () => selectSeries(i) },
          h("div", { class: "sc-top" }, h("span", { class: "sc-name" }, capFirst(sr.case || sr.label || `Case ${i + 1}`)), h("span", { class: "sc-dot neutral" })),
          h("div", { class: "sc-verdict neutral" }, `Not run (${c.refusal?.validator || "refused"})`),
          h("div", { class: "sc-sub" }, labelOf(m))
        );
      }
      const summary = shortSeriesOutcome(c, m, u, cl, aa);
      return h("button", {
        type: "button",
        class: "sc-item",
        "aria-selected": String(i === state.series),
        onclick: () => selectSeries(i),
      },
        h("div", { class: "sc-top" },
          h("span", { class: "sc-name" }, capFirst(sr.case || sr.label || `Case ${i + 1}`)),
          h("span", { class: `sc-dot ${cl.tone}` })
        ),
        h("div", { class: `sc-verdict ${cl.tone}` }, summary),
        h("div", { class: "sc-sub" }, `${labelOf(m)} · ${fmtBare(c.base, u)} → ${fmtVal(c.head, u)}`)
      );
    })
  );
}

function shortSeriesOutcome(c, m, u, cl, aa) {
  const d = fmtDelta(c.estimate, c, u);
  if (cl.kind === "aa-fp") return `${d} false positive`;
  if (cl.kind === "same") return aa ? "Control passed (±2%)" : `Equivalent (${fmtBound(c, u)})`;
  if (cl.kind === "noworse") return `No worse (${fmtMargin(c, u)})`;
  if (cl.kind === "inconclusive") return "Inconclusive";
  if (cl.kind === "refused") return `Refused (${refusalOf(c).validator || "see why"})`;
  // Only a decided shift has a direction (rule 1): no verdict, or a descriptive metric, says so.
  if (cl.tone !== "win" && cl.tone !== "loss") return cl.kind === "desc" ? "Descriptive" : "No verdict";
  return `${d} (${cl.tone === "win" ? "better" : "worse"})`;
}

/* ---------- Layer 1: Verdict Hero ---------- */
function humanHeadline(c, m, u, cl, s, aa) {
  // The change at its interval's digits without its sign, as the card's large number: a decided
  // +0.03% is not 0.0%.
  const absPct = c.relative !== false && finite(c.estimate)
    ? fmtDelta(c.estimate, c, u).replace(/^[+−]/, "")
    : fmtVal(Math.abs(c.estimate), absUnit(u));

  if (cl.kind === "refused") {
    const { validator, summary } = refusalOf(c);
    return { pill: `Measurement refused${validator ? ` · ${validator}` : ""}`, headline: `${labelOf(m)} not measured${summary ? `: ${summary}` : ""}` };
  }
  if (cl.kind === "noworse") {
    return { pill: `Confirmed · No worse (${fmtMargin(c, u)})`, headline: `${labelOf(m)} no worse, within the ${fmtMargin(c, u).slice(1)} allowed` };
  }
  if (aa) {
    if (cl.kind === "aa-fp") return { pill: "A/A Control · False positive", headline: `${absPct} random drift between identical builds` };
    if (cl.kind === "same") return { pill: "A/A Control · Passed", headline: `Identical builds matched within ${fmtBound(c, u)}` };
    return { pill: "A/A Control · Unresolved", headline: `Variance wider than ${fmtBound(c, u)} over ${s.pairs || "?"} pairs` };
  }
  if (cl.kind === "same") {
    const noun = {
      "interaction.p95": "input latency",
      "interaction.p50": "input latency",
      "scroll.latency.p95": "scroll latency",
      "main.busy": "main-thread busy time",
      "main.work": "main-thread work",
      "frames.dropped.pct": "dropped frame rate",
      "frames.interval.p95": "frame pacing",
      "cpu.app.total": "total app CPU",
    }[m] || labelOf(m).toLowerCase();
    return { pill: `Confirmed · Equivalent (${fmtBound(c, u)})`, headline: `No meaningful change in ${noun}` };
  }
  if (cl.kind === "inconclusive") {
    const need = finite(c.needed_pairs) ? `Needs ~${c.needed_pairs} pairs` : "Noise exceeds threshold";
    return { pill: `Inconclusive · ${need}`, headline: `Inconclusive after ${s.pairs || "?"} launch pairs` };
  }
  // "Confirmed" only for a decided shift (tone win or loss): anything else has no verdict to state.
  if (cl.tone !== "win" && cl.tone !== "loss") {
    // Compared, but no test ran on it: "not compared" would say the pairs never measured it.
    return { pill: cl.kind === "desc" ? "Descriptive · not tested" : "Not tested", headline: `${labelOf(m)}: ${cl.kind === "desc" ? "shown, never tested" : "not tested"}` };
  }

  const isWin = cl.tone === "win";
  const pill = cl.kind.endsWith("-small")
    ? (isWin ? "Confirmed · Small improvement" : "Confirmed · Small regression")
    : (isWin ? "Confirmed improvement" : "Confirmed regression");

  const phrase = {
    "main.busy": `${absPct} ${isWin ? "less" : "more"} main-thread busy time`,
    "main.work": `${absPct} ${isWin ? "less" : "more"} main-thread work`,
    "cpu.app.total": `${absPct} ${isWin ? "less" : "more"} total app CPU`,
    "interaction.p95": `${absPct} ${isWin ? "faster" : "slower"} input response`,
    "interaction.p50": `${absPct} ${isWin ? "faster" : "slower"} median input response`,
    "scroll.latency.p95": `${absPct} ${isWin ? "faster" : "slower"} scroll response`,
    "run.duration": `${absPct} ${isWin ? "faster" : "slower"} task duration`,
    "frames.dropped.pct": `Dropped frames ${isWin ? "fell" : "rose"} by ${absPct}`,
    "frames.interval.p95": `${absPct} ${isWin ? "smoother" : "choppier"} frame pacing`,
    "memory.app.private": `${absPct} ${isWin ? "less" : "more"} app memory`,
  }[m] || `${labelOf(m)} ${isWin ? "improved" : "regressed"} by ${absPct}`;

  return { pill, headline: phrase };
}

function buildHeroProse(r, s, c, cl, aa) {
  const m = c.metric;
  const u = unitOf(m);
  const ps = pairsOf(s, m);
  const wins = ps.filter((p) => (higherBetter(m, c) ? p.b > p.a : p.b < p.a)).length;
  const losses = ps.filter((p) => (higherBetter(m, c) ? p.b < p.a : p.b > p.a)).length;
  const nPairs = ps.length || s.pairs || 0;
  const runDur = allComparisons(s).find((x) => x.c.metric === "run.duration")?.c.base
    ?? median(timedBlocks(s).map((b) => b.values?.["run.duration"]));
  const workComp = allComparisons(s).find((x) => x.c.metric === "main.work")?.c;

  if (cl.kind === "refused") {
    return h("p", { class: "hero-prose" }, `Measurement refused (${String(c.verdict).replace(/^refused(\s*\([^)]*\))?:\s*/, "")}).`);
  }
  if (aa && cl.kind === "aa-fp") {
    return h("p", { class: "hero-prose" },
      "Both sides ran the exact same build across ", h("strong", {}, `${nPairs} alternating launch pairs`),
      `, yet random variation leaned one way in ${Math.max(wins, losses)} of ${nPairs} pairs (${fmtRange(c, u)}). `,
      "This happens by chance in ~5% of A/A control runs and reflects natural harness variance rather than a code change."
    );
  }
  if (aa && cl.kind === "same") {
    return h("p", { class: "hero-prose" },
      "Identical builds were compared across ", h("strong", {}, `${nPairs} fresh-launch pairs`),
      ` (${wins}–${losses} split) and landed cleanly inside ${fmtBound(c, u)} (${fmtRange(c, u)}), confirming the test harness introduces no directional bias.`
    );
  }
  if (cl.kind === "same") {
    return h("p", { class: "hero-prose" },
      SIDES ? `${labelOf(m)} the same on both: ${SIDES.head} ` : `${labelOf(m)} held steady at `, h("strong", {}, fmtVal(c.head, u)), SIDES ? ` vs ${SIDES.base} ` : " vs ", h("strong", {}, fmtVal(c.base, u)),
      ` (${fmtDelta(c.estimate, c, u)}). Across ${nPairs} fresh-launch pairs, the true change is bounded within `,
      h("strong", {}, fmtRange(c, u)), `, inside the ${fmtBound(c, u)} practical equivalence zone.`
    );
  }
  if (cl.kind === "noworse") {
    return h("p", { class: "hero-prose" },
      SIDES ? `${labelOf(m)}: ${SIDES.head} ` : `${labelOf(m)} measured `, h("strong", {}, fmtVal(c.head, u)), SIDES ? ` vs ${SIDES.base} ` : " vs ", h("strong", {}, fmtVal(c.base, u)),
      ` (${fmtDelta(c.estimate, c, u)}). Across ${nPairs} fresh-launch pairs the change lies within `, h("strong", {}, fmtRange(c, u)),
      `: its worse end is inside the ${fmtMargin(c, u)} allowed, so no worse.`
    );
  }
  if (cl.kind === "inconclusive") {
    const estMins = finite(c.needed_pairs) && finite(s.elapsed_ms) && s.pairs > 0 && c.needed_pairs < 5000
      ? ` (~${fmtDuration((s.elapsed_ms / s.pairs) * c.needed_pairs)})`
      : "";
    return h("p", { class: "hero-prose" },
      SIDES ? `${labelOf(m)}: ${SIDES.head} ` : `${labelOf(m)} measured `, h("strong", {}, fmtVal(c.head, u)), SIDES ? ` vs ${SIDES.base} ` : " vs ", h("strong", {}, fmtVal(c.base, u)),
      ` (${fmtDelta(c.estimate, c, u)}), with true change between `, h("strong", {}, fmtRange(c, u)), ". ",
      finite(c.needed_pairs) && c.needed_pairs < 5000
        ? `Run-to-run variance across ${nPairs} pairs is wider than ${fmtBound(c, u)}; resolving a ${fmtBound(c, u)} shift requires ~${c.needed_pairs} pairs${estMins}.`
        : `Run-to-run variance across ${nPairs} pairs is too wide to resolve ${fmtBound(c, u)} without stabilizing the case first.`
    );
  }
  if (cl.tone !== "win" && cl.tone !== "loss") {
    return h("p", { class: "hero-prose" }, cl.kind === "desc"
      ? `${labelOf(m)} is descriptive here: shown, never tested.`
      : `${labelOf(m)} has no verdict${nPairs ? ` after ${nPairs} pairs` : ": nothing was compared"}.`);
  }

  const savedWork = m === "main.busy" && workComp && finite(workComp.base) && finite(workComp.head)
    ? `, saving ~${Math.round(Math.abs(workComp.base - workComp.head))} ms of CPU work per ${finite(runDur) ? fmtDuration(runDur) + " " : ""}run`
    : m === "main.work" && finite(runDur)
      ? ` (${fmtSignedMatched(c.base, c.head, "ms")} per ${fmtDuration(runDur)} run)`
      : "";

  // The pairs that moved the way the verdict did: head better in them for a win, worse for a loss.
  const along = cl.tone === "win" ? wins : losses;
  const smallCaveat = cl.kind.endsWith("-small")
    ? ` Statistically confirmed (${along} of ${nPairs} pairs moved in the same direction), though the conservative bound (${fmtRange(c, u)}) reaches inside the ${fmtBound(c, u)} practical threshold.`
    : ` ${sideWord("head", true)} ${cl.tone === "win" ? "outperformed" : "trailed"} ${sideWord("base")} in ${along === nPairs ? `all ${nPairs} of ${nPairs}` : `${along} of ${nPairs}`} fresh-launch pairs.`;

  // Two implementations: one number each, never a shift from one to the other.
  if (SIDES) {
    return h("p", { class: "hero-prose" },
      `${labelOf(m)}: ${SIDES.base} `, h("strong", {}, fmtVal(c.base, u)), `, ${SIDES.head} `, h("strong", {}, fmtVal(c.head, u)),
      " (medians).", smallCaveat
    );
  }
  return h("p", { class: "hero-prose" },
    `${labelOf(m)} shifted from `, h("strong", {}, fmtVal(c.base, u)), " to ", h("strong", {}, fmtVal(c.head, u)),
    savedWork, ".", smallCaveat
  );
}

// What each build showed on screen in its blocks (result.json `series[].shown`), with a thumbnail of
// its first block: a bench measured on the wrong screen shows here, and `changed` marks base and head apart.
function renderShown(s) {
  const sh = s?.shown;
  if (!sh) return null;
  const roles = ["base", "head"].filter((r) => sh[r] && (sh[r].end || sh[r].thumb_end || sh[r].thumb));
  if (!roles.length) return null;
  const text = (v) => !v.end ? "nothing read" : v.start && v.start !== v.end ? `'${v.start}' → '${v.end}'` : `'${v.end}'`;
  return h("div", { class: `shown-row${sh.changed ? " warn" : ""}`, title: sh.changed ? "Base and head showed different screens (ScreenChanged)" : "What each build showed on screen" },
    roles.map((role) => {
      const v = sh[role];
      const others = (v.others || []).map((o) => `${o.blocks} on '${o.label}'`).join(", ");
      return h("div", { class: "shown-side" },
        (v.thumb_end || v.thumb) ? h("img", { class: "shown-thumb", src: v.thumb_end || v.thumb, alt: `${sideWord(role)} screen` }) : null,
        h("span", { class: "shown-label", title: others ? `other blocks: ${others}` : text(v) }, `On screen · ${sideWord(role, true)}: ${text(v)}${others ? ` (+${others})` : ""}`)
      );
    })
  );
}

/* ---------- A --check case: one untimed run, passed or failed, nothing compared ---------- */
function renderCheckSeries(r, s) {
  const v = s.values || {};
  const refused = s.refused || {};
  const declared = s.declared || [s.primary?.metric].filter(Boolean);
  const extra = Object.keys(v).filter((k) => k.startsWith("launch.") && !declared.includes(k));
  const rows = [...declared, ...extra].map((k) => h("div", { class: "rec-kv-row" },
    h("span", { class: "mono", style: "color:var(--ink-2)" }, k),
    h("span", { class: "mono", style: "font-weight:500" }, finite(v[k]) ? fmtVal(v[k], unitOf(k)) : refused[k] ? `refused · ${String(refused[k]).split(":")[0]}` : "no value")
  ));
  const pills = [s.engine && s.engine !== "chromium" ? s.engine : null, s.headless ? "headless" : null, s.session_locked ? "session locked" : null].filter(Boolean);
  const cmds = [
    s.recording ? ["The check run's recording", `strobe query ${s.recording} ${s.target_kind === "native" ? "threads" : "summary"}`] : null,
    s.attribution ? ["Where it spends its time (attribution block)", `strobe query ${s.attribution} hotspots --by package`] : null,
  ].filter(Boolean);
  const log = (s.log || []).slice(-10);
  return [
    h("section", { class: "card-surface" },
      h("div", { class: "card-hd" },
        h("div", { class: "card-hd-left" },
          h("h2", { class: "sec-title" }, `${capFirst(s.case || s.label)}: check ${s.passed ? "passed" : "failed"}`),
          h("span", { class: "sec-sub" }, `One cold run, no warmup, nothing compared${finite(s.elapsed_ms) ? ` · ${fmtDuration(s.elapsed_ms)}` : ""}`)
        ),
        h("div", { class: "card-hd-right" }, pills.map((p) => h("span", { class: "ref-pill" }, p)), h("span", { class: `status-pill ${s.passed ? "win" : "loss"}` }, s.passed ? "Passed" : "Failed"))
      ),
      h("div", { class: "card-bd" },
        !s.passed && s.error ? h("pre", { class: "cli-pre" }, String(s.error) + (s.hint ? `\nfix: ${s.hint}` : "")) : null,
        rows.length ? h("div", { class: "rec-kv-cols" }, h("div", { class: "rec-kv-grp" }, h("div", { class: "rig-hd", style: "margin-bottom:4px" }, "Values of the one run (not a verdict)"), rows)) : null,
        renderShown(s),
        cmds.length ? h("div", { class: "next-list", style: "margin-top:12px" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c)))) : null,
        log.length ? h("pre", { class: "cli-pre", style: "margin-top:12px" }, log.join("\n")) : null
      )
    ),
    renderVideoSection(s.video_player),
  ];
}

/* ---------- Video (--video): players on one clock, the inputs on their time ---------- */
// Each side plays from its first measured run's start, so t = 0 is "the run began" on both. A marker
// is an input strobe sent (or a phase); clicking it seeks both players there.
function renderVideoSection(player) {
  if (!player?.sides?.length) return null;
  const sides = player.sides.map((sd) => {
    const v = sd.video || {};
    const runs = v.runs || [];
    const run = runs.find((x) => x.measured) || runs[0];
    return { ...sd, v, runs, offset: run ? run.start_s : 0, markers: v.markers || [] };
  });
  const label = (sd) => sd.role === "recording" ? "This recording" : sideWord(sd.role, true);
  const els = sides.map((sd) => {
    const el = h("video", { class: "vid-el", src: sd.src, preload: "auto", playsinline: true });
    el.muted = true;
    return el;
  });
  const lo = Math.min(0, ...sides.map((sd) => -sd.offset));
  const hi = Math.max(0.1, ...sides.map((sd) => (sd.v.duration_s || 0) - sd.offset));
  const step = 1 / Math.max(30, ...sides.map((sd) => sd.v.fps || sd.v.max_fps || 30));
  const fmtT = (t) => `${t < 0 ? "−" : ""}${Math.abs(t).toFixed(3)} s`;
  const clampTo = (el, t) => Math.max(0, Math.min(t, finite(el.duration) ? el.duration - 0.001 : t));
  const readout = h("span", { class: "mono vid-time" }, fmtT(0));
  const seek = (t) => els.forEach((el, i) => { el.currentTime = clampTo(el, t + sides[i].offset); });
  const now = () => (els[0].currentTime || 0) - sides[0].offset;
  const playBtn = h("button", { type: "button", class: "btn-ghost", onclick: () => {
    if (els[0].paused) { seek(now()); els.forEach((el) => el.play().catch(() => {})); } else els.forEach((el) => el.pause());
  } }, "Play");
  const rates = [0.25, 1].map((r) => h("button", { type: "button", class: "btn-ghost vid-rate", "aria-pressed": String(r === 1), onclick: (e) => {
    els.forEach((el) => { el.playbackRate = r; });
    for (const b of e.currentTarget.parentNode.querySelectorAll(".vid-rate")) b.setAttribute("aria-pressed", String(b === e.currentTarget));
  } }, `${r}×`));
  // A step is a time, not a captured frame: a constant-rate video repeats a frame until the next one,
  // and a variable-rate one (≤60 fps) may hold one longer, so a step can show the same picture.
  const stepText = `1/${Math.round(1 / step)} s`;
  const frameBtn = (dir, text) => h("button", { type: "button", class: "btn-ghost", title: `${dir < 0 ? "Back" : "Forward"} ${stepText} (the same picture when no new frame came in that time)`, onclick: () => {
    els.forEach((el) => el.pause());
    seek(now() + dir * step);
  } }, text);
  // The strip: one row per side, its run spans, its inputs and phases on the shared clock.
  const W = 1000, rowH = 26, top = 18;
  const x = (t) => ((t - lo) / (hi - lo)) * W;
  const svg = S("svg", { class: "vid-strip", viewBox: `0 0 ${W} ${top + rowH * sides.length + 4}`, preserveAspectRatio: "none" });
  for (let k = Math.ceil(lo); k <= hi; k += Math.max(1, Math.round((hi - lo) / 10))) {
    svg.append(S("line", { x1: x(k), x2: x(k), y1: 12, y2: top + rowH * sides.length, class: "vid-grid-line" }), S("text", { x: x(k) + 2, y: 10, class: "vid-tick" }, `${k}s`));
  }
  sides.forEach((sd, i) => {
    const y = top + i * rowH;
    if (sides.length > 1) svg.append(S("text", { x: 2, y: y + rowH / 2 + 3, class: "vid-tick" }, label(sd)));
    for (const r of sd.runs) {
      svg.append(S("rect", { x: x(r.start_s - sd.offset), y: y + 3, width: Math.max(1, x(r.end_s - sd.offset) - x(r.start_s - sd.offset)), height: rowH - 6, class: r.measured ? "vid-run" : "vid-run warm" }, S("title", {}, `${label(sd)} ${r.run}${r.measured ? "" : " (warmup)"}: ${fmtT(r.start_s - sd.offset)} → ${fmtT(r.end_s - sd.offset)}`)));
    }
    for (const m of sd.markers) {
      const t = m.t_s - sd.offset;
      const tip = `${label(sd)} · ${m.label} at ${fmtT(t)}${m.press_s != null ? ` (press ${fmtT(m.press_s - sd.offset)})` : ""}${m.reaction_s != null ? ` · reaction on screen ${((m.reaction_s - m.t_s) * 1000).toFixed(0)} ms later` : ""}`;
      if (m.kind === "phase") {
        svg.append(S("rect", { x: x(t), y: y + rowH - 7, width: Math.max(2, x((m.end_s ?? m.t_s) - sd.offset) - x(t)), height: 4, class: "vid-phase", onclick: () => seek(t) }, S("title", {}, tip)));
        continue;
      }
      const g = S("g", { class: "vid-mark", onclick: () => { els.forEach((el) => el.pause()); seek(t); } }, S("title", {}, tip));
      g.append(S("line", { x1: x(t), x2: x(t), y1: y + 2, y2: y + rowH - 2 }), S("circle", { cx: x(t), cy: y + 7, r: 4 }));
      if (m.reaction_s != null) g.append(S("circle", { cx: x(m.reaction_s - sd.offset), cy: y + rowH - 7, r: 3, class: "vid-react" }));
      svg.append(g);
    }
  });
  const head = S("line", { x1: x(0), x2: x(0), y1: 12, y2: top + rowH * sides.length, class: "vid-head" });
  svg.append(head);
  svg.addEventListener("click", (e) => {
    if (e.target.closest(".vid-mark")) return;
    const b = svg.getBoundingClientRect();
    seek(lo + ((e.clientX - b.left) / b.width) * (hi - lo));
  });
  const tick = () => {
    if (!svg.isConnected) return;
    const t = now();
    els.forEach((el, i) => {
      if (i && !els[0].paused && Math.abs(el.currentTime - (t + sides[i].offset)) > 0.08) el.currentTime = clampTo(el, t + sides[i].offset);
    });
    head.setAttribute("x1", x(t));
    head.setAttribute("x2", x(t));
    readout.textContent = `t = ${fmtT(t)} from the run's start`;
    playBtn.textContent = els[0].paused ? "Play" : "Pause";
    requestAnimationFrame(tick);
  };
  els[0].addEventListener("loadedmetadata", () => seek(0), { once: true });
  requestAnimationFrame(tick);
  const kinds = [...new Set(sides.map((sd) => sd.v.kind))];
  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, sides.length > 1 ? "Video · both sides on one clock" : "Video"),
        h("span", { class: "sec-sub" }, "Untimed: filmed after the timed runs (or in a check); the numbers above never include it")
      ),
      h("div", { class: "card-hd-right" }, kinds.map((k) => h("span", { class: "ref-pill", title: sides.find((sd) => sd.v.kind === k)?.v.about || "" }, k)))
    ),
    h("div", { class: "card-bd" },
      player.mixed ? h("div", { class: "perturbed-note", style: "margin:-20px -24px 16px" }, h("b", {}, "Different kinds: "), "one side is the screen's copy of the window, the other a renderer's own frames. They are not comparable side by side.") : null,
      h("div", { class: "vid-grid" },
        sides.map((sd, i) => h("figure", { class: "vid-side" },
          h("figcaption", { class: "vid-cap" },
            h("b", {}, label(sd)),
            h("span", { class: "meta-dim mono" }, ` ${sd.recording} · ${sd.v.kind} · ${sd.v.width}×${sd.v.height} · ${sd.v.fps ? `${sd.v.fps} fps` : `≤${sd.v.max_fps || 60} fps, each frame at its own time`} · ${sd.v.encoder || ""}`)
