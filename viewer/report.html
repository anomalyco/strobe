          ),
          els[i],
          sd.v.note ? h("div", { class: "sec-sub" }, sd.v.note) : null
        ))
      ),
      h("div", { class: "vid-ctrl" }, playBtn, frameBtn(-1, `◀ ${stepText}`), frameBtn(1, `${stepText} ▶`), h("span", { class: "vid-rates" }, rates), readout),
      svg,
      h("div", { class: "sec-sub vid-legend" }, "Bars: runs (pale: warmup). Ticks: inputs strobe sent (dot below: when the measured reaction reached the screen). Thin bars: phases. Click a tick or the strip to seek both players.")
    )
  );
}

/* ---------- Implementation comparisons (two targets) ---------- */
const isImpl = (r) => r?.comparison === "implementations";
const sideName = (v, role) => v?.name || v?.target || role;
// What the shared panels call each side: an implementation comparison's names, else base and head.
let SIDES = null;
function sideWord(role, cap) {
  if (SIDES) return SIDES[role];
  const w = role === "base" ? "base" : "head";
  return cap ? capFirst(w) : w;
}
const isGap = (s) => !!s?.gap || s?.primary?.refusal?.validator === "ParityGap";
// Refused before it ran (an engine without its primary): no pairs, nothing compared.
const isUpfront = (s) => s?.kind === "refused";
// A refused series' panel: the validator, what it said, and the fix (the closest primary to use).
function renderUpfrontRefusal(s) {
  const ref = s.primary?.refusal || {};
  return h("section", { class: "card-surface card-bd" },
    h("h2", { class: "sec-title" }, `${capFirst(s.case || s.label)}: Not run (${ref.validator || "refused"})`),
    h("p", { class: "sec-sub" }, ref.summary || ""),
    ref.fix ? h("p", { class: "sec-sub" }, `Fix: ${ref.fix}`) : null
  );
}

// The scoreboard as pills (one per journey, in the bench file's order), the family's count, and what
// was held the same for both: window, GPU, input, fixture, and each side's process set.
function renderImplPanel(r, baseVar, headVar) {
  const bn = sideName(baseVar, "base"), hn = sideName(headVar, "head");
  const sb = r.scoreboard || {};
  const pills = (r.series || []).map((s, i) => {
    const c = s.primary || {};
    const m = c.metric || "";
    const cl = classify(c, m, false);
    const up = isUpfront(s);
    const gap = isGap(s) || up;
    // Green and red only for a verdict confirmed across the family (`holm_decided`).
    const counted = c.holm_decided === true;
    const tone = gap || !counted ? "" : cl.tone === "loss" ? "loss" : cl.tone === "win" ? "win" : "";
    // An increase of 2× or more reads as a factor, as in the PR block and card.
    const change = c.relative !== false && finite(c.estimate) && c.estimate >= 1 ? `${(1 + c.estimate).toFixed(1 + c.estimate >= 10 ? 0 : 1)}×` : fmtDelta(c.estimate, c, unitOf(m));
    const what = up ? `not run (${c.refusal?.validator || "refused"})` : gap ? (s.gap?.missing ? `gap: no ${s.gap.missing}` : "gap") : cl.kind === "same" ? "same" : cl.tone === "neutral" ? "unclear" : change;
    return h("button", { type: "button", class: `impl-pill ${tone}`, title: up ? c.refusal?.summary || "" : gap ? s.gap?.reason || "" : `${labelOf(m)}${finite(c.p_repeated) ? ` · repeated p ${fmtP(c.p_repeated)}` : ""}${(cl.tone === "win" || cl.tone === "loss") && !counted ? ` · ${cl.tone === "win" ? "better" : "worse"} on its own, not after Holm` : ""}`, onclick: () => selectSeries(i) },
      `${capFirst(s.case || s.label)} · ${what}${s.headline ? " · headline" : ""}`);
  });
  const parts = [];
  if (sb.all_no_worse === true) parts.push(`No worse than ${bn} in all ${sb.compared} compared journeys`);
  else if (sb.all_no_worse === false) parts.push(`Not no worse in all ${sb.compared} compared journeys`);
  else parts.push(`Better in ${sb.better ?? 0} of ${sb.compared ?? 0} compared journeys`);
  if (sb.all_no_worse != null && sb.better) parts.push(`better in ${sb.better}`);
  if (sb.worse) parts.push(`worse in ${sb.worse}`);
  if (sb.same && sb.all_no_worse !== true) parts.push(`${sb.all_no_worse != null ? "no worse" : "the same"} in ${sb.same}`);
  if (sb.unclear) parts.push(`unclear in ${sb.unclear}`);
  if (sb.gaps) parts.push(`${sb.gaps} not comparable`);
  const alone = [[sb.better_alone, "better"], [sb.worse_alone, "worse"]].filter(([n]) => n > 0).map(([n, w]) => `${n} ${w}`);
  const note = (sb.compared || 0) > 1
    ? (sb.all_no_worse != null
      ? "each journey at its own 2.5% (intersection–union)"
      : `Holm-adjusted across ${sb.compared} journeys on repeated-interval p-values, wins and regressions alike${alone.length ? `; ${alone.join(" and ")} on ${sb.better_alone + sb.worse_alone === 1 ? "its" : "their"} own did not clear it` : ""}`)
    : "";
  const f = r.fairness || {};
  const w = f.window || {};
  const fx = r.fixture;
  const kv = (rows) => h("div", { class: "impl-kv" }, rows.filter((x) => x[1] != null && x[1] !== "").flatMap(([k, v]) => [h("span", {}, k), h("span", {}, String(v))]));
  const side = (v, role) => h("div", {},
    h("div", { class: "impl-side-name", title: `--${role}` }, sideName(v, role)),
    kv([
      ["Build", v?.label || v?.spec || ""],
      ["Commit", v?.commit ? `${v.commit}${v.dirty ? " (dirty)" : ""}${v.subject ? " · " + v.subject : ""}` : ""],
      ["Engine", v?.engine || ""],
      ["GPU backend", v?.gpu_backend || ""],
      ["Processes", finite(v?.process_set?.median_count) ? `${v.process_set.median_count} · ${Object.entries(v.process_set.by_program || {}).map(([p, n]) => `${p} ×${n}`).join(", ")}` : ""],
      ["Observed via", f.observer?.[role] || ""],
      ["Reads per run", finite(f.observer?.reads_per_run?.[role]) ? f.observer.reads_per_run[role] : ""],
      ["Fixture link", fx ? (fx.connected?.[role] ? "connected" : "not connected") : ""],
      ["Fixture CPU", fx && finite(fx.cpu_ms_per_run?.[role]) ? `${fmtVal(fx.cpu_ms_per_run[role], "ms")} per run` : ""],
    ])
  );
  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, `${hn} vs ${bn}`),
        h("span", { class: "sec-sub" }, parts.join(" · "))
      )
    ),
    h("div", { class: "impl-board" }, pills, note ? h("span", { class: "impl-board-note" }, note) : null),
    h("div", { class: "impl-grid" },
      h("div", {},
        h("div", { class: "impl-side-name" }, "Held the same on both"),
        kv([
          ["Window", finite(w.client_dip?.[0]) ? `${w.client_dip[0]}×${w.client_dip[1]} DIP @${w.scale ?? 1}×${finite(w.hz) ? `, ${w.hz} Hz` : ""}${w.display ? " · " + w.display : ""}` : ""],
          ["GPU", f.adapter || ""],
          ["Input", f.input === "os" ? "real OS input to both" : f.input || ""],
          ["GPU caches", f.gpu_cache || ""],
          ["Priority", f.priority || ""],
          ["Fixture", fx ? fx.command : ""],
          ["Seed", fx?.seed ? `${fx.seed}${fx.seed_sha256 ? ` · sha256 ${String(fx.seed_sha256).slice(0, 12)}` : ""}` : ""],
        ])
      ),
      h("div", {},
        h("div", { class: "impl-side-name" }, "Not checked by strobe"),
        h("div", { class: "sec-sub" }, "That both render the same features beyond the equivalence checks, and that the fixture behaves like production.")
      )
    ),
    h("div", { class: "impl-grid" }, side(baseVar, "base"), side(headVar, "head"))
  );
}

// One journey: what each side showed (start and end thumbnails), what `expect.same` read on both,
// each side's own numbers, and where each spent its time on one shared ms-per-run scale.
function renderImplSeries(r, s, baseVar, headVar) {
  const bn = sideName(baseVar, "base"), hn = sideName(headVar, "head");
  const out = [];
  if (isUpfront(s)) return [renderUpfrontRefusal(s)];
  if (isGap(s)) {
    out.push(h("section", { class: "card-surface card-bd" },
      h("h2", { class: "sec-title" }, `${capFirst(s.case || s.label)}: not compared`),
      h("p", { class: "sec-sub" }, s.gap?.reason || `no ${s.gap?.missing || "step"} in ${s.gap?.side === "base" ? bn : hn}`)
    ));
    return out;
  }
  // A Care metric is comparable only as a total of each side's processes: say what it sums.
  const care = allComparisons(s).filter((x) => x.c.care_note && x.role !== "descriptive");
  if (care.length) {
    out.push(h("section", { class: "card-surface card-bd" },
      h("h2", { class: "sec-title" }, "What each number sums"),
      h("div", { class: "impl-kv", style: "margin-top:8px" }, care.flatMap((x) => [h("span", {}, labelOf(x.c.metric)), h("span", {}, x.c.care_note)]))
    ));
  }
  const sh = s.shown || {};
  const thumbs = ["base", "head"].flatMap((role) => {
    const v = sh[role] || {};
    const name = role === "base" ? bn : hn;
    return [["start", v.thumb_start], ["end", v.thumb_end || v.thumb]].filter(([, src]) => src).map(([when, src]) =>
      h("figure", {}, h("img", { src, alt: `${name} ${when}` }), h("figcaption", {}, `${name} · ${when}${when === "end" && v.end ? ` · '${v.end}'` : ""}`)));
  });
  const eq = s.equivalence || [];
  if (thumbs.length || eq.length) {
    out.push(h("section", { class: "card-surface" },
      h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Same outcome on both"),
        h("span", { class: "sec-sub" }, "Read on each side after setup and after every run, outside the measured window")
      )),
      thumbs.length ? h("div", { class: "impl-thumbs" }, thumbs) : null,
      eq.length ? h("div", { class: "card-bd" }, h("table", { class: "impl-table" },
        h("thead", {}, h("tr", {}, h("th", {}, "Check"), h("th", {}, bn), h("th", {}, hn), h("th", {}, "Pairs"), h("th", {}, ""))),
        h("tbody", {}, eq.map((e) => h("tr", {},
          h("td", { class: "mono" }, e.selector),
          h("td", {}, e.base === "" ? "(empty)" : String(e.base ?? "—")),
          h("td", {}, e.head === "" ? "(empty)" : String(e.head ?? "—")),
          h("td", { class: "num" }, String(e.pairs ?? "")),
          h("td", { style: `color:var(${e.ok ? "--win-ink" : "--loss-ink"})` }, e.ok ? "same" : "differed")
        )))
      )) : null
    ));
  }
  const ps = s.per_side || {};
  const keys = [...new Set([...Object.keys(ps.base || {}), ...Object.keys(ps.head || {})])].sort();
  const roles = ["base", "head"];
  const nameOf = (role) => (role === "base" ? bn : hn);
  if (keys.length) {
    out.push(h("section", { class: "card-surface" },
      h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Per implementation, not compared"),
        h("span", { class: "sec-sub" }, "Each engine's own numbers from the timed blocks, measured its own way")
      )),
      h("div", { class: "impl-grid" }, roles.map((role) => h("div", {},
        h("div", { class: "impl-side-name" }, nameOf(role)),
        h("table", { class: "impl-table" }, h("tbody", {}, keys.map((k) => {
          const v = ps[role]?.[k];
          const u = v?.unit || unitOf(k);
          const x = v?.median ?? v?.value;
          return h("tr", {}, h("td", {}, labelOf(k)), h("td", { class: "num" }, v ? (u === "bytes" ? fmtBytes(x) : fmtVal(x, u)) : "—"));
        })))
      )))
    ));
  }
  const attr = renderImplAttribution(r, s, nameOf);
  if (attr) out.push(attr);
  return out;
}

// Where each implementation spends its time (SPEC §11.2): each side's profiled launch, read with its
// own engine's tools, in two columns. Every list shares one scale across both columns (ms per run, or
// bytes), so a bar's length compares across implementations; a side whose samples carry no times
// (macOS `sample`: per recording) draws its sampled lists on a scale of its own and says so. Never a
// diff: two implementations share no code.
function renderImplAttribution(r, s, nameOf) {
  const roles = ["base", "head"];
  const att = (role) => s.hotspots?.[role] || null;
  const sd = (role) => att(role)?.side || null;
  if (!roles.some(att)) {
    const why = dedupWarnings([...(r.warnings || []), ...(s.warnings || [])]).filter((w) => w.id === "Attribution");
    if (!s.attribution && !why.length) return null;
    return h("section", { class: "card-surface card-bd" },
      h("h2", { class: "sec-title" }, "Where each spends its time"),
      h("p", { class: "sec-sub" }, why.length ? why.map((w) => w.text).join(" · ") : "No profiled launches: strobe bench --why always profiles each side once, apart from the timed pairs.")
    );
  }
  const pos = (x) => finite(x?.ms) && x.ms > 0;
  const lists = {
    processes: (role) => (sd(role)?.processes || []).filter(pos).map((p) => ({ ...p, title: p.pid ? `${p.name} · pid ${p.pid}` : p.name })),
    origins: (role) => (sd(role)?.origins || []).filter(pos),
    threads: (role) => (att(role)?.threads?.threads || []).map((t) => ({ name: t.name || "(unnamed)", ms: t.cpu_ms_per_run, title: [t.module, t.origin].filter(Boolean).join(" · ") })).filter(pos).sort((a, b) => b.ms - a.ms).slice(0, 10),
    functions: (role) => (sd(role)?.functions || []).map((f) => ({ name: f.name, ms: f.ms, title: f.where })).filter(pos).slice(0, 10),
    packages: (role) => (sd(role)?.packages || []).filter(pos).slice(0, 8),
    memory: (role) => (sd(role)?.memory?.parts || []).map((p) => ({ name: p.name, ms: p.bytes })).filter(pos),
  };
  const timed = (role) => sd(role)?.per_run !== false;
  const profiler = (role) => sd(role)?.profiler || "none";
  // Where a list's numbers come from on a side: the timed blocks (no profiler), or its profiled
  // launch under its profiler, per run or over the whole capture (untimed samples).
  const sourceOf = (key, role) => {
    if (key === "memory") return "memory";
    if (key === "processes" && sd(role)?.processes_from === "timed") return "timed";
    const sampled = key === "functions" || key === "packages";
    return `profiled:${profiler(role)}${sampled && !timed(role) ? ":capture" : ""}`;
  };
  const perturbed = (key, role) => sourceOf(key, role).startsWith("profiled");
  // Both columns share a list's scale only when both sides' numbers come from one source (the timed
  // blocks, or one profiler): a profiler slows its own engine its own way.
  const shared = (key) => roles.every((x) => att(x) && lists[key](x).length) && sourceOf(key, "base") === sourceOf(key, "head");
  const maxOf = (key, role) => {
    const over = shared(key) ? roles : [role];
    return Math.max(1e-9, ...over.flatMap((x) => lists[key](x).map((t) => t.ms)));
  };
  const bars = (key, role, fmt) => {
    const list = lists[key](role);
    if (!list.length) return h("div", { class: "sec-sub" }, "—");
    const max = maxOf(key, role);
    return list.map((t) => h("div", { class: "impl-bar-row" },
      h("span", { class: "fn-name mono", title: t.title || t.name }, t.name),
      h("div", { class: "impl-bar-track" }, h("i", { style: `width:${(100 * t.ms) / max}%` })),
      h("span", { class: "mono", style: "text-align:right" }, fmt(t.ms, role))
    ));
  };
  const ms = (x) => fmtVal(x, "ms");
  const msSampled = (x, role) => `${fmtVal(x, "ms")}${timed(role) ? "" : " *"}`;
  const bytes = (x) => fmtBytes(x);
  const pair = (title, note, key, fmt, foot) => {
    if (!roles.some((role) => lists[key](role).length)) return null;
    const scale = roles.every((x) => lists[key](x).length) ? (shared(key) ? "one scale for both columns" : "each column on its own scale (different sources)") : "";
    // A profiled launch's numbers are its profiler's too: every such column says so.
    const footOf = (role) => [foot?.(role), lists[key](role).length && perturbed(key, role) ? `perturbed: from the profiled launch (${profiler(role)})` : null].filter(Boolean).join(" · ");
    return [
      h("div", { class: "impl-attr-sub" }, h("span", { class: "impl-attr-title" }, title), h("span", { class: "sec-sub" }, [note, scale].filter(Boolean).join(" · "))),
      h("div", { class: "impl-grid" }, roles.map((role) => h("div", {},
        att(role) ? bars(key, role, fmt) : h("div", { class: "sec-sub" }, "not profiled"),
        footOf(role) ? h("div", { class: "sec-sub", style: "margin-top:4px" }, footOf(role)) : null))),
    ];
  };
  const processesFrom = (role) => lists.processes(role).length && sd(role)?.processes_from === "timed" ? "from the timed blocks (each role's share of a core × the run), no profiler running" : null;
  const head = (role) => {
    const a = att(role), x = sd(role);
    if (!a) {
      const why = dedupWarnings([...(r.warnings || []), ...(s.warnings || [])]).find((w) => w.id === "Attribution" && String(w.text).startsWith(nameOf(role)));
      return h("div", {}, h("div", { class: "impl-side-name" }, nameOf(role)), h("div", { class: "sec-sub" }, why ? why.text : "No profiled launch of this side."));
    }
    const named = finite(x?.resolved_share) ? { share: x.resolved_share, what: "of native samples resolved to a symbol" }
      : finite(x?.mapped_share) ? { share: x.mapped_share, what: "of script samples source-mapped" } : null;
    const low = named && named.share < 0.95;
    return h("div", {},
      h("div", { class: "impl-side-name" }, nameOf(role)),
      h("div", { class: "impl-kv" },
        h("span", {}, "Profiled with"), h("span", {}, x?.profiler ? `${x.profiler}${x.engine === "native" ? "; threads and memory from the OS" : x.engine === "chromium" ? "; heap snapshot, forced layouts, GC" : ""}` : x?.engine === "native" ? "no stacks (threads and memory from the OS)" : "no stacks"),
        h("span", {}, "Samples named"), h("span", { style: low ? "color:var(--warn-ink)" : "" }, named ? `${(100 * named.share).toFixed(1)}% ${named.what}${low ? " (under 95%: Unresolved)" : ""}` : "—"),
        h("span", {}, "CPU per run"), h("span", {}, finite(x?.cpu_ms_per_run) ? `${fmtVal(x.cpu_ms_per_run, "ms")} in the timed pairs` : "—"),
        h("span", {}, "Profiled launch"), h("span", {}, finite(x?.profiled_cpu_ms_per_run) ? `${fmtVal(x.profiled_cpu_ms_per_run, "ms")} per run (perturbed, with profiler)` : "—"),
        h("span", {}, "Measured runs"), h("span", {}, x?.per_run ? String(x.runs) : x?.untimed ? "whole capture (samples carry no times)" : "unknown"),
      ),
      h("div", { style: "margin-top:6px" },
        cmdRow(`strobe open ${r.id}/${role}`),
        cmdRow(`strobe query ${a.recording} ${x?.engine === "native" ? "threads" : "hotspots --by package"}`)
      )
    );
  };
  // The call tree of each side as an icicle, its width the side's sampled time against the larger.
  const kinds = [["cpu", "CPU time"], ["alloc", "Allocations"]].filter(([k]) => roles.some((role) => (att(role)?.tree?.[k]?.nodes?.length || 0) > 1));
  state.implZoom = state.implZoom || {};
  if (kinds.length && !kinds.some(([k]) => k === state.flameKind)) state.flameKind = kinds[0][0];
  const kind = state.flameKind;
  const treeOf = (role) => att(role)?.tree?.[kind] || null;
  const rootOf = (role) => treeOf(role)?.nodes?.[0]?.[2] || 0;
  // Two call trees share a width scale only from one profiler, both per run, in one unit.
  const treesShared = roles.every((x) => treeOf(x)?.per_run) && profiler("base") === profiler("head") && treeOf("base").unit === treeOf("head").unit;
  const icicleMax = (role) => Math.max(1e-9, ...(treesShared ? roles : [role]).map(rootOf));
  const icicle = (role) => {
    const t = treeOf(role);
    if (!t || (t.nodes?.length || 0) < 2) return h("div", { class: "sec-sub" }, "—");
    const isBytes = t.unit === "bytes";
    const fmtV = (v) => (isBytes ? fmtBytes(v) : fmtVal(v, "ms"));
    const nodes = t.nodes.map(([f, p, v], i) => ({ i, f, p, v, kids: [] }));
    for (const n of nodes) if (n.p >= 0 && nodes[n.p]) nodes[n.p].kids.push(n);
    const zkey = `${state.series}:${role}:${kind}`;
    const zoom = nodes[state.implZoom[zkey]] || nodes[0];
    const label = (n) => (n.f < 0 ? "all" : t.frames[n.f]?.[0] || "?");
    const file = (n) => (n.f < 0 ? "" : t.frames[n.f]?.[1] || "");
    const rowH = 18, maxDepth = 24;
    const cells = [];
    let depth = 0;
    const place = (n, left, width, d) => {
      if (width < 0.15 || d > maxDepth) return;
      depth = Math.max(depth, d);
      cells.push({ n, left, width, d });
      let x = left;
      for (const k of n.kids.slice().sort((a, b) => b.v - a.v)) {
        const w = (width * k.v) / (n.v || 1e-12);
        place(k, x, w, d + 1);
        x += w;
      }
    };
    // Unzoomed on a shared scale, the root's width is its time against the larger side's; zoomed, a
    // frame fills its column, and so does a side too small to draw at that scale (the caption says so).
    const scaled = (100 * nodes[0].v) / icicleMax(role);
    const narrow = zoom === nodes[0] && scaled >= 2;
    place(zoom, 0, narrow ? scaled : 100, 0);
    const all = nodes[0].v || 1e-12;
    return h("div", {},
      h("div", { class: "flame", style: `height:${(depth + 1) * rowH}px;margin:8px 0 4px` },
        cells.map(({ n, left, width, d }) => {
          const el = h("div", {
            class: "fl-node",
            style: `left:${left}%;width:calc(${width}% - 1px);top:${d * rowH}px;background:var(--surface-subtle)`,
            onclick: () => { state.implZoom[zkey] = n === zoom && n.p >= 0 ? n.p : n.i; render(); },
          }, width > 4 ? label(n) : "");
          el.addEventListener("pointerenter", (e) => showTip(e, label(n), [
            file(n) ? ["File", file(n)] : null,
            [nameOf(role), `${fmtV(n.v)}${t.per_run ? " / run" : " (whole capture)"}`],
            ["Share", `${((100 * n.v) / all).toFixed(1)}% of this side's ${t.what}`],
          ].filter(Boolean)));
          el.addEventListener("pointermove", moveTip);
          el.addEventListener("pointerleave", hideTip);
          return el;
        })
      ),
      h("div", { class: "sec-sub" }, `${t.what} · ${fmtV(nodes[0].v)}${t.per_run ? " per run" : " over the whole capture (no times)"} · perturbed: from the profiled launch (${profiler(role)})${treesShared && zoom === nodes[0] && !narrow ? ` · ${scaled.toFixed(1)}% of the larger side's, drawn across the column` : ""} · ${t.nodes.length} of ${t.nodes_total} frames${zoom !== nodes[0] ? " · zoomed: click the top frame to go up" : " · click to zoom"}`)
    );
  };
  const toggle = kinds.length > 1
    ? h("div", { class: "seg", role: "group", "aria-label": "Call trees of" },
        kinds.map(([k, lbl]) => h("button", { type: "button", "aria-pressed": String(kind === k), onclick: () => { state.flameKind = k; state.implZoom = {}; render(); } }, lbl)))
    : null;
  const untimedNote = roles.some((role) => att(role) && sd(role)?.untimed) ? " · * whole capture, not per run (these samples carry no times)" : "";
  return h("section", { class: "card-surface", id: "impl-attribution" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Where each spends its time"),
        h("span", { class: "sec-sub" }, "One profiled launch per implementation, apart from the timed pairs and slowed by its profiler · each read with its own engine's tools · both columns share a scale only where their numbers come from one source · never a diff")
      ),
      h("div", { class: "card-hd-right" }, toggle)
    ),
    h("div", { class: "impl-grid" }, roles.map(head)),
    pair("By process", "CPU per run of each process, from the OS (a browser's by role)", "processes", ms, processesFrom),
    pair("By whose threads", "app: started in the app's code · driver: a device driver's user-mode part · os: the OS's pools and services", "origins", ms),
    pair("Busiest threads", "CPU per run, from the OS", "threads", ms),
    kinds.length ? [
      h("div", { class: "impl-attr-sub" }, h("span", { class: "impl-attr-title" }, "Call trees"), h("span", { class: "sec-sub" }, `A browser's profile covers its JavaScript; native stacks cover every thread · ${treesShared ? "width: time against the larger side" : "each column on its own scale (different profilers)"}`)),
      h("div", { class: "impl-grid" }, roles.map((role) => h("div", {}, icicle(role)))),
    ] : null,
    pair("Top functions", `self time per run, sampled${untimedNote}`, "functions", msSampled),
    pair("Top packages", `self time per run, sampled${untimedNote}`, "packages", msSampled),
    pair("Memory by part", "after the runs: a native app's by what holds it, a browser's by allocator across its processes", "memory", bytes),
  );
}

function renderVerdictCard(r, s, aa, baseTag, headTag, baseVar, headVar) {
  const c = s.primary || {};
  const m = c.metric || "?";
  const u = unitOf(m);
  const cl = classify(c, m, aa);
  let { pill, headline } = humanHeadline(c, m, u, cl, s, aa);
  // Two implementations, in the PR block's words: "Rewrite uses 62% less CPU time than Original",
  // counted as decided only once it held across the journeys (Holm).
  if (SIDES && (cl.tone === "win" || cl.tone === "loss")) {
    const better = cl.tone === "win";
    if (s.claim) headline = `${SIDES.head} ${s.claim} than ${SIDES.base}`;
    pill = c.holm_decided === false
      ? `${better ? "Better" : "Worse"} on its own · not after Holm across the journeys`
      : `${better ? "Better" : "Worse"} than ${SIDES.base}`;
  } else if (SIDES && cl.kind === "same") {
    pill = `The same as ${SIDES.base} (${fmtBound(c, u)})`;
    headline = `No meaningful difference from ${SIDES.base}`;
  } else if (SIDES && cl.kind === "noworse") {
    pill = `No worse than ${SIDES.base} (${fmtMargin(c, u)})`;
    headline = `${SIDES.head} is no worse than ${SIDES.base}, within the ${fmtMargin(c, u).slice(1)} allowed`;
  }

  const realWarnings = dedupWarnings([...(r.warnings || []), ...(s.warnings || [])]).filter((w) => w.level === "warn" || w.level === "error");
  const caveatEl = realWarnings.length
    ? h("div", { class: "caveat-bar" },
        realWarnings.map((w) => h("div", { class: "caveat-item" },
          h("span", { class: "caveat-label" }, `Caveat · ${w.id}`),
          h("span", { class: "caveat-text" }, w.text)
        ))
      )
    : null;

  const rawConf = finite(c.confidence) && c.confidence > 0 && c.confidence < 0.9995
    ? c.confidence
    : finite(r.plan?.alpha) && r.plan.alpha > 0
      ? 1 - r.plan.alpha
      : finite(s.pairs) && s.pairs > 0 && s.pairs < 6
        ? Math.max(0, 1 - 2 / (2 ** s.pairs))
        : 0.95;
  const ciPct = +(100 * rawConf).toFixed(1);
  const looks = (r.plan?.looks || []).filter(finite);
  const ciExplain = s.pairs < 6 && ciPct < 94.5
    ? `${Math.round(ciPct)}% range (${s.pairs} pairs)`
    : looks.length > 1 && ciPct > 95.1
      ? `${ciPct}% CI (${looks.length}-check adjusted)`
      : `${ciPct}% CI`;

  return h("section", { class: "card-surface" },
    caveatEl,
    h("div", { class: "hero-body" },
      h("div", { class: "hero-header" },
        h("div", { class: "eyebrow-row" },
          h("span", { class: `status-pill ${cl.tone}` }, pill),
          h("span", { class: "eyebrow-meta" }, `${s.label || s.case || "Benchmark"} · Primary: ${labelOf(m)}`)
        ),
        h("h1", { class: "hero-headline" }, headline),
        buildHeroProse(r, s, c, cl, aa),
        // Two implementations show their screens side by side above the equivalence checks.
        SIDES ? null : renderShown(s)
      ),
      h("div", { class: "hero-metrics-grid" },
        h("div", { style: "min-width:0" },
          h("div", { class: "ba-compare" },
            h("div", { class: "ba-col" },
              h("span", { class: "ba-label" }, h("i", { class: "swatch base" }), SIDES ? baseTag : `Base · ${baseTag}`),
              h("span", { class: "ba-val muted" }, fmtVal(cl.kind === "refused" ? null : c.base, u))
            ),
            h("span", { class: "ba-arrow" }, SIDES ? "vs" : "→"),
            h("div", { class: "ba-col" },
              h("span", { class: "ba-label" }, h("i", { class: `swatch head ${cl.tone}` }), SIDES ? headTag : `Head · ${headTag}`),
              h("span", { class: "ba-val" }, fmtVal(cl.kind === "refused" ? null : c.head, u))
            )
          ),
          baseVar?.subject || headVar?.subject
            ? h("div", { class: "ba-commits" },
                baseVar?.subject ? h("div", { title: baseVar.subject }, h("span", { class: "k" }, baseTag), baseVar.subject) : null,
                headVar?.subject && headVar.subject !== baseVar?.subject ? h("div", { title: headVar.subject }, h("span", { class: "k" }, headTag), headVar.subject) : null
              )
            : null,
          h("div", { class: "ba-foot" },
            `Median across ${s.pairs || "?"} paired fresh launches (${s.launches || (s.pairs || 0) * 2} launches · ${r.plan?.runs_per_block || 5} runs/launch)`
          )
        ),
        h("div", { class: "ruler-box" },
          h("div", { class: "ruler-top" },
            h("span", { class: "ruler-title" }, "Likely change: ", h("b", {}, fmtRange(cl.kind === "refused" ? {} : c, u))),
            h("span", { class: "ruler-ci-tag" }, `Shaded: ${finite(c.noworse) ? `no worse (${fmtMargin(c, u).replace("≤", higherBetter(m, c) ? "≥−" : "≤+")})` : `${fmtBound(c, u)} equiv`} · ${ciExplain} · p = ${fmtP(cl.kind === "refused" ? NaN : c.p)}`)
          ),
          chartBox(76, (w) => drawEquivalenceRuler(w, cl.kind === "refused" ? { ...c, lo: null, hi: null, estimate: null } : c, m, u, cl, aa))
        )
      )
    )
  );
}

function drawEquivalenceRuler(w, c, m, u, cl, aa) {
  const H = 76;
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  if (!finite(c.lo) || !finite(c.hi)) {
    svg.append(S("text", { x: 0, y: 38, class: "sans" }, "Insufficient data for confidence interval"));
    return svg;
  }
  const bnd = Math.abs(c.bound ?? 0.02);
  const maxAbs = Math.max(Math.abs(c.lo), Math.abs(c.hi), Math.abs(c.estimate || 0), bnd * 1.6) * 1.22 || 0.05;
  const padX = 16;
  const x = lin(-maxAbs, maxAbs, padX, w - padX);
  const cy = 28;
  const axisY = 48;

  if (finite(c.noworse)) {
    // A no-worse margin is one-sided: everything on the better side of +margin (worse side) passes.
    const worseUp = !higherBetter(m, c);
    const edge = x(worseUp ? bnd : -bnd);
    const [bx0, bx1] = worseUp ? [padX, edge] : [edge, w - padX];
    svg.append(
      S("rect", { x: bx0, y: 8, width: Math.max(2, bx1 - bx0), height: axisY - 8, rx: 3, fill: "var(--equiv-band)" }),
      S("line", { x1: edge, y1: 8, x2: edge, y2: axisY, stroke: "var(--equiv-stroke)", "stroke-dasharray": "3 2" })
    );
  } else if (finite(bnd) && bnd > 0) {
    const bx0 = x(-bnd), bx1 = x(bnd);
    svg.append(
      S("rect", { x: bx0, y: 8, width: Math.max(2, bx1 - bx0), height: axisY - 8, rx: 3, fill: "var(--equiv-band)" }),
      S("line", { x1: bx0, y1: 8, x2: bx0, y2: axisY, stroke: "var(--equiv-stroke)", "stroke-dasharray": "3 2" }),
      S("line", { x1: bx1, y1: 8, x2: bx1, y2: axisY, stroke: "var(--equiv-stroke)", "stroke-dasharray": "3 2" })
    );
  }

  svg.append(
    S("line", { x1: padX, y1: axisY, x2: w - padX, y2: axisY, class: "axisline" }),
    S("line", { x1: x(0), y1: 8, x2: x(0), y2: axisY + 4, class: "zeroline" })
  );

  const rel = c.relative !== false;
  const tickCount = Math.max(3, Math.floor(w / 85));
  const rawTicks = rel ? niceTicks(-maxAbs * 100, maxAbs * 100, tickCount).map((t) => t / 100) : niceTicks(-maxAbs, maxAbs, tickCount);
  for (const t of rawTicks) {
    const tx = x(t);
    const lbl = t === 0 ? "0%" : rel ? `${t > 0 ? "+" : "−"}${parseFloat(Math.abs(t * 100).toPrecision(6))}%` : fmtAxisTick(t, absUnit(u), rawTicks, (v) => fmtSigned(v, absUnit(u)), true);
    svg.append(
      S("line", { x1: tx, y1: axisY, x2: tx, y2: axisY + 4, class: "axisline" }),
      S("text", { x: tx, y: axisY + 15, "text-anchor": "middle", style: "font-size:10.5px" }, lbl)
    );
  }

  const leftBetter = !higherBetter(m, c);
  svg.append(
    S("text", { x: padX, y: H - 1, "text-anchor": "start", class: "sans", style: "font-size:10.5px;fill:var(--ink-3)" }, aa ? "← Head lower" : leftBetter ? "← Better" : "← Worse"),
    S("text", { x: w - padX, y: H - 1, "text-anchor": "end", class: "sans", style: "font-size:10.5px;fill:var(--ink-3)" }, aa ? "Head higher →" : leftBetter ? "Worse →" : "Better →")
  );

  const strokeColor = cl.tone === "win" ? "var(--win)" : cl.tone === "loss" ? "var(--loss)" : cl.tone === "warn" ? "var(--warn)" : "var(--ink-2)";
  const fillTint = cl.tone === "win" ? "var(--win-bg)" : cl.tone === "loss" ? "var(--loss-bg)" : cl.tone === "warn" ? "var(--warn-bg)" : "var(--neutral-pill-bg)";
  const xLo = x(c.lo), xHi = x(c.hi);

  svg.append(
    S("rect", { x: xLo, y: cy - 5, width: Math.max(2, xHi - xLo), height: 10, rx: 5, fill: fillTint }),
    S("line", { x1: xLo, y1: cy, x2: xHi, y2: cy, stroke: strokeColor, "stroke-width": 2.5, "stroke-linecap": "round" }),
    S("line", { x1: xLo, y1: cy - 6, x2: xLo, y2: cy + 6, stroke: strokeColor, "stroke-width": 2, "stroke-linecap": "round" }),
    S("line", { x1: xHi, y1: cy - 6, x2: xHi, y2: cy + 6, stroke: strokeColor, "stroke-width": 2, "stroke-linecap": "round" })
  );

  if (finite(c.estimate)) {
    const xe = x(c.estimate);
    const estStr = fmtDelta(c.estimate, c, u);
    const labelAnchor = xe < padX + 34 ? "start" : xe > w - padX - 34 ? "end" : "middle";
    svg.append(
      S("circle", { cx: xe, cy, r: 5.5, fill: strokeColor, stroke: "var(--surface)", "stroke-width": 2 }),
      S("text", { x: xe, y: cy - 10, "text-anchor": labelAnchor, class: "strong", style: `fill:${strokeColor};paint-order:stroke;stroke:var(--surface);stroke-width:3.5px` }, estStr)
    );
  }
  return svg;
}

/* ---------- Layer 2: 4-Pillar User & System Impact ---------- */
function buildImpactModel(r, s) {
  const blocks = timedBlocks(s);
  const hz = displayHz(r, blocks);
  const vs = hz > 0 ? 1000 / hz : NaN;
  const fpl = median(blocks.map((b) => b.values?.["frames.n"]));
  const ipl = median(blocks.map((b) => (b.intervals ? b.intervals.length : NaN)));
  const hasStream = blocks.some((b) => framesKept(s, b)) && (finite(ipl) ? ipl >= 30 : fpl >= 30 && blocks.some((b) => b.intervals?.length >= 30));
  const prim = s.primary?.metric;
  const items = allComparisons(s);
  const find = (m) => items.find((x) => x.c.metric === m) || null;

  const pickHeadline = (candidates) => {
    const valid = candidates.filter((x) => x && !/^refused/.test(x.c.verdict || ""));
    const nonPrim = valid.find((x) => x.c.metric !== prim);
    return nonPrim || valid[0] || null;
  };

  const worstOf = (variant) => {
    let best = null;
    for (const b of blocks) {
      const v = b.values?.["frames.interval.max"];
      if (b.variant === variant && finite(v) && (!best || v > best)) best = v;
    }
    return best;
  };
  return { blocks, hz, vs, fpl, ipl, hasStream, prim, find, pickHeadline, maxGapBase: worstOf("base"), maxGapHead: worstOf("head") };
}

function renderImpactStrip(s, imp, aa) {
  const { find, pickHeadline, hasStream, fpl, vs, maxGapBase, maxGapHead } = imp;

  let smoothCol;
  if (hasStream) {
    const cands = [find("frames.dropped.pct"), find("frames.interval.p95")].filter(Boolean);
    const lead = pickHeadline(cands);
    const subs = [];
    for (const x of cands) if (x !== lead) subs.push(metricSubRow(x, aa));
    if (finite(maxGapBase) && finite(maxGapHead)) {
      const to = SIDES ? " vs " : "→";
      const vsStr = finite(vs) ? ` (${Math.round(maxGapBase / vs)}${to}${Math.round(maxGapHead / vs)}×)` : "";
      subs.push(h("div", { class: "pil-subrow" },
        h("span", { class: "k" }, "Max gap"),
        h("span", { class: "v" }, `${fmtBare(maxGapBase, "ms")} ${SIDES ? "vs" : "→"} ${fmtVal(maxGapHead, "ms")}${vsStr}`)
      ));
    }
    smoothCol = lead ? pillarEl("Smoothness", lead, subs, aa) : inactivePillar("Smoothness", "—", "No frame pacing metrics.");
  } else if (fpl >= 30) {
    const rp95 = find("frames.presented.p95");
    smoothCol = rp95 && !/^refused/.test(rp95.c.verdict || "")
      ? pillarEl("Smoothness", rp95, [], aa, `Frame render p95 · ~${Math.round(fpl)} paints/launch`)
      : inactivePillar("Smoothness", "Idle / static", `~${Math.round(fpl)} isolated paints per launch; no continuous animation stream.`);
  } else if (s.target_kind === "script") {
    smoothCol = inactivePillar("Smoothness", "No frames", "A script draws nothing on screen.");
  } else {
    smoothCol = inactivePillar("Smoothness", "Brief update", finite(fpl) && fpl > 0 ? `~${Math.round(fpl)} frames painted per launch (<30 needed to score pacing).` : "No frames recorded.");
  }

  const inputLead = find("interaction.p95") || find("scroll.latency.p95");
  const respCands = [inputLead, find("interaction.p50"), find("run.duration")].filter((x) => x && (x.role !== "descriptive" || x === inputLead));
  const respCol = respCands.length
    ? (() => {
        const lead = pickHeadline(respCands);
        return pillarEl(s.target_kind === "script" ? "Duration" : "Responsiveness", lead, respCands.filter((x) => x !== lead).map((x) => metricSubRow(x, aa)), aa);
      })()
    : inactivePillar("Responsiveness", "Passive case", "Workload has no discrete user input events.");

  // CPU spent per run before CPU over run time: the second moves with run length (strobe tests it only
  // when runs held their length).
  const compCands = [find("main.work"), find("main.busy"), find("cpu.work"), find("cpu.app.total")].filter(Boolean);
  const compLead = pickHeadline(compCands);
  const compCol = compLead ? pillarEl("Compute", compLead, compCands.filter((x) => x !== compLead).map((x) => metricSubRow(x, aa)), aa) : inactivePillar("Compute", "—", "No CPU metrics recorded.");

  const memCands = [find("memory.app.private"), find("js.heap.used")].filter(Boolean);
  const memLead = pickHeadline(memCands);
  const memCol = memLead ? pillarEl("Memory", memLead, memCands.filter((x) => x !== memLead).map((x) => metricSubRow(x, aa)), aa) : inactivePillar("Memory", "—", "No memory metrics recorded.");

  return h("section", { class: "pillars-section" },
    h("div", { class: "sec-heading-bar" },
      h("h2", { class: "sec-title" }, "User & system impact"),
      h("span", { class: "sec-sub" }, "Complementary dimensions · color indicates statistically confirmed shifts; neutral ink indicates descriptive context")
    ),
    h("div", { class: "pillars-grid" }, smoothCol, respCol, compCol, memCol)
  );
}

function pillarEl(title, item, subs, aa, customCap) {
  const c = item.c;
  const u = unitOf(c.metric);
  const cl = item.role !== "descriptive" && c.decided ? classify(c, c.metric, aa) : { tone: "neutral", kind: "context" };
  const toneCls = cl.tone === "win" ? "win" : cl.tone === "loss" ? "loss" : "";
  const statusText = item.role === "primary"
    ? "Primary"
    : c.decided && (cl.tone === "win" || cl.tone === "loss") ? "Confirmed"
    : c.decided && cl.kind === "same" ? "Equivalent" : "";

  return h("div", { class: "pillar" },
    h("div", { class: "pil-head" },
      h("span", { class: "pil-name" }, title),
      statusText ? h("span", { class: `pil-tag ${toneCls}` }, statusText) : null
    ),
    h("div", { class: "pil-big-row" },
      h("span", { class: "pil-val" }, fmtVal(c.head, u)),
      h("span", { class: `pil-delta ${toneCls}` }, coherentDeltaStr(c, u))
    ),
    h("div", { class: "pil-caption" }, customCap || (SIDES ? `${labelOf(c.metric)} · ${SIDES.head}; ${SIDES.base} ${fmtVal(c.base, u)}` : `${labelOf(c.metric)} · was ${fmtVal(c.base, u)}`)),
    subs.length ? h("div", { class: "pil-subs" }, subs) : null
  );
}

function inactivePillar(title, label, note) {
  return h("div", { class: "pillar" },
    h("div", { class: "pil-head" }, h("span", { class: "pil-name" }, title)),
    h("div", { class: "pil-big-row" }, h("span", { class: "pil-val inactive" }, label)),
    h("div", { class: "pil-caption" }, note)
  );
}

function coherentDeltaStr(c, u) {
  const raw = fmtDelta(c.estimate, c, u);
  if (!finite(c.base) || !finite(c.head) || !finite(c.estimate)) return raw;
  if (c.decided || c.lo > 0 || c.hi < 0) return raw;
  // Medians that print alike say nothing of the paired estimate: an undecided +1.4% stays +1.4%, never "~0%".
  if (c.head !== c.base && Math.sign(c.head - c.base) !== Math.sign(c.estimate) && Math.abs(c.estimate) >= 0.005) return "noisy";
  return raw;
}

function metricSubRow(item, aa) {
  const c = item.c;
  const u = unitOf(c.metric);
  const cl = item.role !== "descriptive" && c.decided ? classify(c, c.metric, aa) : { tone: "neutral" };
  const toneCls = cl.tone === "win" ? "win" : cl.tone === "loss" ? "loss" : "";
  const shortLbl = {
    "frames.interval.p95": "Gap p95",
    "frames.dropped.pct": "Dropped",
    "interaction.p50": "Input p50",
    "run.duration": "Task time",
    "main.busy": "Busy share",
    "main.work": "Work",
    "cpu.app.total": "Total CPU",
    "js.heap.used": "JS heap",
  }[c.metric] || labelOf(c.metric);

  return h("div", { class: "pil-subrow" },
    h("span", { class: "k" }, shortLbl),
    h("span", { class: `v ${toneCls}` }, `${fmtBare(c.base, u)} ${SIDES ? "vs" : "→"} ${fmtVal(c.head, u)} (${coherentDeltaStr(c, u)})`)
  );
}

/* ---------- Layer 3: Pair-by-Pair Consistency ---------- */
function renderEvidenceSection(r, s, aa) {
  const items = allComparisons(s).filter((x) => !/^refused/.test(x.c.verdict || ""));
  const metric = items.some((x) => x.c.metric === state.focusMetric) ? state.focusMetric : s.primary?.metric;
  const item = items.find((x) => x.c.metric === metric) || { c: s.primary || {}, role: "primary" };
  const comp = item.c;
  const u = unitOf(metric);
  const rel = comp.relative !== false;
  const ps = pairsOf(s, metric);
  const P = ps.length;
  const deltas = ps.map((p) => (rel ? p.b / p.a - 1 : p.b - p.a));

  const wins = ps.filter((p) => (higherBetter(metric, comp) ? p.b > p.a : p.b < p.a)).length;
  // A tie is neither: worse counts its own pairs.
  const losses = ps.filter((p) => (higherBetter(metric, comp) ? p.b < p.a : p.b > p.a)).length;
  const cl = item.role !== "descriptive" && comp.decided ? classify(comp, metric, aa) : { tone: "neutral", kind: "context" };

  let winSummary = `${P} launch pairs`;
  let winTone = "";
  if (P > 0) {
    const hd = sideWord("head", true);
    if (aa) winSummary = `Head lower in ${ps.filter((p) => p.b < p.a).length} of ${P} pairs`;
    else if (cl.tone === "win") { winSummary = SIDES ? `${hd} better in ${wins} of ${P} pairs` : `Head won ${wins} of ${P} pairs`; winTone = "win"; }
    else if (cl.tone === "loss") { winSummary = SIDES ? `${hd} worse in ${losses} of ${P} pairs` : `Head regressed in ${losses} of ${P} pairs`; winTone = "loss"; }
    else winSummary = `${hd} better in ${wins} of ${P} pairs`;
  }

  let geoLeft = null, geoRight = null;
  const leftBox = chartBox(164, (w) => { const out = drawPairedRaw(w, ps, metric, u, cl, aa, comp); geoLeft = out.geo; return out.svg; });
  const rightBox = chartBox(164, (w) => { const out = drawPairDeltas(w, ps, deltas, comp, metric, u, rel, cl, aa); geoRight = out.geo; return out.svg; });

  const bindScrub = (box, getGeo) => {
    box.addEventListener("pointermove", (e) => {
      const g = getGeo();
      if (!g || !P) return;
      const px = e.clientX - box.getBoundingClientRect().left;
      const k = Math.max(1, Math.min(P, Math.round(g.x.inv(px))));
      if (state.hoverPair !== k) { state.hoverPair = k; pairPaintFns.forEach((fn) => fn()); }
      const p = ps[k - 1];
      const dStr = rel ? fmtPct(deltas[k - 1]) : fmtSigned(deltas[k - 1], absUnit(u));
      showTip(e, `Launch Pair ${k} (${p.order})`, [
        [sideWord("base", true), fmtVal(p.a, u)],
        [sideWord("head", true), fmtVal(p.b, u)],
        ["Pair Δ", dStr],
        p.base.recording ? ["Recordings", `${p.base.recording} · ${p.head.recording}`] : null,
      ]);
    });
    box.addEventListener("pointerleave", () => {
      state.hoverPair = null;
      hideTip();
      pairPaintFns.forEach((fn) => fn());
    });
  };

  bindScrub(leftBox, () => geoLeft);
  bindScrub(rightBox, () => geoRight);
  pairPaintFns.push(() => { leftBox.repaint(); rightBox.repaint(); });

  const picker = h("select", {
    class: "metric-picker",
    "aria-label": "Inspect metric across pairs",
    onchange: (e) => { state.focusMetric = e.currentTarget.value; render(); },
  }, items.map((x) => h("option", { value: x.c.metric, selected: x.c.metric === metric }, `${x.role === "primary" ? "Primary: " : ""}${labelOf(x.c.metric)}`)));

  return h("section", { class: "card-surface", id: "evidence" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Pair-by-pair consistency"),
        h("span", { class: `win-count-pill ${winTone}` }, winSummary),
        h("span", { class: "sec-sub" }, "Alternating fresh launches (AB / BA)")
      ),
      h("div", { class: "card-hd-right" }, picker)
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "evi-grid" },
        h("div", { class: "plot-col" },
          h("div", { class: "plot-caption" }, h("span", {}, `${labelOf(metric)} per launch`), h("span", { class: "dim" }, `○ ${sideWord("base", true)}  ${SIDES ? "vs" : "→"}  ● ${sideWord("head", true)}`)),
          leftBox
        ),
        h("div", { class: "plot-col" },
          h("div", { class: "plot-caption" }, h("span", {}, `Per-pair ${rel ? "% difference" : "difference"}`), h("span", { class: "dim" }, `Shaded: ${fmtBound(comp, u)} · Dashed: ${fmtDelta(comp.estimate, comp, u)} median`)),
          rightBox
        )
      )
    )
  );
}

function drawPairedRaw(w, ps, metric, u, cl, aa, comp) {
  const H = 164;
  const m = { l: 52, r: 14, t: 10, b: 24 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const P = ps.length;
  if (!P) {
    svg.append(S("text", { x: w / 2, y: H / 2, "text-anchor": "middle", class: "sans" }, "No paired launches"));
    return { svg, geo: null };
  }
  const vals = ps.flatMap((p) => [p.a, p.b]);
  let y0 = Math.min(...vals), y1 = Math.max(...vals);
  if (y1 - y0 <= 0) { const pad = Math.abs(y0) * 0.05 || 1; y0 -= pad; y1 += pad; }
  const yPad = (y1 - y0) * 0.14;
  const y = lin(y0 - yPad, y1 + yPad, H - m.b, m.t);
  const ticks = niceTicks(y0 - yPad, y1 + yPad, 4);
  const suffix = u === "%" ? "%" : u === "count" ? "" : " " + u;
  const labels = ticks.map((t) => fmtAxisTick(t, u, ticks, (v) => `${parseFloat(v.toPrecision(6))}${suffix}`));
  m.l = axisLeft(labels, m.l);
  const x = lin(0.6, P + 0.4, m.l, w - m.r);

  ticks.forEach((t, i) => {
    svg.append(
      S("line", { x1: m.l, y1: y(t), x2: w - m.r, y2: y(t), class: "gridline" }),
      S("text", { x: m.l - 7, y: y(t) + 3.5, "text-anchor": "end", style: "font-size:10.5px" }, labels[i])
    );
  });
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: w - m.r, y2: H - m.b, class: "axisline" }));

  if (P > 1) {
    svg.append(
      S("polyline", { points: ps.map((p, i) => `${x(i + 1)},${y(p.a)}`).join(" "), fill: "none", stroke: "var(--base-tone)", "stroke-width": 1, "stroke-opacity": 0.28, "stroke-dasharray": "2 2" }),
      S("polyline", { points: ps.map((p, i) => `${x(i + 1)},${y(p.b)}`).join(" "), fill: "none", stroke: "var(--head-tone)", "stroke-width": 1, "stroke-opacity": 0.22 })
    );
  }

  ps.forEach((p, i) => {
    const k = i + 1, cx = x(k);
    const better = higherBetter(metric, comp) ? p.b > p.a : p.b < p.a;
    const dotColor = aa ? "var(--accent)" : better ? (cl.tone === "win" ? "var(--win)" : "var(--accent)") : (cl.tone === "loss" ? "var(--loss)" : "var(--ink-3)");
    if (state.hoverPair === k) {
      const colW = Math.max(14, (w - m.l - m.r) / (P + 0.5));
      svg.append(S("rect", { x: cx - colW / 2, y: m.t, width: colW, height: H - m.b - m.t, rx: 4, fill: "var(--equiv-band)" }));
    }
    svg.append(
      S("line", { x1: cx, y1: y(p.a), x2: cx, y2: y(p.b), stroke: dotColor, "stroke-width": state.hoverPair === k ? 2.5 : 1.75, "stroke-opacity": 0.85 }),
      S("circle", { cx, cy: y(p.a), r: 3.5, fill: "var(--surface)", stroke: "var(--base-tone)", "stroke-width": 1.6 }),
      S("circle", { cx, cy: y(p.b), r: state.hoverPair === k ? 4.5 : 3.5, fill: dotColor })
    );
  });

  const step = P <= 12 ? 1 : P <= 24 ? 2 : 5;
  for (let k = 1; k <= P; k++) {
    if (k === 1 || k === P || k % step === 0) svg.append(S("text", { x: x(k), y: H - 6, "text-anchor": "middle", style: "font-size:10.5px" }, String(k)));
  }
  return { svg, geo: { x } };
}

function drawPairDeltas(w, ps, deltas, comp, metric, u, rel, cl, aa) {
  const H = 164;
  const m = { l: 48, r: 16, t: 10, b: 24 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const P = ps.length;
  if (!P) return { svg, geo: null };

  const bnd = finite(comp.bound) ? Math.abs(comp.bound) : 0.02;
  const allVals = [0, ...deltas.filter(finite), finite(comp.estimate) ? comp.estimate : 0, bnd, -bnd];
  let y0 = Math.min(...allVals), y1 = Math.max(...allVals);
  const pad = (y1 - y0) * 0.14 || 0.02;
  const y = lin(y0 - pad, y1 + pad, H - m.b, m.t);
  const rawTicks = rel ? niceTicks((y0 - pad) * 100, (y1 + pad) * 100, 4).map((t) => t / 100) : niceTicks(y0 - pad, y1 + pad, 4);
  const labels = rawTicks.map((t) => (t === 0 ? "0%" : rel ? `${t > 0 ? "+" : "−"}${parseFloat(Math.abs(t * 100).toPrecision(5))}%` : fmtAxisTick(t, absUnit(u), rawTicks, (v) => fmtSigned(v, absUnit(u)), true)));
  m.l = axisLeft(labels, m.l);
  const x = lin(0.6, P + 0.4, m.l, w - m.r);

  if (finite(bnd) && bnd > 0) {
    svg.append(
      S("rect", { x: m.l, y: y(bnd), width: w - m.l - m.r, height: Math.max(1, y(-bnd) - y(bnd)), fill: "var(--equiv-band)" }),
      S("line", { x1: m.l, y1: y(bnd), x2: w - m.r, y2: y(bnd), stroke: "var(--equiv-stroke)", "stroke-dasharray": "3 2" }),
      S("line", { x1: m.l, y1: y(-bnd), x2: w - m.r, y2: y(-bnd), stroke: "var(--equiv-stroke)", "stroke-dasharray": "3 2" })
    );
  }

  rawTicks.forEach((t, i) => {
    svg.append(
      S("line", { x1: m.l, y1: y(t), x2: w - m.r, y2: y(t), class: t === 0 ? "zeroline" : "gridline" }),
      S("text", { x: m.l - 7, y: y(t) + 3.5, "text-anchor": "end", style: "font-size:10.5px" }, labels[i])
    );
  });
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: w - m.r, y2: H - m.b, class: "axisline" }));

  if (finite(comp.estimate)) {
    const estColor = cl.tone === "win" ? "var(--win)" : cl.tone === "loss" ? "var(--loss)" : "var(--ink-3)";
    svg.append(S("line", { x1: m.l, y1: y(comp.estimate), x2: w - m.r, y2: y(comp.estimate), stroke: estColor, "stroke-width": 1.25, "stroke-dasharray": "4 3", "stroke-opacity": 0.75 }));
  }

  deltas.forEach((d, i) => {
    if (!finite(d)) return;
    const k = i + 1, cx = x(k);
    const better = higherBetter(metric, comp) ? d > 0 : d < 0;
    const color = aa ? "var(--ink-3)" : better ? (cl.tone === "win" ? "var(--win)" : "var(--accent)") : (cl.tone === "loss" ? "var(--loss)" : "var(--ink-3)");
    if (state.hoverPair === k) {
      const colW = Math.max(14, (w - m.l - m.r) / (P + 0.5));
      svg.append(S("rect", { x: cx - colW / 2, y: m.t, width: colW, height: H - m.b - m.t, rx: 4, fill: "var(--equiv-band)" }));
    }
    svg.append(
      S("line", { x1: cx, y1: y(0), x2: cx, y2: y(d), stroke: color, "stroke-width": state.hoverPair === k ? 3 : 2, "stroke-linecap": "round" }),
      S("circle", { cx, cy: y(d), r: state.hoverPair === k ? 4.5 : 3.5, fill: color })
    );
  });

  const step = P <= 12 ? 1 : P <= 24 ? 2 : 5;
  for (let k = 1; k <= P; k++) {
    if (k === 1 || k === P || k % step === 0) svg.append(S("text", { x: x(k), y: H - 6, "text-anchor": "middle", style: "font-size:10.5px" }, String(k)));
  }
  return { svg, geo: { x } };
}

/* ---------- Layer 4: Recommended Next Step (Completes Top-Half Decision Flow) ---------- */
function quoteArg(v) {
  return /^[\w.:/\\=@,+~-]+$/.test(v) ? v : `"${String(v).replace(/"/g, '\\"')}"`;
}

// A side as `--base`/`--head` take it: an implementation comparison's `<target>=<variant>`.
function sideArg(v) {
  return v.target ? (v.commit ? `${v.target}=${String(v.commit).slice(0, 10)}` : v.kind === "exe" || v.kind === "app" ? `${v.target}=${v.spec}` : v.target) : v.spec;
}

function renderNextStepsSection(r, s, aa) {
  const c = s.primary || {};
  const m = c.metric || "";
  const u = unitOf(m);
  const file = cleanPath(r.file || "<bench-file>");
  const baseVar = (r.variants || []).find((v) => v.role === "base");
  const headVar = (r.variants || []).find((v) => v.role === "head");

  const benchCmd = (extra) => [
    "strobe bench",
    extra,
    quoteArg(file),
    aa ? "--aa" : null,
    !aa && baseVar ? `--base ${quoteArg(sideArg(baseVar))}` : null,
    headVar ? `--head ${quoteArg(sideArg(headVar))}` : null,
    (r.series || []).length > 1 && s.case ? `--filter ${quoteArg(s.case)}` : null,
  ].filter(Boolean).join(" ");

  const items = [];
  const realWarns = dedupWarnings([...(r.warnings || []), ...(s.warnings || [])]).filter((w) => w.level === "warn" || w.level === "error");
  if (realWarns.some((w) => w.id === "StateDrift" || w.id === "NotSteady")) {
    items.push({
      why: h("span", {}, h("b", {}, "Stabilize benchmark state first: "), "reset growing DOM or application state between runs so warmup reaches a steady baseline, then re-verify."),
      cmd: null,
    });
  } else if (realWarns.some((w) => w.id === "HighVariance")) {
    items.push({
      why: h("span", {}, h("b", {}, "Reduce between-launch noise: "), "quiet background work or isolate unsteady timers before running a larger pair budget."),
      cmd: null,
    });
  }
  if (realWarns.some((w) => w.id === "Background")) {
    items.push({
      why: h("span", {}, h("b", {}, "Quiet background CPU activity: "), "other processes ran on the measured CPUs during the experiment; close competing workloads if intervals are wider than expected."),
      cmd: null,
    });
  }

  const need = c.needed_pairs;
  if (!s.decided && finite(need) && need > (s.pairs || 0) && need < 1000) {
    const estMs = finite(s.elapsed_ms) && s.pairs > 0 ? (s.elapsed_ms / s.pairs) * need : NaN;
    const timeHint = finite(estMs) ? ` (~${fmtDuration(estMs)})` : "";
    const advice = aa
      ? `Optional — run ~${need} A/A pairs${timeHint} only if calibrating this case's ±2% noise floor:`
      : need <= 90
        ? `Run ~${need} pairs${timeHint} to resolve a ${fmtBound(c, u)} difference:`
        : `Resolving ${fmtBound(c, u)} would take ~${need} pairs${timeHint}. Only re-run if hunting sub-2% shifts:`;
    items.push({ why: h("span", {}, advice), cmd: benchCmd(`--pairs ${need}`) });
  } else if (!aa && s.decided && finite(s.holm_pairs) && s.pairs < s.holm_pairs && (s.secondaries || []).some((sec) => !sec.decided && (sec.lo > 0 || sec.hi < 0))) {
    items.push({
      why: h("span", {}, `Primary is decided; run ${s.holm_pairs} pairs if you also want to statistically confirm secondary metrics:`),
      cmd: benchCmd(`--pairs ${s.holm_pairs}`),
    });
  }

  items.push({
    why: h("span", {}, s.decided && !aa ? "Result is statistically decided — generate Markdown summary for your pull request:" : "Export a concise Markdown summary:"),
    cmd: `strobe report experiment ${r.id} --format md`,
  });

  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Recommended next step"))),
    h("div", { class: "card-bd" },
      h("div", { class: "next-list" }, items.map((it) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, it.why), it.cmd ? cmdRow(it.cmd) : null)))
    )
  );
}

function cmdRow(cmd) {
  // Served by the daemon (/report/…), `strobe open` is a link: the daemon builds the trace and opens Perfetto.
  const open = /^strobe open (\S+)$/.exec(cmd);
  const link = open && location.pathname.startsWith("/report/")
    ? h("a", { class: "btn-ghost", href: `/perfetto/open/${open[1]}`, target: "_blank" }, "Open")
    : null;
  return h("div", { class: "cmd-box" }, h("code", {}, cmd), link, copyBtn(cmd, "Copy", "cmd-copy"));
}

function copyBtn(text, label = "Copy", cls = "btn-ghost") {
  const btn = h("button", { type: "button", class: cls }, label);
  btn.addEventListener("click", (e) => { e.stopPropagation(); copyText(text, btn, label); });
  return btn;
}

/* ---------- Deep Dive 1: Timed Main-Thread Phase Breakdown ---------- */
function renderMainThreadPhaseSection(s, aa) {
  const comps = new Map(allComparisons(s).map((x) => [x.c.metric, x.c]));
  const blocks = timedBlocks(s);

  const statFor = (metric) => {
    const c = comps.get(metric);
    if (c && finite(c.base) && finite(c.head)) return c;
    const ps = pairsOf(s, metric);
    if (!ps.length) return null;
    const base = median(ps.map((p) => p.a));
    const head = median(ps.map((p) => p.b));
    return finite(base) && finite(head) ? { metric, base, head, estimate: base > 0 ? head / base - 1 : head - base, relative: base > 0 } : null;
  };

  const scriptC = statFor("main.script");
  const styleC = statFor("main.style");
  const layoutC = statFor("main.layout");
  if (!scriptC && !styleC && !layoutC) return null;

  const workC = statFor("main.work");
  const layoutCnt = statFor("layout.count");
  const styleCnt = statFor("style.count");

  const bScript = scriptC?.base || 0, hScript = scriptC?.head || 0;
  const bStyle = styleC?.base || 0, hStyle = styleC?.head || 0;
  const bLayout = layoutC?.base || 0, hLayout = layoutC?.head || 0;
  const sumB = bScript + bStyle + bLayout;
  const sumH = hScript + hStyle + hLayout;
  const bTotal = workC ? Math.max(workC.base, sumB) : sumB;
  const hTotal = workC ? Math.max(workC.head, sumH) : sumH;
  const bOther = Math.max(0, bTotal - sumB);
  const hOther = Math.max(0, hTotal - sumH);
  const maxTotal = Math.max(bTotal, hTotal, 0.1);

  const barRow = (lbl, swCls, sc, st, ly, ot, tot) => h("div", { class: "phase-bar-row" },
    h("span", { class: "missed-lbl" }, h("i", { class: `swatch ${swCls}` }), lbl),
    h("div", { class: "phase-track" },
      sc > 0 ? h("i", { class: "phase-seg ph-script", style: `width:${(sc / maxTotal) * 100}%`, title: `Script: ${fmtVal(sc, "ms")}` }) : null,
      st > 0 ? h("i", { class: "phase-seg ph-style", style: `width:${(st / maxTotal) * 100}%`, title: `Style: ${fmtVal(st, "ms")}` }) : null,
      ly > 0 ? h("i", { class: "phase-seg ph-layout", style: `width:${(ly / maxTotal) * 100}%`, title: `Layout: ${fmtVal(ly, "ms")}` }) : null,
      ot > 0.05 ? h("i", { class: "phase-seg ph-other", style: `width:${(ot / maxTotal) * 100}%`, title: `Other main-thread work: ${fmtVal(ot, "ms")}` }) : null
    ),
    h("span", { class: "mono", style: "text-align:right;font-size:12px;color:var(--ink)" }, fmtVal(tot, "ms"))
  );

  const phases = [
    scriptC ? { name: "JavaScript", cls: "ph-script", c: scriptC, cnt: null } : null,
    styleC ? { name: "Style recalc", cls: "ph-style", c: styleC, cnt: styleCnt } : null,
    layoutC ? { name: "Layout", cls: "ph-layout", c: layoutC, cnt: layoutCnt } : null,
    workC && (bOther >= 0.5 || hOther >= 0.5)
      ? { name: "Other tasks (paint / parse / IPC)", cls: "ph-other", c: { base: bOther, head: hOther, estimate: bOther > 0 ? hOther / bOther - 1 : 0, relative: true }, cnt: null }
      : null,
  ].filter(Boolean);

  const refConf = (scriptC || styleC || layoutC)?.confidence;
  const confPctStr = finite(refConf) ? `${Math.round(refConf * 100)}%` : "95%";

  return h("section", { class: "card-surface", id: "phases" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Where main-thread work went"),
        h("span", { class: "sec-sub" }, `Timed across all ${s.pairs || blocks.length / 2} launch pairs · profiler off · ${confPctStr} paired intervals`)
      )
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "phase-bars" },
        barRow("Base", "base", bScript, bStyle, bLayout, bOther, bTotal),
        barRow("Head", "head", hScript, hStyle, hLayout, hOther, hTotal)
      ),
      h("div", { class: "phase-table" },
        h("div", { class: "phase-trow hd" },
          h("span", {}, "Phase"),
          h("span", {}, "Base → Head / run"),
          h("span", { style: "text-align:right" }, "Paired Δ"),
          h("span", { class: "ph-ci-col", style: "text-align:right" }, `${confPctStr} range`)
        ),
        phases.map((p) => {
          const c = p.c;
          const cntNote = p.cnt && finite(p.cnt.base) && finite(p.cnt.head)
            ? `  (${fmtBare(p.cnt.base, "count")}→${fmtVal(p.cnt.head, "count")} passes)`
            : "";
          const clear = finite(c.lo) && finite(c.hi) && (c.lo > 0 || c.hi < 0);
          // The paired change (the median of the pairs' own changes), which the colour and range are
          // of: the medians' difference can point the other way. A row without a comparison has none.
          const deltaTxt = finite(c.lo) && finite(c.hi) ? fmtDelta(c.estimate, c, "ms") : "—";
          return h("div", { class: "phase-trow" },
            h("span", { style: "font-weight:500;display:flex;align-items:center" }, h("i", { class: `ph-dot ${p.cls}` }), p.name),
            h("span", { class: "mono", style: "color:var(--ink-2);font-size:11.5px" },
              `${fmtBare(c.base, "ms")} → ${fmtVal(c.head, "ms")}`,
              cntNote ? h("span", { style: "color:var(--ink-3)" }, cntNote) : null
            ),
            h("span", { class: "mono", style: `text-align:right;font-weight:${clear && !aa ? 600 : 400};color:${clear && !aa && c.hi < 0 ? "var(--win-ink)" : clear && !aa && c.lo > 0 ? "var(--loss-ink)" : "var(--ink-2)"}` },
              deltaTxt
            ),
            h("span", { class: "mono ph-ci-col", style: "text-align:right;color:var(--ink-3);font-size:11px" },
              finite(c.lo) && finite(c.hi) ? fmtRange(c, "ms", " … ") : "—"
            )
          );
        })
      )
    )
  );
}

/* ---------- Shared Expandable Call-Stack & Complete Location Drawer ---------- */
function renderStackDrawer(rowB, rowH) {
  const locs = [];
  const locB = rowB?.where && rowB.where !== "(native)" ? cleanPath(rowB.where) : null;
  const locH = rowH?.where && rowH.where !== "(native)" ? cleanPath(rowH.where) : null;
  if (locH) locs.push(["Head location", locH]);
  if (locB && locB !== locH) locs.push(["Base location", locB]);
  if (!locs.length) {
    const callerH = extractNativeCaller(rowH?.stacks);
    const callerB = extractNativeCaller(rowB?.stacks);
    if (callerH?.fullLoc) locs.push(["Head caller", callerH.fullLoc]);
    if (callerB?.fullLoc && callerB.fullLoc !== callerH?.fullLoc) locs.push(["Base caller", callerB.fullLoc]);
  }

  const stackBlocks = [];
  for (const [sideLabel, sideRow] of [["Head", rowH], ["Base", rowB]]) {
    if (!sideRow?.stacks?.length) continue;
    const totalW = sideRow.weight || sideRow.self_ms || 1;
    sideRow.stacks.slice(0, 3).forEach((st, idx) => {
      const frames = st.frames || [];
      if (!frames.length) return;
      const pctOfRow = totalW > 0 && finite(st.weight) ? `${Math.round((st.weight / totalW) * 100)}% of row` : `${st.samples || ""} samples`;
      const rev = frames.slice().reverse();
      const stackKey = `${sideLabel}:${sideRow.name}:${idx}`;
      const showAll = state.fullStacks.has(stackKey) || rev.length <= 12;
      const renderFrameEl = (fr, fi) => {
        const full = frameFullLoc(fr);
        const short = shortLocation(full);
        const fnName = fr.name || "(anonymous)";
        const locEl = full && full !== "(native)"
          ? h("span", {
              class: "fr-loc",
              title: `${full} (click to copy full path)`,
              onclick: (e) => {
                e.stopPropagation();
                copyText(full, e.currentTarget, short);
              },
            }, short)
          : h("span", { style: "color:var(--ink-4)" }, "native");
        return h("div", { class: "stack-fr" },
          h("span", { class: "fr-arrow" }, fi === 0 ? "•" : "←"),
          h("span", { class: "fr-fn", title: fnName }, fnName),
          locEl
        );
      };
      const frameEls = showAll
        ? rev.map((fr, fi) => renderFrameEl(fr, fi))
        : [
            ...rev.slice(0, 8).map((fr, fi) => renderFrameEl(fr, fi)),
            h("button", {
              type: "button",
              class: "more-frames-btn",
              onclick: (e) => {
                e.stopPropagation();
                state.fullStacks.add(stackKey);
                render();
              },
            }, `Show all ${rev.length} frames (+${rev.length - 10} middle frames)`),
            ...rev.slice(-2).map((fr, fi) => renderFrameEl(fr, rev.length - 2 + fi)),
          ];

      stackBlocks.push(
        h("div", { class: "stack-block" },
          h("div", { class: "stack-block-hd" },
            h("span", {}, `${sideLabel} stack ${sideRow.stacks.length > 1 ? "#" + (idx + 1) : ""}`),
            h("span", { class: "mono", style: "text-transform:none" }, pctOfRow)
          ),
          h("div", { class: "stack-frames" }, frameEls)
        )
      );
    });
  }

  return h("div", { class: "stack-drawer", onclick: (e) => e.stopPropagation() },
    locs.map(([lbl, full]) => h("div", { class: "full-loc-row" },
      h("span", { style: "color:var(--ink-3);font-size:11.5px;min-width:84px" }, lbl),
      h("code", { class: "full-loc-code" }, full),
      copyBtn(full, "Copy path", "mini-copy")
    )),
    stackBlocks.length ? h("div", { class: "stacks-cols" }, stackBlocks.slice(0, 4)) : null
  );
}

/* ---------- Deep Dive 2: CPU Self-Time Hotspots ---------- */
function groupWeightedRows(list, byFile, div, valFn) {
  const map = new Map();
  for (const x of list || []) {
    const key = byFile ? normLocationKey(x.name) : `${x.name}\0${normLocationKey(x.where)}`;
    const v = valFn(x) / div;
    const cur = map.get(key);
    if (!cur) {
      map.set(key, {
        name: byFile ? shortLocation(x.name) || x.name : x.name,
        fullFile: byFile ? cleanPath(x.name) : null,
        where: x.where,
        val: v,
        weight: x.weight || 0,
        stacks: x.stacks || [],
        raw: x,
      });
    } else {
      cur.val += v;
      cur.weight += x.weight || 0;
      if (x.stacks?.length) {
        cur.stacks = [...(cur.stacks || []), ...x.stacks]
          .sort((a, b) => (b.weight || 0) - (a.weight || 0))
          .slice(0, 3);
      }
    }
  }
  return map;
}

/* Each per-recording scope of a script target's profile and the attribution side's key that holds it (`#scope=host|startup|setup` picks one) */
const CPU_SCOPES = { host: "whole_host", startup: "startup", setup: "setup" };
const CPU_SCOPE_WORDS = { host: "the whole host process", startup: "the host's startup", setup: "the bench file's setup" };

/* The scope shown for these sides: the one asked when every side has it, else the measured runs */
function cpuScopeOf(...sides) {
  const key = Object.hasOwn(CPU_SCOPES, state.cpuScope) ? CPU_SCOPES[state.cpuScope] : null;
  return key && sides.every((x) => x?.[key]?.rows?.length) ? state.cpuScope : "runs";
}

/* A script target's attribution side in `scope`: its measured runs, or a per-recording profile (`whole_host`, `startup`, `setup`; not per run) */
function cpuScoped(side, scope) {
  const w = side?.[CPU_SCOPES[scope]];
  if (!w?.rows?.length) return side;
  return { ...side, rows: w.rows, files: w.files, samples: w.samples, mapped_samples: w.mapped_samples, runs: 1, label: w.label };
}

/* The measured runs / whole host / startup / setup toggle: each scope every side given has a profile of */
function cpuScopeToggle(...sides) {
  const opts = Object.entries(CPU_SCOPES)
    .filter(([, key]) => sides.every((x) => x?.[key]?.rows?.length))
    .map(([val, key]) => [val, sides.find((x) => x?.[key]?.label)?.[key]?.label || val]);
  if (!opts.length) return null;
  return h("div", { class: "seg", role: "group", "aria-label": "CPU profile scope" },
    [["runs", "Measured runs"], ...opts].map(([val, lbl]) =>
      h("button", { type: "button", "aria-pressed": String(cpuScopeOf(...sides) === val), onclick: () => { state.cpuScope = val; render(); } }, lbl)
    )
  );
}

/* A hotspots card with no row of self time in the scope shown, with the scope toggle so the others stay reachable */
function cpuEmptySection(scopeToggle, scope) {
  const where = CPU_SCOPE_WORDS[scope];
  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "CPU self-time hotspots"),
        h("span", { class: "sec-sub" }, where
          ? `no function with self time in ${where} beyond the runtime's own rows ((program), (idle), (garbage collector), (root))`
          : "no sample in the measured runs: the host ran no JavaScript there that its sampler saw")
      ),
      h("div", { class: "card-hd-right" }, scopeToggle)
    )
  );
}

function renderCpuHotspotsSection(s, aa) {
  const scopeToggle = cpuScopeToggle(s.hotspots?.base, s.hotspots?.head);
  const scope = scopeToggle ? cpuScopeOf(s.hotspots.base, s.hotspots.head) : "runs";
  const host = scope !== "runs";
  const hs = host ? { base: cpuScoped(s.hotspots.base, scope), head: cpuScoped(s.hotspots.head, scope) } : s.hotspots;
  if (!hs?.base?.rows?.length || !hs?.head?.rows?.length) return scopeToggle ? cpuEmptySection(scopeToggle, scope) : null;

  const canFiles = !!(hs.base.files?.length && hs.head.files?.length);
  const byFile = state.whyBy === "file" && canFiles;
  // Self-time tables: a row that only calls (self 0, listed by its total) is none of them.
  const selfRows = (l) => (l || []).filter((r) => (r.weight ?? r.self_ms ?? 0) > 0);
  const listB = selfRows(byFile ? hs.base.files : hs.base.rows);
  const listH = selfRows(byFile ? hs.head.files : hs.head.rows);
  const runsB = hs.base.runs || STROBE?.data?.plan?.runs_per_block || 1;
  const runsH = hs.head.runs || STROBE?.data?.plan?.runs_per_block || 1;
  const rowMs = (r) => (finite(r.self_ms) ? r.self_ms : finite(r.weight) ? r.weight / 1000 : 0);

  const isSys = (n) => /^\((idle|program|garbage collector|root)\)$/.test(n);
  const B = groupWeightedRows(listB, byFile, runsB, rowMs);
  const H = groupWeightedRows(listH, byFile, runsH, rowMs);
  const floorB = Math.min(...listB.map((x) => rowMs(x) / runsB));
  const floorH = Math.min(...listH.map((x) => rowMs(x) / runsH));

  const merged = [...new Set([...B.keys(), ...H.keys()])].map((k) => {
    const b = B.get(k), hd = H.get(k);
    const primary = hd || b;
    if (isSys(primary.name)) return null;
    const bv = b ? b.val : floorB;
    const hv = hd ? hd.val : floorH;
    const delta = hv - bv;
    const valid = !!(b && hd) || (!b && delta > 0) || (!hd && delta < 0);
    return valid ? { key: "cpu:" + k, name: primary.name, fullFile: primary.fullFile, where: primary.where, b, hd, bv, hv, delta } : null;
  }).filter(Boolean).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));

  const rows = merged.slice(0, 8);
  if (!rows.length) return scopeToggle ? cpuEmptySection(scopeToggle, scope) : null;

  const maxAbs = Math.max(...rows.map((r) => Math.abs(r.delta)), 0.01);
  const scale = Math.max(maxAbs * 1.12, 2.0);
  const posPct = (v) => 50 + (v / scale) * 50;

  const workB = hs.base.values?.["main.work"];
  const workH = hs.head.values?.["main.work"];
  const primEst = s.primary?.estimate;
  const drifted = finite(workB) && finite(workH) && finite(primEst) && s.primary?.decided
    && Math.sign(workH - workB) !== 0 && Math.sign(workH - workB) !== Math.sign(primEst);

  let noteText = null;
  if (aa) {
    noteText = `A/A control: both profiled launches ran identical code (${shortNum(workB)} vs ${shortNum(workH)} ms/run with V8 profiler attached); differences below show single-launch sampling variance.`;
  } else if (drifted) {
    noteText = `Profiled in 1 separate diagnostic launch per build so V8 sampling never perturbs timed runs (profiler overhead shifted that single pair's total work to ${shortNum(workB)} → ${shortNum(workH)} ms/run; read function deltas below as directional attribution).`;
  } else if (maxAbs < 1.0) {
    noteText = `Largest individual ${byFile ? "file" : "function"} shift was under 1 ms/run (${fmtSigned(rows[0]?.delta || 0, "ms")}); the change is distributed across small calls within single-launch sampling noise.`;
  }

  const mappedPct = (hs.head.mapped_samples || hs.base.mapped_samples) ? " · source-mapped" : "";

  const sysMapB = new Map(hs.base.rows.map((x) => [x.name, x]));
  const sysMapH = new Map(hs.head.rows.map((x) => [x.name, x]));
  const progB = sysMapB.get("(program)"), progH = sysMapH.get("(program)");
  const gcB = sysMapB.get("(garbage collector)"), gcH = sysMapH.get("(garbage collector)");

  const toggle = canFiles
    ? h("div", { class: "seg", role: "group", "aria-label": "Group CPU hotspots" },
        [["fn", "By function"], ["file", "By file"]].map(([val, lbl]) =>
          h("button", { type: "button", "aria-pressed": String(state.whyBy === val), onclick: () => { state.whyBy = val; render(); } }, lbl)
        )
      )
    : null;

  return h("section", { class: "card-surface", id: "why" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "CPU self-time hotspots"),
        h("span", { class: "sec-sub" }, `1 profiled launch / build${host ? ` · ${hs.base.label || "whole host process"}, per recording` : ""}${mappedPct} · click rows for stacks & full paths`)
      ),
      h("div", { class: "card-hd-right" }, scopeToggle, toggle)
    ),
    noteText ? h("div", { class: "attr-note" }, noteText) : null,
    h("div", { class: "attr-table" },
      h("div", { class: "attr-row hd" },
        h("span", {}, byFile ? "File / script" : "Function & caller"),
        h("span", { class: "col-ba" }, "Base → Head"),
        h("span", { style: "text-align:center" }, aa ? "← Lower in head · Higher in head →" : "← Saved in head · Added in head →"),
        h("span", { style: "text-align:right" }, host ? "Δ / recording" : "Δ / run")
      ),
      rows.flatMap((x) => {
        const left = Math.min(posPct(0), posPct(x.delta));
        const width = Math.max(0.8, Math.abs(posPct(x.delta) - posPct(0)));
        const saved = x.delta < 0;
        const barCls = saved ? (aa ? "saved-aa" : "saved") : "added";
        const prefix = x.b && x.hd ? "" : x.delta > 0 ? "≥ " : "≤ ";

        const rawB = x.b ? (byFile ? { name: x.name, where: x.b.fullFile, weight: x.b.weight, stacks: x.b.stacks || [] } : x.b) : null;
        const rawH = x.hd ? (byFile ? { name: x.name, where: x.hd.fullFile, weight: x.hd.weight, stacks: x.hd.stacks || [] } : x.hd) : null;
        const canExpand = !!(rawB?.stacks?.length || rawH?.stacks?.length || (rawB?.where && rawB.where !== "(native)") || (rawH?.where && rawH.where !== "(native)"));
        const isOpen = canExpand && state.openRows.has(x.key);

        // Surface top JS/TS caller automatically for native leaf rows!
        const isNativeLeaf = !byFile && (!x.where || /^\(native\)/.test(x.where));
        const caller = isNativeLeaf ? (extractNativeCaller(x.hd?.stacks) || extractNativeCaller(x.b?.stacks)) : null;

        const fullWhere = cleanPath(x.fullFile || x.where || "");
        const rowEl = h("div", {
          class: "attr-row" + (canExpand ? " clickable" : ""),
          title: fullWhere ? `${x.name} — ${fullWhere}` : x.name,
          onclick: canExpand ? () => {
            if (state.openRows.has(x.key)) state.openRows.delete(x.key);
            else state.openRows.add(x.key);
            render();
          } : null,
        },
          h("div", { class: "fn-stack-cell" },
            h("div", { class: "fn-primary-line" },
              h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
              h("span", { class: "fn-name" }, x.name),
              !byFile ? h("span", { class: "fn-where" }, shortLocation(x.where)) : null
            ),
            caller
              ? h("div", { class: "fn-caller-hint", title: caller.fullLoc },
                  "← ", caller.fn ? h("b", {}, caller.fn) : null, caller.fn && caller.shortLoc ? " · " : "", caller.shortLoc
                )
              : null
          ),
          h("span", { class: "mono col-ba", style: "color:var(--ink-3);font-size:11.5px" },
            `${x.b ? shortNum(x.bv) : "<" + shortNum(floorB)} → ${x.hd ? shortNum(x.hv) : "<" + shortNum(floorH)} ms`
          ),
          h("div", { class: "div-track" },
            h("i", { class: "div-zero" }),
            h("i", { class: `div-bar ${barCls}`, style: `left:${left}%;width:${width}%` })
          ),
          h("span", {
            class: "mono",
            style: `text-align:right;font-weight:${Math.abs(x.delta) >= 1 && !aa ? 600 : 400};color:${saved && Math.abs(x.delta) >= 1 && !aa ? "var(--win-ink)" : "var(--ink-2)"}`,
          }, `${prefix}${fmtSigned(x.delta, "ms")}`)
        );

        return isOpen ? [rowEl, renderStackDrawer(rawB, rawH)] : [rowEl];
      })
    ),
    h("div", { class: "attr-foot" },
      [
        progB || progH ? `Runtime / VM: ${progB ? shortNum(rowMs(progB) / runsB) : "—"} → ${progH ? shortNum(rowMs(progH) / runsH) : "—"} ${host ? "ms" : "ms/run"}` : null,
        gcB || gcH ? `V8 GC profiler samples: ${gcB ? shortNum(rowMs(gcB) / runsB) : "—"} → ${gcH ? shortNum(rowMs(gcH) / runsH) : "—"} ${host ? "ms" : "ms/run"}` : null,
        `${hs.base.samples ?? "?"} / ${hs.head.samples ?? "?"} samples (${host ? CPU_SCOPE_WORDS[scope] : `${runsB} runs`}, idle excluded)`,
      ].filter(Boolean).join("  ·  ")
    ),
    scope === "host" ? renderLifecycleBlock([[sideWord("base", true), s.hotspots.base.whole_host], [sideWord("head", true), s.hotspots.head.whole_host]]) : null
  );
}

/* ---------- Deep Dive 3: Forced Layout & Style Thrashing ---------- */
function renderForcedLayoutSection(s, aa) {
  const layB = s.hotspots?.base?.layout;
  const layH = s.hotspots?.head?.layout;
  if (!layB && !layH) return null;

  const runsB = layB?.runs || s.hotspots?.base?.runs || STROBE?.data?.plan?.runs_per_block || 1;
  const runsH = layH?.runs || s.hotspots?.head?.runs || STROBE?.data?.plan?.runs_per_block || 1;

  const flB = layB?.forced?.layout || {}, flH = layH?.forced?.layout || {};
  const fsB = layB?.forced?.style || {}, fsH = layH?.forced?.style || {};
  const llB = layB?.lifecycle?.layout || {}, llH = layH?.lifecycle?.layout || {};
  const lsB = layB?.lifecycle?.style || {}, lsH = layH?.lifecycle?.style || {};

  const zeroForced = !(flB.count > 0 || flH.count > 0 || fsB.count > 0 || fsH.count > 0);

  const rowMs = (r) => (finite(r.ms) ? r.ms : finite(r.weight) ? r.weight / 1000 : 0);
  const B = groupWeightedRows(layB?.rows || [], false, runsB, rowMs);
  const H = groupWeightedRows(layH?.rows || [], false, runsH, rowMs);

  const merged = [...new Set([...B.keys(), ...H.keys()])].map((k) => {
    const b = B.get(k), hd = H.get(k);
    const primary = hd || b;
    const bv = b ? b.val : 0;
    const hv = hd ? hd.val : 0;
    const evB = b?.raw?.samples ? b.raw.samples / runsB : 0;
    const evH = hd?.raw?.samples ? hd.raw.samples / runsH : 0;
    return { key: "lay:" + k, name: primary.name, where: primary.where, b, hd, bv, hv, evB, evH, delta: hv - bv };
  }).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta) || (b.bv + b.hv) - (a.bv + a.hv)).slice(0, 6);

  const maxAbs = Math.max(...merged.map((r) => Math.abs(r.delta)), 0.01);
  const scale = Math.max(maxAbs * 1.15, 0.5);
  const posPct = (v) => 50 + (v / scale) * 50;

  const statCell = (title, cB, cH, msB, msH, isForced) => {
    const dropped = isForced && !aa && finite(msB) && finite(msH) && msH < msB - 0.1;
    const rose = isForced && !aa && finite(msB) && finite(msH) && msH > msB + 0.1;
    return h("div", { class: "stat-cell" },
      h("span", { class: "stat-k" }, title),
      h("span", { class: "stat-v", style: dropped ? "color:var(--win-ink)" : rose ? "color:var(--loss-ink)" : "" },
        `${fmtBare(msB ?? 0, "ms")} → ${fmtVal(msH ?? 0, "ms")}/run`
      ),
