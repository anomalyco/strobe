      h("div", { class: "rig-hd" }, "Display, GPU & browser"),
      gpu.devices?.[0] ? h("div", {}, `${gpu.devices[0]}${gpu.compositing ? ` (${gpu.compositing})` : ""}`) : null,
      r.browser ? h("div", {}, `${r.browser}${win ? ` · ${win.width}×${win.height}` : ""}`) : null,
      finite(imp?.hz) ? h("div", {}, `${Math.round(imp.hz)} Hz refresh (${shortNum(imp.vs)} ms vsync)`) : null
    ),
    h("div", { class: "rig-col" },
      h("div", { class: "rig-hd" }, s ? "Experimental protocol" : "Recording details"),
      s
        ? s.isLeakRun
          ? h("div", {}, `${s.runs || "?"} sequential runs · ${s.censuses || "?"} post-GC censuses (S0 / S1 / S2)`)
          : s.kind === "blocks"
            ? h("div", {}, `${s.launches || "?"} blocks of one build, nothing compared · ${plan.runs_per_block || 5} measured runs/block`)
            : h("div", {}, `${s.pairs || "?"} AB/BA fresh-launch pairs · ${plan.runs_per_block || 5} measured runs/launch`)
        : null,
      s && finite(s.elapsed_ms) ? h("div", {}, `Series runtime: ${fmtDuration(s.elapsed_ms)} · Strobe ${env.strobe || ""}`) : null,
      s && finite(s.untimed?.stretches) ? h("div", {}, `Untimed (ctx.untimed): ${s.untimed.stretches} stretch${s.untimed.stretches === 1 ? "" : "es"} a run, ${fmtVal(s.untimed.ms, "ms")} of each run left out`) : null,
      baseVar?.subject ? h("div", { style: "color:var(--ink-3)" }, `${sideWord("base", true)}: ${baseVar.subject}`) : null,
      headVar?.subject && headVar.subject !== baseVar?.subject ? h("div", { style: "color:var(--ink-3)" }, `${sideWord("head", true)}: ${headVar.subject}`) : null,
      !s && finite(r.duration_ms) ? h("div", {}, `Duration: ${fmtDuration(r.duration_ms)}${r.probes ? ` · Probes: ${r.probes}` : ""}`) : null,
      !s && env.strobe ? h("div", {}, `Strobe ${env.strobe}`) : null,
      infoNotes.map((n) => h("div", { style: "color:var(--ink-4)" }, `Note: ${n.text}`))
    )
  );
}

/* ---------- Rerun Ledger Banner ---------- */
function ordinalOf(n) {
  const s = n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" })[n % 10] || "th";
  return `${n}${s}`;
}

function renderLedgerBanner(r) {
  const l = r.ledger;
  if (!l || !(l.total > 1)) return null;
  const list = [
    ...(l.earlier || []).map((e) => ({ ...e, when: "earlier" })),
    ...(l.later || []).map((e) => ({ ...e, when: "later" })),
  ];
  return h("section", { class: "ledger-banner" + (l.changed ? " warn" : ""), id: "ledger", "aria-label": "Rerun ledger" },
    h("div", { class: "ledger-hd" },
      h("b", {}, `${ordinalOf(l.attempt)} of ${l.total} experiments on these variants`),
      l.changed ? h("span", { class: "ledger-tag" }, "The setup changed between them: a verdict reached by changing the setup is not a verdict") : null
    ),
    list.map((e) => h("div", { class: "ledger-row" },
      h("span", { class: "mono" }, e.id),
      h("span", { class: "ledger-when" }, e.when),
      h("span", {}, e.summary || "no result"),
      e.changed?.length ? h("span", { class: "ledger-changed" }, e.changed.join(" · ")) : null
    ))
  );
}

/* ---------- Diff Flame (icicle of both sides' stacks) ---------- */
function renderDiffFlameSection(s, aa) {
  const t = s.diff_tree;
  const kinds = [["cpu", "CPU time"], ["alloc", "Allocations"]].filter(([k]) => (t?.[k]?.nodes?.length || 0) > 1);
  if (!kinds.length) return null;
  if (!kinds.some(([k]) => k === state.flameKind)) state.flameKind = kinds[0][0];
  const tree = t[state.flameKind];
  const isBytes = tree.unit === "bytes";
  const fmtV = (v) => (isBytes ? fmtBytes(v) : fmtVal(v, "ms"));
  const fmtD = (v) => (isBytes ? fmtSignedBytes(v) : fmtSigned(v, "ms"));
  const nodes = tree.nodes.map(([f, p, b, hd], i) => ({ i, f, p, b, h: hd, kids: [] }));
  for (const n of nodes) if (n.p >= 0 && nodes[n.p]) nodes[n.p].kids.push(n);
  const root = nodes[0];
  const zoom = nodes[state.flameZoom] || root;
  const total = Math.max(root.b, root.h, 1e-9);
  const label = (n) => (n.f < 0 ? "all" : tree.frames[n.f]?.[0] || "?");
  const file = (n) => (n.f < 0 ? "" : tree.frames[n.f]?.[1] || "");
  const mean = (n) => (n.b + n.h) / 2;

  // Colour: the share of the node that changed, faded where the change is small against the whole.
  const tone = (n) => {
    const d = n.h - n.b;
    const big = Math.max(n.b, n.h, 1e-12);
    const weight = Math.min(1, Math.abs(d) / (0.02 * total));
    const pct = Math.round(Math.min(1, Math.abs(d) / big) * weight * 70);
    if (pct < 3) return "var(--surface-subtle)";
    // A/A: both sides ran one build, so a difference is variation, never a win or a loss.
    const ink = aa ? "var(--ink-4)" : d > 0 ? "var(--loss)" : "var(--win)";
    return `color-mix(in srgb, ${ink} ${pct}%, var(--surface-subtle))`;
  };

  const rowH = 18;
  const cells = [];
  let depth = 0;
  // Deep stacks: rows below the cap are reached by zooming in.
  const maxDepth = 32;
  const place = (n, left, width, d) => {
    if (width < 0.15 || d > maxDepth) return;
    depth = Math.max(depth, d);
    cells.push({ n, left, width, d });
    let x = left;
    const m = mean(n) || 1e-12;
    for (const k of n.kids.slice().sort((a, b) => mean(b) - mean(a))) {
      const w = (width * mean(k)) / m;
      place(k, x, w, d + 1);
      x += w;
    }
  };
  place(zoom, 0, 100, 0);

  const flame = h("div", { class: "flame", style: `height:${(depth + 1) * rowH}px` },
    cells.map(({ n, left, width, d }) => {
      const el = h("div", {
        class: "fl-node",
        style: `left:${left}%;width:calc(${width}% - 1px);top:${d * rowH}px;background:${tone(n)}`,
        onclick: () => { state.flameZoom = n === zoom && n.p >= 0 ? n.p : n.i; render(); },
      }, width > 3 ? label(n) : "");
      el.addEventListener("pointerenter", (e) => showTip(e, label(n), [
        file(n) ? ["File", file(n)] : null,
        ["Base", `${fmtV(n.b)}${tree.per_run ? " / run" : ""}`],
        ["Head", `${fmtV(n.h)}${tree.per_run ? " / run" : ""}`],
        ["Δ", fmtD(n.h - n.b)],
        ["Share", `${((100 * mean(n)) / ((root.b + root.h) / 2 || 1)).toFixed(1)}% of all`],
      ].filter(Boolean)));
      el.addEventListener("pointermove", moveTip);
      el.addEventListener("pointerleave", hideTip);
      return el;
    })
  );

  const crumbs = [];
  for (let n = zoom; n; n = n.p >= 0 ? nodes[n.p] : null) crumbs.unshift(n);
  const toggle = kinds.length > 1
    ? h("div", { class: "seg", role: "group", "aria-label": "Diff flame of" },
        kinds.map(([k, lbl]) => h("button", { type: "button", "aria-pressed": String(state.flameKind === k), onclick: () => { state.flameKind = k; state.flameZoom = 0; render(); } }, lbl)))
    : null;
  const runs = tree.runs || [];
  return h("section", { class: "card-surface", id: "diff-flame" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Diff flame"),
        h("span", { class: "sec-sub" }, `${tree.what}${cpuScopeToggle(s.hotspots?.base, s.hotspots?.head) && cpuScopeOf(s.hotspots.base, s.hotspots.head) !== "runs" ? ` of the measured runs (not ${CPU_SCOPE_WORDS[cpuScopeOf(s.hotspots.base, s.hotspots.head)]})` : ""} · base and head call trees merged · ${tree.per_run ? `per run (${runs.join(" and ")} runs)` : tree.untimed ? "whole capture: these samples carry no times (launch and warmup included)" : "per recording (a run count is unknown)"} · click to zoom`)
      ),
      h("div", { class: "card-hd-right" }, toggle)
    ),
    aa ? h("div", { class: "attr-note" }, "A/A control: both sides ran the same build; colour here is launch-to-launch and sampling variation.") : null,
    crumbs.length > 1
      ? h("div", { class: "flame-crumbs" }, crumbs.map((n, i) => [i ? " › " : "", i === crumbs.length - 1 ? h("span", {}, label(n)) : h("button", { type: "button", onclick: () => { state.flameZoom = n.i; render(); } }, label(n))]))
      : null,
    flame,
    h("div", { class: "flame-legend" },
      aa
        ? h("span", {}, h("i", { style: "background:color-mix(in srgb, var(--ink-4) 60%, var(--surface-subtle))" }), "Differs between the two launches")
        : [
            h("span", {}, h("i", { style: "background:color-mix(in srgb, var(--loss) 60%, var(--surface-subtle))" }), "More in head"),
            h("span", {}, h("i", { style: "background:color-mix(in srgb, var(--win) 60%, var(--surface-subtle))" }), "Less in head"),
          ],
      h("span", {}, `Width: the mean of both sides · ${fmtV(root.b)} → ${fmtV(root.h)} in all (${fmtD(root.h - root.b)})`),
      h("span", {}, `Nodes under ${isBytes ? fmtBytes(tree.floor) : fmtVal(tree.floor, "ms")} left out (${tree.nodes.length} of ${tree.nodes_total}) · ${depth >= maxDepth ? `${maxDepth + 1} levels shown: zoom in for deeper frames` : `${depth + 1} levels`}`)
    )
  );
}

/* ---------- Native Memory Diff (what holds the memory, base → head) ---------- */
function renderNativeMemoryDiffSection(s, aa) {
  const rows = (s.memory_diff?.rows || []).filter((r) => finite(r.delta_bytes)).slice(0, 10);
  if (!rows.length) return null;
  const maxAbs = Math.max(...rows.map((r) => Math.abs(r.delta_bytes)), 1);
  const posPct = (v) => 50 + (v / (maxAbs * 1.12)) * 50;
  return h("section", { class: "card-surface", id: "native-memory" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "What holds the memory"),
        h("span", { class: "sec-sub" }, "Last reading of each attribution launch · by part · descriptive, not hypothesis-tested")
      )
    ),
    h("div", { class: "attr-table" },
      h("div", { class: "attr-row hd" },
        h("span", {}, "Part"),
        h("span", { class: "col-ba" }, "Base → Head"),
        h("span", { style: "text-align:center" }, "← Less in head · More in head →"),
        h("span", { style: "text-align:right" }, "Δ")
      ),
      rows.map((r) => {
        const d = r.delta_bytes;
        const left = Math.min(posPct(0), posPct(d));
        const width = Math.max(0.8, Math.abs(posPct(d) - posPct(0)));
        return h("div", { class: "attr-row" },
          h("span", { class: "fn-name" }, r.layer),
          h("span", { class: "mono col-ba", style: "color:var(--ink-3);font-size:11.5px" }, `${fmtBytes(r.base_bytes)} → ${fmtBytes(r.head_bytes)}`),
          h("div", { class: "div-track" },
            h("i", { class: "div-zero" }),
            h("i", { class: `div-bar ${d < 0 ? (aa ? "saved-aa" : "saved") : "added"}`, style: `left:${left}%;width:${width}%` })
          ),
          h("span", { class: "mono", style: "text-align:right" }, fmtSignedBytes(d))
        );
      })
    )
  );
}

/* ---------- Plan vs Actual (pairs, series time, block steps) ---------- */
const STEP_TONES = { launch: "var(--ph-script)", attach: "var(--ph-style)", checks: "var(--ph-style)", setup: "var(--ph-style)", warmup: "var(--ph-layout)", runs: "var(--head-tone)" };

function renderPlanVsActual(r, s) {
  const est = (r.plan?.estimate?.series || []).find((x) => x.label === s.label);
  if (!est || !finite(s.pairs)) return null;
  const looks = (r.plan?.looks || []).filter(finite);
  const maxPairs = Math.max(...looks, est.pairs || 0, s.pairs || 0, 1);
  const at = (p) => `${(100 * p) / maxPairs}%`;
  const steps = (s.steps || []).filter((x) => Array.isArray(x) && finite(x[1]));
  const block = steps.reduce((a, [, ms]) => a + ms, 0);
  const maxBlock = Math.max(block, est.block_ms || 0, 1);
  const maxTime = Math.max(est.ms || 0, s.elapsed_ms || 0, 1);
  const bar = (ms, max, cls, segs) => h("div", { class: `plan-bar ${cls}`, style: `width:${Math.max(1, (100 * ms) / max)}%` }, segs || null);
  return h("section", { class: "card-surface", id: "plan" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Plan vs actual"),
        h("span", { class: "sec-sub" }, `What bench planned before the run (${est.expect || "no expected outcome"}) and what this series took`)
      )
    ),
    h("div", { class: "plan-row" },
      h("span", { class: "plan-k" }, "Pairs"),
      h("div", { class: "plan-track" },
        h("i", { class: "plan-line" }),
        looks.map((l) => h("i", { class: "plan-tick", style: `left:${at(l)}` }, h("span", {}, String(l)))),
        h("i", { class: "plan-mark actual", style: `left:${at(s.pairs)}`, title: `Ran: ${s.pairs} pairs` }),
        finite(est.pairs) ? h("i", { class: "plan-mark planned", style: `left:${at(est.pairs)}`, title: `Planned: ${est.pairs} pairs` }) : null
      ),
      h("span", { class: "plan-v" }, `planned ${est.pairs ?? "?"}${finite(est.pairs_needed) ? ` (~${est.pairs_needed} needed)` : ""} · ran ${s.pairs}`)
    ),
    h("div", { class: "plan-row" },
      h("span", { class: "plan-k" }, "Series time"),
      h("div", { class: "plan-bars" },
        bar(est.ms || 0, maxTime, "planned"),
        bar(s.elapsed_ms || 0, maxTime, "", h("i", { class: "plan-seg", style: "width:100%;background:var(--accent)" }))
      ),
      h("span", { class: "plan-v" }, `planned ${fmtDuration(est.ms)} · took ${fmtDuration(s.elapsed_ms)}`)
    ),
    steps.length
      ? h("div", { class: "plan-row" },
          h("span", { class: "plan-k" }, "Per block"),
          h("div", { class: "plan-bars" },
            bar(est.block_ms || 0, maxBlock, "planned"),
            bar(block, maxBlock, "", steps.map(([name, ms]) => h("i", { class: "plan-seg", style: `width:${(100 * ms) / (block || 1)}%;background:${STEP_TONES[name] || "var(--ink-4)"}`, title: `${name}: ${fmtDuration(ms)}` })))
          ),
          h("span", { class: "plan-v" }, `planned ${fmtDuration(est.block_ms)} (${est.block_source || "?"}) · took ${fmtDuration(block)}`)
        )
      : null,
    h("div", { class: "plan-legend" },
      h("span", {}, h("i", { style: "box-shadow: inset 0 0 0 1px var(--border-strong);background:var(--surface-subtle)" }), "Planned"),
      steps.map(([name]) => h("span", {}, h("i", { style: `background:${STEP_TONES[name] || "var(--ink-4)"}` }), name))
    )
  );
}

/* ---------- Single-Sided Attribution Panels (`strobe report recording <rec_id>`) ---------- */
function renderSingleMainThreadPhases(v, perturbed) {
  const sc = v["main.script"], st = v["main.style"], ly = v["main.layout"], wk = v["main.work"];
  if (!finite(sc) && !finite(st) && !finite(ly)) return null;
  const sScript = finite(sc) ? sc : 0;
  const sStyle = finite(st) ? st : 0;
  const sLayout = finite(ly) ? ly : 0;
  const sum = sScript + sStyle + sLayout;
  const tot = finite(wk) ? Math.max(wk, sum) : sum;
  const sOther = Math.max(0, tot - sum);
  if (!(tot > 0)) return null;

  const items = [
    finite(sc) ? ["JavaScript", "ph-script", sScript, null] : null,
    finite(st) ? ["Style recalc", "ph-style", sStyle, finite(v["style.count"]) ? `${fmtVal(v["style.count"], "count")} passes` : null] : null,
    finite(ly) ? ["Layout", "ph-layout", sLayout, finite(v["layout.count"]) ? `${fmtVal(v["layout.count"], "count")} passes` : null] : null,
    sOther >= 0.5 ? ["Other tasks (paint / parse / IPC)", "ph-other", sOther, null] : null,
  ].filter(Boolean);

  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Where main-thread work went"),
        h("span", { class: "sec-sub" }, `${fmtVal(tot, "ms")} total main-thread task work${perturbed ? " · perturbed by attribution profilers" : ""}`)
      )
    ),
    perturbed
      ? h("div", { class: "perturbed-note", style: "border-top:0;border-bottom:1px solid var(--hairline)" },
          h("b", {}, "Perturbed timing: "),
          "Profilers ran during this recording, so main-thread phase durations reflect the profiled target rather than unprofiled speed."
        )
      : null,
    h("div", { class: "card-bd" },
      h("div", { class: "phase-bars", style: perturbed ? "opacity:0.75" : "" },
        h("div", { class: "phase-bar-row" },
          h("span", { class: "missed-lbl" }, "Work"),
          h("div", { class: "phase-track" },
            sScript > 0 ? h("i", { class: "phase-seg ph-script", style: `width:${(sScript / tot) * 100}%` }) : null,
            sStyle > 0 ? h("i", { class: "phase-seg ph-style", style: `width:${(sStyle / tot) * 100}%` }) : null,
            sLayout > 0 ? h("i", { class: "phase-seg ph-layout", style: `width:${(sLayout / tot) * 100}%` }) : null,
            sOther > 0 ? h("i", { class: "phase-seg ph-other", style: `width:${(sOther / tot) * 100}%` }) : null
          ),
          h("span", { class: "mono", style: `text-align:right;font-size:12px;${perturbed ? "color:var(--ink-3)" : ""}` }, fmtVal(tot, "ms"))
        )
      ),
      h("div", { class: "phase-table" },
        items.map(([name, cls, ms, note]) => h("div", { class: "phase-trow", style: "grid-template-columns:minmax(140px,1.4fr) minmax(80px,1fr) 84px 68px" },
          h("span", { style: "font-weight:500;display:flex;align-items:center" }, h("i", { class: `ph-dot ${cls}` }), name),
          h("span", { class: "mono", style: "color:var(--ink-3);font-size:11.5px" }, note || ""),
          h("span", { class: "mono", style: `text-align:right;font-weight:${perturbed ? 400 : 500};${perturbed ? "color:var(--ink-3)" : ""}` }, fmtVal(ms, "ms")),
          h("span", { class: "mono ph-ci-col", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, `${Math.round((ms / tot) * 100)}%`)
        ))
      )
    )
  );
}

function renderSingleCpuHotspots(side) {
  const scopeToggle = cpuScopeToggle(side);
  const scope = scopeToggle ? cpuScopeOf(side) : "runs";
  const host = scope !== "runs";
  const att = host ? cpuScoped(side, scope) : side;
  if (!att?.rows?.length) return scopeToggle ? cpuEmptySection(scopeToggle, scope) : null;
  const canFiles = !!att.files?.length;
  const byFile = state.whyBy === "file" && canFiles;
  const runs = att.runs || 1;
  const perRun = runs > 1;
  const list = byFile ? att.files : att.rows;
  const rowMs = (r) => (finite(r.self_ms) ? r.self_ms : finite(r.weight) ? r.weight / 1000 : 0);
  const isSys = (n) => /^\((idle|program|garbage collector|root)\)$/.test(n);

  // Self time only: a row that only calls (self 0, listed by its total) is left out.
  const activeRows = list.filter((r) => !isSys(r.name) && (r.weight ?? r.self_ms ?? 0) > 0).slice(0, 8);
  if (!activeRows.length) return scopeToggle ? cpuEmptySection(scopeToggle, scope) : null;
  const maxMs = Math.max(...activeRows.map((r) => rowMs(r) / runs), 0.1);
  const activeTotalMs = list.filter((r) => r.name !== "(idle)").reduce((s, r) => s + rowMs(r) / runs, 0) || 1;

  const mappedPct = att.mapped_samples ? " · source-mapped" : "";
  const sysMap = new Map(att.rows.map((x) => [x.name, x]));
  const prog = sysMap.get("(program)"), gc = sysMap.get("(garbage collector)");

  const toggle = canFiles
    ? h("div", { class: "seg" },
        [["fn", "By function"], ["file", "By file"]].map(([val, lbl]) =>
          h("button", { type: "button", "aria-pressed": String(state.whyBy === val), onclick: () => { state.whyBy = val; render(); } }, lbl)
        )
      )
    : null;

  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "CPU self-time hotspots"),
        h("span", { class: "sec-sub" }, `Sampled JS self-time${host ? ` · ${att.label}, per recording` : perRun ? ` (${runs} runs)` : ""}${mappedPct} · click rows for stacks & full paths`)
      ),
      h("div", { class: "card-hd-right" }, scopeToggle, toggle)
    ),
    h("div", { class: "attr-table" },
      h("div", { class: "single-row hd" },
        h("span", {}, byFile ? "File / script" : "Function & caller"),
        h("span", {}, "Self-time share"),
        h("span", { style: "text-align:right" }, perRun ? "Self / run" : "Self time"),
        h("span", { class: "col-share", style: "text-align:right" }, "Active %")
      ),
      activeRows.flatMap((r, idx) => {
        const ms = rowMs(r) / runs;
        const pctBar = Math.min(100, Math.max(1, (ms / maxMs) * 100));
        const activeShare = Math.min(100, (ms / activeTotalMs) * 100);
        const rowKey = `scpu:${idx}:${r.name}`;
        const rawH = byFile ? { name: r.name, where: r.name, weight: r.weight, stacks: r.stacks || [] } : r;
        const canExpand = !!(rawH.stacks?.length || (rawH.where && rawH.where !== "(native)"));
        const isOpen = canExpand && state.openRows.has(rowKey);

        const isNativeLeaf = !byFile && (!r.where || /^\(native\)/.test(r.where));
        const caller = isNativeLeaf ? extractNativeCaller(r.stacks) : null;

        const rowEl = h("div", {
          class: "single-row" + (canExpand ? " clickable" : ""),
          title: cleanPath(r.where || r.name),
          onclick: canExpand ? () => {
            if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
            else state.openRows.add(rowKey);
            render();
          } : null,
        },
          h("div", { class: "fn-stack-cell" },
            h("div", { class: "fn-primary-line" },
              h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
              h("span", { class: "fn-name" }, byFile ? shortLocation(r.name) || r.name : r.name),
              !byFile ? h("span", { class: "fn-where" }, shortLocation(r.where)) : null
            ),
            caller
              ? h("div", { class: "fn-caller-hint" }, "← ", caller.fn ? h("b", {}, caller.fn) : null, caller.fn && caller.shortLoc ? " · " : "", caller.shortLoc)
              : null
          ),
          h("div", { class: "share-track" }, h("div", { class: "share-fill", style: `width:${pctBar}%` })),
          h("span", { class: "mono", style: "text-align:right;font-weight:600" }, fmtVal(ms, "ms")),
          h("span", { class: "mono col-share", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, `${activeShare >= 10 ? activeShare.toFixed(0) : activeShare.toFixed(1)}%`)
        );
        return isOpen ? [rowEl, renderStackDrawer(null, rawH)] : [rowEl];
      })
    ),
    h("div", { class: "attr-foot" },
      [
        prog ? `Runtime / VM: ${fmtVal(rowMs(prog) / runs, "ms")}` : null,
        gc ? `GC samples: ${fmtVal(rowMs(gc) / runs, "ms")}` : null,
        `${fmtCount(att.samples)} samples (idle excluded)`,
      ].filter(Boolean).join("  ·  ")
    ),
    scope === "host" ? renderLifecycleBlock([["", side.whole_host]]) : null
  );
}

function renderSingleForcedLayout(lay, defaultRuns) {
  if (!lay) return null;
  const runs = lay.runs || defaultRuns || 1;
  const perRun = runs > 1;
  const fl = lay.forced?.layout || {}, fs = lay.forced?.style || {};
  const ll = lay.lifecycle?.layout || {}, ls = lay.lifecycle?.style || {};
  const zeroForced = !(fl.count > 0 || fs.count > 0);
  const rows = (lay.rows || []).slice(0, 6);
  const rowMs = (r) => (finite(r.ms) ? r.ms : finite(r.weight) ? r.weight / 1000 : 0) / runs;
  const maxMs = Math.max(...rows.map(rowMs), 0.1);

  const cell = (title, obj, warn) => h("div", { class: "stat-cell" },
    h("span", { class: "stat-k" }, title),
    h("span", { class: "stat-v", style: warn && obj.count > 0 ? "color:var(--warn-ink)" : "" }, fmtVal(obj.ms_per_run ?? 0, "ms") + (perRun ? "/run" : "")),
    h("span", { class: "stat-sub" }, `${fmtCount(obj.count_per_run ?? 0)} events${perRun ? "/run" : ""}`)
  );

  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Forced synchronous layout & style"),
        h("span", { class: "sec-sub" }, "Mid-script geometry reads after DOM writes vs normal frame-lifecycle rendering")
      )
    ),
    h("div", { class: "stat-strip" },
      cell("Forced layout (mid-script)", fl, true),
      cell("Forced style (mid-script)", fs, true),
      cell("Frame-lifecycle layout", ll, false),
      cell("Frame-lifecycle style", ls, false)
    ),
    zeroForced
      ? h("div", { class: "attr-foot", style: "border-top:0" }, "Clean: zero synchronous forced layouts or style recalculations detected.")
      : rows.length
        ? h("div", { class: "attr-table" },
            h("div", { class: "single-row hd" },
              h("span", {}, "JavaScript call site forcing layout / style"),
              h("span", {}, "Forced time share"),
              h("span", { style: "text-align:right" }, perRun ? "Forced / run" : "Forced time"),
              h("span", { class: "col-share", style: "text-align:right" }, "Events")
            ),
            rows.flatMap((r, idx) => {
              const ms = rowMs(r);
              const pctBar = Math.min(100, Math.max(1, (ms / maxMs) * 100));
              const evs = (r.samples || 0) / runs;
              const rowKey = `slay:${idx}:${r.name}`;
              const canExpand = !!(r.stacks?.length || (r.where && r.where !== "(native)"));
              const isOpen = canExpand && state.openRows.has(rowKey);

              const rowEl = h("div", {
                class: "single-row" + (canExpand ? " clickable" : ""),
                title: cleanPath(r.where || r.name),
                onclick: canExpand ? () => {
                  if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
                  else state.openRows.add(rowKey);
                  render();
                } : null,
              },
                h("div", { class: "fn-stack-cell" },
                  h("div", { class: "fn-primary-line" },
                    h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                    h("span", { class: "fn-name" }, r.name),
                    h("span", { class: "fn-where" }, shortLocation(r.where))
                  )
                ),
                h("div", { class: "share-track" }, h("div", { class: "share-fill warn", style: `width:${pctBar}%` })),
                h("span", { class: "mono", style: "text-align:right;font-weight:600;color:var(--warn-ink)" }, fmtVal(ms, "ms")),
                h("span", { class: "mono col-share", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, fmtCount(evs))
              );
              return isOpen ? [rowEl, renderStackDrawer(null, r)] : [rowEl];
            })
          )
        : null
  );
}

function renderSingleAllocGc(att) {
  const al = att?.alloc;
  const gc = att?.gc?.values;
  if (!al && !gc) return null;
  const runs = att?.runs || 1;
  const perRun = runs > 1;
  const suffix = perRun ? " / run" : "";

  const canFiles = !!(al?.files?.length || al?.rows?.length);
  const byFile = state.allocBy === "file";
  const rawList = byFile
    ? (al?.files?.length ? al.files : (al?.rows || []).map((r) => ({ ...r, name: !r.where || r.where === "(native)" ? r.name : cleanPath(r.where).replace(/:\d+(?::\d+)?$/, "") })))
    : (al?.rows || []);
  const rows = rawList.filter((r) => !/^\((root|idle|program)\)$/.test(r.name)).slice(0, 6);
  const maxBytes = Math.max(...rows.map((r) => (r.weight || 0) / runs), 1024);

  const toggle = canFiles && rows.length
    ? h("div", { class: "seg" },
        [["fn", "By function"], ["file", "By file"]].map(([val, lbl]) =>
          h("button", { type: "button", "aria-pressed": String(state.allocBy === val), onclick: () => { state.allocBy = val; render(); } }, lbl)
        )
      )
    : null;

  const cells = [
    finite(al?.total)
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, `Sampled allocations${suffix}`),
          h("span", { class: "stat-v" }, fmtBytes(al.total / runs)),
          h("span", { class: "stat-sub" }, `${fmtCount(al.samples)} sampled sites (incl. ephemeral)`)
        )
      : null,
    gc
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, `Main-thread GC${suffix}`),
          h("span", { class: "stat-v" }, fmtVal(gc.main_ms_per_run, "ms")),
          h("span", { class: "stat-sub" }, "Pauses & incremental marking")
        )
      : null,
    gc
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, `Background GC${suffix}`),
          h("span", { class: "stat-v" }, fmtVal(gc.helper_ms_per_run, "ms")),
          h("span", { class: "stat-sub" }, "Concurrent worker threads")
        )
      : null,
    gc
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, `Collections & freed${suffix}`),
          h("span", { class: "stat-v" }, `${fmtCount(gc.minor_per_run)} minor · ${fmtCount(gc.major_per_run)} major`),
          h("span", { class: "stat-sub" }, `Freed: ${fmtBytes(gc.freed_bytes_per_run)}`)
        )
      : null,
  ].filter(Boolean);

  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, al ? "Memory allocations & garbage collection" : "Garbage collection"),
        h("span", { class: "sec-sub" }, al ? `Heap sampled every ${Math.round((al?.interval_bytes || 32768) / 1024)} KB` : "Measured from trace GC phases")
      ),
      h("div", { class: "card-hd-right" }, toggle)
    ),
    cells.length ? h("div", { class: "stat-strip" }, cells) : null,
    rows.length
      ? h("div", { class: "attr-table" },
          h("div", { class: "single-row hd" },
            h("span", {}, byFile ? "File / script" : "Allocating function"),
            h("span", {}, "Allocation share"),
            h("span", { style: "text-align:right" }, perRun ? "Bytes / run" : "Allocated"),
            h("span", { class: "col-share", style: "text-align:right" }, "Share")
          ),
          rows.flatMap((r, idx) => {
            const bytes = (r.weight || 0) / runs;
            const pctBar = Math.min(100, Math.max(1, (bytes / maxBytes) * 100));
            const sharePct = finite(r.share) ? r.share * 100 : (al?.total > 0 ? ((r.weight || 0) / al.total) * 100 : 0);
            const rowKey = `salc:${idx}:${r.name}`;
            const rawH = byFile ? { name: r.name, where: r.name, weight: r.weight, stacks: r.stacks || [] } : r;
            const canExpand = !!(rawH.stacks?.length || (rawH.where && rawH.where !== "(native)"));
            const isOpen = canExpand && state.openRows.has(rowKey);

            const rowEl = h("div", {
              class: "single-row" + (canExpand ? " clickable" : ""),
              title: cleanPath(r.where || r.name),
              onclick: canExpand ? () => {
                if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
                else state.openRows.add(rowKey);
                render();
              } : null,
            },
              h("div", { class: "fn-stack-cell" },
                h("div", { class: "fn-primary-line" },
                  h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                  h("span", { class: "fn-name" }, byFile ? shortLocation(r.name) || r.name : r.name),
                  !byFile ? h("span", { class: "fn-where" }, shortLocation(r.where)) : null
                )
              ),
              h("div", { class: "share-track" }, h("div", { class: "share-fill", style: `width:${pctBar}%` })),
              h("span", { class: "mono", style: "text-align:right;font-weight:600" }, fmtBytes(bytes)),
              h("span", { class: "mono col-share", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, `${sharePct >= 10 ? sharePct.toFixed(0) : sharePct.toFixed(1)}%`)
            );
            return isOpen ? [rowEl, renderStackDrawer(null, rawH)] : [rowEl];
          })
        )
      : null
  );
}

/* ---------- Memory Leak-Hunt Recording View (`strobe record --probes memory`) ---------- */
function pickLeadSuspectClass(classes) {
  if (!classes?.length) return null;
  const userCls = classes.find((c) => c.class && !/^\((system|array|object shape|compiled code|string|number|sliced string|concatenated string)\)$/.test(c.class) && !/^system\s*\//.test(c.class) && c.class !== "Array" && c.class !== "Object");
  return userCls || classes[0];
}

function renderMemoryRecording(m) {
  const v = m.values || {};
  const g = (k) => (finite(v[k]) ? v[k] : NaN);
  const census = Array.isArray(m.census) ? m.census : [];
  const leaks = m.leaks && Array.isArray(m.leaks.classes) ? m.leaks : null;
  const leakTotals = m.leaks || {};
  const heap = m.heap || null;
  document.title = `strobe · ${m.id || "memory recording"}`;

  const validState = m.valid === true
    ? ["win", "Valid recording"]
    : m.valid === false
      ? ["loss", "Invalid recording"]
      : ["warn", "Validity unverified"];

  const createdStr = m.created
    ? new Date(m.created).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : null;

  const topbar = h("header", { class: "topbar" },
    h("div", { class: "brand-cluster" },
      h("span", { class: "wordmark" }, "strobe"),
      m.id ? [h("span", { class: "sep" }, "/"), h("span", { class: "mono meta-suite" }, m.id)] : null,
      createdStr ? [h("span", { class: "sep" }, "·"), h("span", { class: "meta-dim" }, createdStr)] : null
    ),
    h("div", { class: "top-actions" },
      h("span", { class: "ref-pill" }, "probes: memory"),
      h("span", { class: `status-pill ${validState[0]}` }, validState[1])
    )
  );

  // Measured facts only (Rule 1: strobe defines no statistical verdict on a 3-snapshot recording)
  const c0 = census[0], c2 = census[census.length - 1];
  const spanMs = c0 && c2 && c2.at_ms > c0.at_ms ? c2.at_ms - c0.at_ms : (m.duration_ms || NaN);
  const heapStartBytes = finite(c0?.js_heap_bytes) ? c0.js_heap_bytes : NaN;
  const heapEndBytes = finite(c2?.js_heap_bytes) ? c2.js_heap_bytes : (finite(g("js.heap.used")) ? g("js.heap.used") * 1048576 : NaN);
  const domStart = finite(c0?.dom_nodes) ? c0.dom_nodes : NaN;
  const domEnd = finite(c2?.dom_nodes) ? c2.dom_nodes : g("dom.nodes");

  const heapGrowth = g("js.heap.growth");
  const domGrowth = g("dom.nodes.growth");
  const suspectRetBytes = finite(leakTotals.retained_size)
    ? leakTotals.retained_size
    : finite(g("leak.suspects.retained")) ? g("leak.suspects.retained") * 1048576 : NaN;
  const suspectCount = leakTotals.count;
  const detCount = heap?.detached?.count || 0;
  const leadSuspect = pickLeadSuspectClass(leaks?.classes);
  const leadPath = leadSuspect?.largest?.path ? compactRetainerPath(leadSuspect.largest.path) : null;

  const fmtSignedRate = (val, unit) => {
    if (!finite(val)) return "—";
    const sign = val > 0.05 ? "+" : val < -0.05 ? "−" : "";
    const abs = Math.abs(val);
    if (unit === "MB/min") {
      return abs >= 1
        ? `${sign}${abs >= 10 ? abs.toFixed(1) : abs.toFixed(2)} MB/min`
        : `${sign}${Math.round(abs * 1024)} KB/min`;
    }
    return `${sign}${abs >= 10 ? Math.round(abs).toLocaleString("en-US") : abs.toFixed(1)}/min`;
  };

  const snapCount = census.length || 3;
  const pillText = `Memory recording · ${snapCount} snapshots`;

  let headline;
  if (leadSuspect && leadSuspect.count > 0) {
    headline = `${fmtCount(leadSuspect.count)} ${leadSuspect.class} ${leadSuspect.count === 1 ? "object" : "objects"} from the first half ${leadSuspect.count === 1 ? "was" : "were"} still alive at the end`;
  } else if (finite(suspectCount) && suspectCount > 0) {
    headline = `${fmtCount(suspectCount)} ${suspectCount === 1 ? "object" : "objects"} (${fmtBytes(suspectRetBytes)}) from the first half remained alive at the end`;
  } else if (finite(suspectCount) && suspectCount === 0) {
    headline = "No objects allocated in the first half were still alive at the end";
  } else if (finite(heapStartBytes) && finite(heapEndBytes)) {
    headline = `JS heap after GC: ${fmtBytes(heapStartBytes)} → ${fmtBytes(heapEndBytes)} (${fmtSignedRate(heapGrowth, "MB/min")})`;
  } else {
    headline = m.target || m.id || "Memory recording";
  }

  // Plain-English factual summary for an entry-level engineer
  const proseParts = [];
  if (finite(heapStartBytes) && finite(heapEndBytes)) {
    proseParts.push(
      "JS heap after GC: ",
      h("strong", {}, `${fmtBytes(heapStartBytes)} → ${fmtBytes(heapEndBytes)}`),
      finite(heapGrowth) ? ` (${fmtSignedRate(heapGrowth, "MB/min")})` : "",
      finite(domStart) && finite(domEnd)
        ? [" · DOM nodes: ", h("strong", {}, `${fmtCount(domStart)} → ${fmtCount(domEnd)}`), finite(domGrowth) ? ` (${fmtSignedRate(domGrowth, "count/min")})` : ""]
        : "",
      finite(spanMs) ? ` over ${fmtDuration(spanMs)}. ` : ". "
    );
  }
  if (finite(suspectCount) && suspectCount > 0) {
    proseParts.push(
      "Across all classes, ",
      h("strong", {}, `${fmtCount(suspectCount)} objects`),
      " (",
      h("strong", {}, `${fmtBytes(suspectRetBytes)} retained`),
      ") allocated between S0 and S1 were still alive after garbage collection at S2",
      leadSuspect
        ? [
            ", led by ", h("strong", {}, leadSuspect.class),
            ` (${fmtBytes(leadSuspect.retained_size)} across ${fmtCount(leadSuspect.count)} instances)`,
            leadPath ? [" reachable via ", h("code", { class: "mono", style: "font-size:12.5px" }, leadPath), "."] : ".",
          ]
        : "."
    );
  } else if (finite(suspectCount) && suspectCount === 0) {
    proseParts.push("Every object allocated between S0 (start) and S1 (middle) was collected before S2 (end).");
  }

  const recId = m.id || "<rec_id>";
  const durSec = Math.max(30, Math.round(((m.duration_ms || 6000) * 4) / 1000));
  const cmds = [
    ["Record over a longer window to observe how post-GC heap and surviving objects change over time:", `strobe record ${quoteArg(m.target || "<target>")} --probes memory --for ${durSec}s`],
    m.engine === "firefox" ? ["The first about:memory census, to compare with the last:", `strobe query ${recId} memory --at 0`] : ["Query surviving first-half objects from the CLI:", `strobe query ${recId} leaks`],
    heap ? ["Query full S2 heap snapshot:", `strobe query ${recId} heap`] : null,
  ].filter(Boolean);

  const groups = new Map();
  for (const k of Object.keys(v).sort()) {
    const area = k.split(".")[0];
    groups.set(area, [...(groups.get(area) || []), k]);
  }

  const shell = h("div", { class: "shell" });
  appendKids(shell, [
    topbar,
    // 1. Factual Memory Summary Hero
    h("section", { class: "card-surface" },
      h("div", { class: "hero-body" },
        h("div", { class: "hero-header" },
          h("div", { class: "eyebrow-row" },
            h("span", { class: "status-pill" }, pillText),
            h("span", { class: "eyebrow-meta" },
              m.target ? [h("span", { class: "mono", style: "text-transform:none;font-size:12px" }, m.target), " · "] : null,
              `${fmtDuration(spanMs)} · S0 → S1 → S2 post-GC snapshots`
            )
          ),
          h("h1", { class: "hero-headline" }, headline),
          h("p", { class: "hero-prose" }, proseParts)
        ),
        h("div", { class: "leak-metrics-grid" },
          h("div", { class: "leak-mcol" },
            h("span", { class: "leak-mk" }, "JS heap after GC"),
            h("span", { class: "leak-mv" }, fmtSignedRate(heapGrowth, "MB/min")),
            h("span", { class: "leak-msub" }, finite(heapStartBytes) && finite(heapEndBytes) ? `${fmtBytes(heapStartBytes)} → ${fmtBytes(heapEndBytes)}` : `End: ${fmtVal(g("js.heap.used"), "MB")}`)
          ),
          h("div", { class: "leak-mcol" },
            h("span", { class: "leak-mk" }, "DOM nodes"),
            h("span", { class: "leak-mv" }, fmtSignedRate(domGrowth, "count/min")),
            h("span", { class: "leak-msub" }, finite(domStart) && finite(domEnd) ? `${fmtCount(domStart)} → ${fmtCount(domEnd)} nodes` : `${fmtCount(domEnd)} nodes`)
          ),
          h("div", { class: "leak-mcol" },
            h("span", { class: "leak-mk" }, "S0→S1 alive at S2"),
            h("span", { class: "leak-mv" }, fmtBytes(suspectRetBytes)),
            h("span", { class: "leak-msub" }, finite(suspectCount) ? `${fmtCount(suspectCount)} surviving objects` : "Allocated in 1st half, alive at end")
          ),
          h("div", { class: "leak-mcol" },
            h("span", { class: "leak-mk" }, "Initial app RAM (S0)"),
            h("span", { class: "leak-mv" }, finite(c0?.private_bytes) ? fmtBytes(c0.private_bytes) : fmtVal(g("memory.app.private"), "MB")),
            h("span", { class: "leak-msub" }, detCount > 0 ? `${fmtCount(detCount)} detached DOM nodes at S2` : "0 detached DOM nodes at S2")
          )
        ),
        h("div", { class: "coarse-note" },
          h("b", {}, "Three-point caveat: "),
          "Three post-GC checkpoints (start S0, middle S1, end S2) are a coarse measure — lazy caches populated in the first half or V8 snapshot serialization overhead can shift short runs. A multi-run benchmark mode with a slope over many runs is planned."
        )
      )
    ),
    // 2. Leak Suspects Table
    leaks ? renderLeakSuspectsSection(leaks) : null,
    // 2b. Insights (if present)
    renderRecordingInsightsSection(m),
    // 3. Live Heap at S2
    heap ? renderLiveHeapSingleSection(heap, "Live heap at end (S2 post-GC snapshot)") : null,
    // 3b. Process & Layer Memory Breakdown
    m.memory ? renderProcessMemorySingleSection(m.memory, m.memory_layers) : null,
    // 4. Three-point Census Chart
    census.length >= 2 ? renderCensusSection(census) : null,
    // 5. Next steps & CLI queries
    h("section", { class: "card-surface" },
      h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Recommended next step"))),
      h("div", { class: "card-bd" },
        h("div", { class: "next-list" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
      )
    ),
    // 6. Raw recorded values disclosure
    groups.size
      ? h("details", { class: "disclosure", open: state.metricsOpen, ontoggle: (e) => { state.metricsOpen = e.currentTarget.open; } },
          h("summary", {},
            h("span", { class: "chev" }, makeChevSvg()),
            h("span", { class: "sec-title" }, `All ${Object.keys(v).length} recorded metric values`),
            h("span", { class: "sec-sub" }, "Summary rates and memory gauges")
          ),
          h("div", { class: "card-bd" },
            h("div", { class: "rec-kv-cols" },
              [...groups.entries()].map(([area, keys]) => h("div", { class: "rec-kv-grp" },
                h("div", { class: "rig-hd", style: "margin-bottom:4px" }, area),
                keys.map((k) => h("div", { class: "rec-kv-row" },
                  h("span", { class: "mono", style: "color:var(--ink-2)" }, k),
                  h("span", { class: "mono", style: "font-weight:500" }, fmtVal(v[k], unitOf(k)))
                ))
              ))
            )
          )
        )
      : null,
    renderRigFooter(m, null, { hz: NaN, vs: NaN }),
  ]);

  app.replaceChildren(shell);
}

function renderLeakSuspectsSection(leaks) {
  const classes = (leaks.classes || []).slice(0, 10);
  const maxRet = Math.max(...classes.map((c) => c.retained_size || 0), leaks.retained_size || 1);

  return h("section", { class: "card-surface", id: "leak-suspects" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "First-half allocations still alive at end (S0 → S1 → S2)"),
        h("span", { class: "sec-sub" },
          `${fmtCount(leaks.count)} surviving objects · ${fmtBytes(leaks.retained_size)} retained without overlap · click any row for full GC root path`
        )
      )
    ),
    !classes.length
      ? h("div", { class: "attr-foot", style: "border-top:0" }, "No objects allocated between S0 and S1 remained alive at S2.")
      : h("div", { class: "attr-table" },
          h("div", { class: "single-row hd" },
            h("span", {}, "Surviving class & what keeps it alive"),
            h("span", {}, "Retained share"),
            h("span", { style: "text-align:right" }, "Retained"),
            h("span", { class: "col-share", style: "text-align:right" }, "Alive at S2")
          ),
          classes.flatMap((c, idx) => {
            const path = c.largest?.path || null;
            const rowKey = `suspect:${idx}:${c.class}`;
            const canExpand = !!(path?.length || heapLocFull(c.location) || c.allocations?.length);
            const isOpen = canExpand && state.openRows.has(rowKey);
            const pct = Math.min(100, Math.max(1, ((c.retained_size || 0) / maxRet) * 100));

            const rowEl = h("div", {
              class: "single-row" + (canExpand ? " clickable" : ""),
              title: `${c.class} — ${fmtBytes(c.retained_size)} retained, ${fmtBytes(c.self_size)} self, ${fmtCount(c.count)} surviving objects`,
              onclick: canExpand ? () => {
                if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
                else state.openRows.add(rowKey);
                render();
              } : null,
            },
              h("div", { class: "fn-stack-cell" },
                h("div", { class: "fn-primary-line" },
                  h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                  h("span", { class: "fn-name" }, c.class),
                  c.location ? h("span", { class: "fn-where" }, heapLocShort(c.location)) : null
                ),
                path?.length
                  ? h("div", { class: "fn-caller-hint" }, `↳ ${compactRetainerPath(path)}`)
                  : h("div", { class: "fn-caller-hint" }, `Self: ${fmtBytes(c.self_size)}`)
              ),
              h("div", { class: "share-track" },
                h("div", { class: "share-fill", style: `width:${pct}%` })
              ),
              h("span", { class: "mono", style: "text-align:right;font-weight:600;color:var(--ink)" }, fmtBytes(c.retained_size)),
              h("span", { class: "mono col-share", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, fmtCount(c.count))
            );
            return isOpen ? [rowEl, renderRetainerDrawer(path, null, c.location, c.allocations)] : [rowEl];
          })
        )
  );
}

function renderCensusSection(census) {
  const hasHeap = census.some((c) => finite(c.js_heap_bytes));

    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Three-point post-GC census (S0 · S1 · S2)"),
        h("span", { class: "sec-sub" }, "Coarse 3-checkpoint trajectory sampled immediately after GC, before each heap snapshot")
      )
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "census-grid" },
        hasHeap
          ? h("div", { class: "plot-col" },
              h("div", { class: "plot-caption" },
                h("span", {}, "JS heap used after GC"),
                h("span", { class: "dim" }, "Dashed: S0 → S2 net slope")
              ),
              chartBox(148, (w) => drawCensusChart(w, census, (c) => c.js_heap_bytes, fmtBytes))
            )
          : null,
        hasDom
          ? h("div", { class: "plot-col" },
              h("div", { class: "plot-caption" },
                h("span", {}, "Live DOM nodes"),
                h("span", { class: "dim" }, "Document node count at S0, S1, S2")
              ),
              chartBox(148, (w) => drawCensusChart(w, census, (c) => c.dom_nodes, fmtCount))
            )
          : null
      ),
      h("div", { class: "coarse-note", style: "margin-top:14px" },
        h("b", {}, "Why S1 can spike & why OS RAM is S0-only: "),
        "Taking snapshot S0 inside Chromium temporarily allocates inspector metadata in the renderer process (so OS private RAM — ",
        finite(census[0]?.private_bytes) ? fmtBytes(census[0].private_bytes) + " at S0" : "recorded at S0",
        " — is intentionally omitted at S1/S2). See ",
        h("b", {}, "S0 → S1 objects still alive at S2"),
        " above for exact object-level persistence across snapshots."
      )
    )
  );
}

function drawCensusChart(w, census, getVal, fmtFn) {
  const H = 148;
  const m = { l: 58, r: 28, t: 24, b: 28 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const pts = census
    .map((c, idx) => ({ idx, label: `S${idx}`, sec: (c.at_ms || 0) / 1000, val: getVal(c) }))
    .filter((p) => finite(p.val));

  if (pts.length < 2) return svg;

  const t0 = pts[0].sec, t1 = Math.max(pts[pts.length - 1].sec, t0 + 0.1);
  const vals = pts.map((p) => p.val);
  let yMin = Math.min(0, ...vals);
  let yMax = Math.max(...vals);
  if (yMax - yMin <= 0) yMax = yMin + 1;
  const y = lin(yMin, yMax * 1.16, H - m.b, m.t);
  const yTicks = [yMin, (yMin + yMax) / 2, yMax];
  const labels = yTicks.map(fmtFn);
  m.l = axisLeft(labels, m.l, 10, 8);
  const x = lin(t0, t1, m.l, w - m.r);

  yTicks.forEach((tk, i) => {
    svg.append(
      S("line", { x1: m.l, y1: y(tk), x2: w - m.r, y2: y(tk), class: "gridline" }),
      S("text", { x: m.l - 8, y: y(tk) + 3.5, "text-anchor": "end", style: "font-size:10px" }, labels[i])
    );
  });
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: w - m.r, y2: H - m.b, class: "axisline" }));

  // Net S0 -> S2 slope reference line
  const first = pts[0], last = pts[pts.length - 1];
  svg.append(
    S("line", {
      x1: x(first.sec), y1: y(first.val),
      x2: x(last.sec), y2: y(last.val),
      stroke: "var(--ink-4)", "stroke-width": 1.25, "stroke-dasharray": "4 3",
    }),
    S("polyline", {
      points: pts.map((p) => `${x(p.sec)},${y(p.val)}`).join(" "),
      fill: "none", stroke: "var(--accent)", "stroke-width": 2,
    })
  );

  pts.forEach((p, i) => {
    const cx = x(p.sec), cy = y(p.val);
    const risingSteep = i === 0 && pts[1] && pts[1].val > p.val * 1.6;
    const anchor = risingSteep ? "middle" : i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle";
    svg.append(
      S("circle", { cx, cy, r: 4.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }),
      S("text", {
        x: cx, y: cy - 11, "text-anchor": anchor, class: "strong",
        style: "font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:4.5px;stroke-linejoin:round",
      }, fmtFn(p.val)),
      S("text", { x: cx, y: H - 7, "text-anchor": i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle", style: "font-size:10.5px" }, `${p.label} (${p.sec.toFixed(1)}s)`)
    );
  });

  return svg;
}

/* ---------- Single Recording View (`strobe report recording <rec_id>`) ---------- */
function renderRecording(m) {
  if (m.probes === "memory" || m.census || m.leaks) {
    return renderMemoryRecording(m);
  }
  const v = m.values || {};
  const g = (k) => (finite(v[k]) ? v[k] : NaN);
  const hz = g("display.hz");
  const vs = hz > 0 ? 1000 / hz : NaN;
  const att = m.attribution || null;
  document.title = `strobe · ${m.id || "recording"}`;

  const validState = m.valid === true
    ? ["win", "Valid recording"]
    : m.valid === false
      ? ["loss", "Invalid recording"]
      : ["warn", "Validity unverified"];

  const createdStr = m.created
    ? new Date(m.created).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : null;

  const topbar = h("header", { class: "topbar" },
    h("div", { class: "brand-cluster" },
      h("span", { class: "wordmark" }, "strobe"),
      m.id ? [h("span", { class: "sep" }, "/"), h("span", { class: "mono meta-suite" }, m.id)] : null,
      createdStr ? [h("span", { class: "sep" }, "·"), h("span", { class: "meta-dim" }, createdStr)] : null
    ),
    h("div", { class: "top-actions" },
      m.probes ? h("span", { class: "ref-pill" }, `probes: ${m.probes}`) : null,
      h("span", { class: `status-pill ${validState[0]}` }, validState[1])
    )
  );

  const perturbed = m.timing === "perturbed";
  const isTimingKey = (k) => /^(frames|main|cpu|interaction|scroll|run|layout|style)\./.test(k);

  const tiles = [
    finite(g("frames.n")) || finite(g("frames.presented.count"))
      ? ["Presented frames", fmtVal(finite(g("frames.n")) ? g("frames.n") : g("frames.presented.count"), "count"), finite(hz) ? `${Math.round(hz)} Hz display` : null, true]
      : null,
    finite(g("frames.dropped.pct"))
      ? ["Dropped refreshes", fmtVal(g("frames.dropped.pct"), "%"), finite(g("frames.dropped")) ? `${fmtVal(g("frames.dropped"), "count")} dropped` : null, true]
      : null,
    finite(g("frames.interval.p95"))
      ? ["Frame gap p95", fmtVal(g("frames.interval.p95"), "ms"), finite(vs) ? `${(g("frames.interval.p95") / vs).toFixed(1)}× vsync` : null, true]
      : null,
    finite(g("main.busy"))
      ? ["Main-thread busy", fmtVal(g("main.busy"), "%"), finite(g("main.tasks.long")) ? `${fmtVal(g("main.tasks.long"), "count")} long tasks` : null, true]
      : null,
    finite(g("main.work"))
      ? ["Main-thread work", fmtVal(g("main.work"), "ms"), finite(g("main.script")) ? `script ${fmtVal(g("main.script"), "ms")}` : null, true]
      : null,
    finite(g("js.heap.used"))
      ? ["JS heap used", fmtVal(g("js.heap.used"), "MB"), finite(g("memory.app.private")) ? `${fmtVal(g("memory.app.private"), "MB")} app RAM` : null, false]
      : finite(att?.heap?.self_size)
        ? ["Live JS heap", fmtBytes(att.heap.self_size), `${fmtCount(att.heap.nodes)} objects`, false]
        : null,
    finite(g("cpu.app.total"))
      ? ["Total app CPU", fmtVal(g("cpu.app.total"), "%"), `${(g("cpu.app.total") / 100).toFixed(2)} cores`, true]
      : null,
    finite(g("interaction.p95"))
      ? ["Input → screen p95", fmtVal(g("interaction.p95"), "ms"), finite(g("interaction.n.press")) ? `${g("interaction.n")} inputs, ${g("interaction.n.press")} timed from a press` : "discrete input", true]
      : null,
  ].filter(Boolean);

  const groups = new Map();
  for (const k of Object.keys(v).sort()) {
    const area = k.split(".")[0];
    groups.set(area, [...(groups.get(area) || []), k]);
  }

  const recId = m.id || "<rec_id>";
  const otherEngine = !!m.engine && m.engine !== "chromium";
  const cmds = [
    ["Open in Perfetto: one timeline with flame graphs, runs, threads and presents", `strobe open ${recId}`],
    ["Worst frames in this recording", `strobe query ${recId} frames`],
    ["Busy share by thread", `strobe query ${recId} threads`],
    /attribution|cpu/.test(String(m.probes || "")) ? ["CPU hotspots by package", `strobe query ${recId} hotspots --by package`] : null,
    /attribution/.test(String(m.probes || "")) ? ["Forced layout & style call sites", `strobe query ${recId} layout`] : null,
    /attribution/.test(String(m.probes || "")) && !otherEngine ? ["Sampled allocations & GC", `strobe query ${recId} alloc`] : null,
    /attribution/.test(String(m.probes || "")) && otherEngine ? ["GC per run", `strobe query ${recId} gc`] : null,
    otherEngine ? ["Memory by process, layer and allocator (about:memory)", `strobe query ${recId} memory`] : null,
    att?.heap ? ["Live heap snapshot & leaks", `strobe query ${recId} heap`] : null,
    m.http ? ["The HTTP probe beside the runs and its stalled cohorts", `strobe query ${recId} http`] : null,
    // A page in another engine than Chromium has no Chrome trace to query.
    otherEngine ? null : ["Raw Perfetto SQL query", `strobe query ${recId} sql "select name, count(*) n from slice group by 1 order by n desc limit 20"`],
  ].filter(Boolean);

  const insSec = renderRecordingInsightsSection(m);
  const phaseSec = renderSingleMainThreadPhases(v, perturbed);
  const cpuSec = renderSingleCpuHotspots(att);
  const laySec = renderSingleForcedLayout(att?.layout, att?.runs);
  const allocSec = renderSingleAllocGc(att);
  const heapSec = renderLiveHeapSingleSection(att?.heap || m.heap);
  const procMemSec = renderProcessMemorySingleSection(m.memory || att?.memory, m.memory_layers || att?.memory_layers);
  const httpSec = m.http ? renderHttpSection([{ label: "This recording", http: m.http, rec: m.id }]) : null;
  const hasDeepDive = !!(insSec || phaseSec || cpuSec || laySec || allocSec || heapSec || procMemSec || httpSec);

  const valuesBody = h("div", {},
    perturbed
      ? h("div", { class: "perturbed-note", style: "margin:-20px -24px 16px;border-top:0;border-bottom:1px solid var(--hairline)" },
          h("b", {}, "Perturbed timing: "),
          "Profilers ran during this recording; frame, main-thread, and CPU counters below describe the profiled target rather than unprofiled speed."
        )
      : null,
    h("div", { class: "rec-kv-cols" },
      [...groups.entries()].map(([area, keys]) => h("div", { class: "rec-kv-grp" },
        h("div", { class: "rig-hd", style: "margin-bottom:4px" }, area),
        keys.map((k) => {
          const tPert = perturbed && isTimingKey(k);
          return h("div", { class: "rec-kv-row" },
            h("span", { class: "mono", style: `color:${tPert ? "var(--ink-3)" : "var(--ink-2)"}` },
              k,
              tPert ? h("span", { class: "perturbed-tag" }, " · perturbed") : null
            ),
            h("span", { class: "mono", style: `font-weight:${tPert ? 400 : 500};color:${tPert ? "var(--ink-3)" : "var(--ink)"}` }, fmtVal(v[k], unitOf(k)))
          );
        })
      ))
    )
  );

  const valuesSection = !groups.size
    ? null
    : hasDeepDive
      ? h("details", { class: "disclosure", open: state.metricsOpen, ontoggle: (e) => { state.metricsOpen = e.currentTarget.open; } },
          h("summary", {},
            h("span", { class: "chev" }, makeChevSvg()),
            h("span", { class: "sec-title" }, `All ${Object.keys(v).length} recorded metric values`),
            h("span", { class: "sec-sub" }, perturbed ? "Timing counters marked perturbed (profilers attached)" : "Raw timing, memory, GPU, and frame counters")
          ),
          h("div", { class: "card-bd" }, valuesBody)
        )
      : h("section", { class: "card-surface" },
          h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Recorded values"))),
          h("div", { class: "card-bd" }, valuesBody)
        );

  const queriesSection = hasDeepDive
    ? h("details", { class: "disclosure", open: state.queriesOpen, ontoggle: (e) => { state.queriesOpen = e.currentTarget.open; } },
        h("summary", {},
          h("span", { class: "chev" }, makeChevSvg()),
          h("span", { class: "sec-title" }, `CLI & Perfetto SQL queries (${cmds.length})`),
          h("span", { class: "sec-sub" }, "Inspect this recording further from the terminal")
        ),
        h("div", { class: "card-bd" },
          h("div", { class: "next-list" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
        )
      )
    : h("section", { class: "card-surface" },
        h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Inspect trace further"))),
        h("div", { class: "card-bd" },
          h("div", { class: "next-list" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
        )
      );

  const shell = h("div", { class: "shell" });
  appendKids(shell, [
    topbar,
    h("section", { class: "card-surface" },
      h("div", { class: "hero-body" },
        h("div", { class: "hero-header" },
          h("div", { class: "eyebrow-row" },
            h("span", { class: "eyebrow-meta" }, [m.kind || "Recording", finite(m.duration_ms) ? fmtDuration(m.duration_ms) : null].filter(Boolean).join(" · "))
          ),
          h("h1", { class: "hero-headline", style: "font-size:26px;line-height:34px;overflow-wrap:anywhere" }, m.target || recId)
        )
      ),
      perturbed && tiles.some(([, , , isT]) => isT)
        ? h("div", { class: "perturbed-note" },
            h("b", {}, "Perturbed timing: "),
            "Attribution profilers ran during this recording, so frame, main-thread, and CPU numbers describe the profiled target rather than unprofiled speed."
          )
        : null,
      tiles.length
        ? h("div", { class: "rec-tiles" },
            tiles.map(([k, val, sub, isT]) => {
              const tPert = perturbed && isT;
              return h("div", { class: "rec-tile" },
                h("span", { class: "stat-k" },
                  k,
                  tPert ? h("span", { class: "perturbed-tag" }, " · perturbed") : null
                ),
                h("span", { class: "pil-val" + (tPert ? " perturbed" : "") }, val),
                sub ? h("span", { class: "stat-sub" }, sub) : null
              );
            })
          )
        : null
    ),
    renderVideoSection(m.video_player),
    hasDeepDive ? h("div", { class: "zone-divider" }, h("span", { class: "zone-divider-label" }, "Attribution & memory deep dive")) : null,
    insSec,
    phaseSec,
    cpuSec,
    laySec,
    allocSec,
    heapSec,
    procMemSec,
    httpSec,
    valuesSection,
    queriesSection,
    renderRigFooter(m, null, { hz, vs }),
  ]);

  app.replaceChildren(shell);
}

/* ---------- Whole host process by lifecycle part (script targets; shown with the Whole host scope) ---------- */
// Each part's wall time on strobe's clock and the JavaScript sampled in it (`whole_host.lifecycle`), and the
// modules the host evaluated (`whole_host.modules`). A share of wall time, never CPU.
function renderLifecycleBlock(sides) {
  const shown = sides.filter(([, w]) => w?.lifecycle?.length || w?.modules);
  if (!shown.length) return null;
  return shown.map(([name, w]) => {
    const rows = w.lifecycle || [];
    const maxWall = Math.max(...rows.map((r) => (finite(r.wall_ms) ? r.wall_ms : 0)), 1);
    const mod = w.modules;
    return h("div", { class: "life-block" },
      h("div", { class: "life-hd" }, `By lifecycle${name ? ` · ${name}` : ""} `,
        h("span", {}, "· each part's wall time on strobe's clock and the JavaScript sampled in it, as a share of wall time, not CPU")),
      rows.length
        ? h("div", {},
            h("div", { class: "life-row hd" },
              h("span", {}, "Part"), h("span", {}, "Wall time (bar), sampled (fill)"),
              h("span", { class: "mono" }, "Wall"), h("span", { class: "mono" }, "Sampled"), h("span", { class: "mono" }, "%")),
            rows.map((r) => {
              const wall = finite(r.wall_ms) ? r.wall_ms : null;
              const sampled = finite(r.sampled_ms) ? r.sampled_ms : 0;
              const pct = wall > 0 ? (100 * sampled) / wall : null;
              return h("div", {
                class: "life-row",
                title: wall === null ? "between the parts: strobe's clock-sync spins, its calls between runs; the exit" : `${r.spans || 0} stretch${r.spans === 1 ? "" : "es"}`,
              },
                h("span", {}, capFirst(r.label || r.part)),
                wall === null
                  ? h("span", { style: "color:var(--ink-4);font-size:11.5px" }, "strobe's clock-sync spins, its calls between runs; the exit")
                  : h("div", { class: "share-track", style: "background:none" },
                      h("div", { style: `height:100%;width:${Math.max(0.5, (100 * wall) / maxWall)}%;background:var(--surface-subtle);box-shadow:inset 0 0 0 1px var(--border);position:relative` },
                        h("div", { class: "share-fill", style: `width:${Math.min(100, pct || 0)}%` })
                      )
                    ),
                h("span", { class: "mono" }, wall === null ? "" : fmtVal(wall, "ms")),
                h("span", { class: "mono" }, fmtVal(sampled, "ms")),
                h("span", { class: "mono", style: "color:var(--ink-3)" }, pct === null ? "" : `${pct.toFixed(0)}%`)
              );
            })
          )
        : null,
      mod
        ? h("div", { class: "life-note", title: cleanPath(mod.max_file || "") },
            `${mod.count} modules evaluated, each its own stack ((module) at its root): ${fmtVal(mod.ms, "ms")} in all, the most ${fmtVal(mod.max_ms, "ms")} (${baseName(mod.max_file || "") || "?"}); By file sums them.`)
        : null
    );
  });
}

/* ---------- HTTP probe & stalled cohorts (`strobe query <rec|exp> http`) ---------- */
const httpConn = (c) => (c?.connection === "keep-alive" ? "kept connections" : "a new connection per probe");
// A quantile as strobe judged it (`states`, the block's refusals): its value, censored (it falls on a
// timeout) or unread (—: no probe that counts, an error, missed sends, the probe's CPU in a timed block).
const httpQ = (m, k) => {
  const st = m?.states?.[k];
  if (st === "censored") return "censored";
  if (st === "unread" || m?.unread) return "—";
  return finite(m?.[k]) ? fmtVal(m[k], "ms") : "—";
};

// A cohort's words as `query http` says them (`says`), or, from an older strobe, its held time alone.
function cohortSays(c) {
  if (c.says) return c.says;
  if (!finite(c.held_ms)) return "none of them was answered";
  return `the server answered none for ${c.held_past_timeout ? "at least " : ""}${fmtVal(c.held_ms, "ms")}`;
}

function renderCohortRow(c, timeoutMs) {
  const lat = c.latencies_ms || [];
  const answered = lat.filter(finite);
  const top = Math.max(...answered, c.timeouts > 0 && finite(timeoutMs) ? timeoutMs : 0, 1);
  const at = `${c.run || c.when || ""}${c.run && c.when && c.when !== "measured" ? ` (${c.when === "warmup" ? "not measured" : c.when})` : ""} +${(c.at_s || 0).toFixed(2)} s`;
  const spans = (c.waves || 1) > 1;
  return h("div", { class: "cohort-row" },
    h("span", { class: "cohort-at" }, at, h("br"), `${c.probes} probes`),
    h("div", { class: "cohort-bars", "aria-label": `latencies: ${lat.map((l) => (finite(l) ? l.toFixed(0) : "timeout")).join(", ")} ms` },
      lat.map((l) => finite(l)
        ? h("i", { style: `height:${Math.max(6, (100 * l) / top)}%`, title: `${l.toFixed(0)} ms` })
        : h("i", { class: "timeout", title: `timed out at ${timeoutMs} ms: its latency is past it, unknown` }))
    ),
    h("span", { class: `cohort-says${spans ? " spans" : ""}` }, capFirst(cohortSays(c)))
  );
}

// `entries`: [{ label, http }], `http` a recording's probe view (with cohorts) or a timed block's summary.
function renderHttpSection(entries) {
  const list = (entries || []).filter((e) => e?.http?.measured);
  if (!list.length) return null;
  const cfg = list.find((e) => e.http.config)?.http.config;
  const cfgLine = cfg
    ? `${cfg.method || "GET"} ${cfg.url} · every ${cfg.cadence_ms} ms · timeout ${cfg.timeout_ms} ms · ${httpConn(cfg)}${cfg.has_authorization && cfg.authorization_header ? ` · ${cfg.authorization_header} sent, never kept` : ""}`
    : "";
  const viewed = list.filter((e) => Array.isArray(e.http.cohorts));
  const anyCohort = viewed.some((e) => e.http.cohorts.length);
  return h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "HTTP probe & stalled cohorts"),
        h("span", { class: "sec-sub", style: "overflow-wrap:anywhere" }, cfgLine)
      ),
      h("div", { class: "card-hd-right" }, anyCohort ? h("span", { class: "status-pill warn" }, "Stalls held probes") : viewed.length ? h("span", { class: "status-pill win" }, "No stall") : null)
    ),
    h("div", { style: "padding:0 24px 12px;overflow-x:auto" },
      h("table", { class: "impl-table" },
        h("tr", {},
          ["Block", "p50", "p95", "max", "answered", "timeouts", "errors", "missed", "idle p50", "probe CPU"].map((t, i) => h("th", { style: i ? "text-align:right" : "" }, t))
        ),
        list.map((e) => {
          const m = e.http.measured;
          const cpu = finite(e.http.probe_cpu_pct) ? e.http.probe_cpu_pct : e.http.cpu_pct;
          return h("tr", { title: e.rec ? `strobe query ${e.rec} http` : "" },
            h("td", {}, e.label),
            h("td", { class: "num" }, httpQ(m, "p50")),
            h("td", { class: "num" }, httpQ(m, "p95")),
            h("td", { class: "num" }, httpQ(m, "max")),
            h("td", { class: "num" }, `${m.ok ?? "—"} of ${m.due ?? "—"}`),
            h("td", { class: "num", style: m.timeouts > 0 ? "color:var(--loss-ink)" : "" }, String(m.timeouts ?? "—")),
            h("td", { class: "num", style: m.errors > 0 ? "color:var(--loss-ink)" : "" }, String(m.errors ?? "—")),
            h("td", { class: "num", style: m.missed > 0 ? "color:var(--warn-ink)" : "" }, String(m.missed ?? "—")),
            h("td", { class: "num" }, finite(e.http.idle?.p50) ? fmtVal(e.http.idle.p50, "ms") : "—"),
            h("td", { class: "num" }, finite(cpu) ? `${cpu.toFixed(2)}% of a core` : "—")
          );
        })
      ),
      h("div", { class: "life-note" }, "A quantile shown censored falls on a timeout: its value is past the timeout, unknown, and refused; — is unread, refused as the block refuses it."),
      list.filter((e) => e.http.measured.unread_why).map((e) => h("div", { class: "life-note", style: "margin-top:2px" }, `${e.label}: latencies unread (${e.http.measured.unread_why})`))
    ),
    viewed.flatMap((e) => [
      h("div", { class: "http-sub" }, `Stalled cohorts · ${e.label} `,
        h("span", {}, `· probes in a row over ${fmtVal(e.http.stall_threshold_ms, "ms")} (5× the idle p95, at least 50 ms); a hatched bar timed out`)),
      e.http.cohorts.length
        ? e.http.cohorts.map((c) => renderCohortRow(c, e.http.config?.timeout_ms))
        : h("div", { class: "cohort-row" }, h("span", { class: "cohort-at" }, ""), h("span", {}, ""), h("span", { class: "cohort-says" }, `None: no two probes in a row over ${fmtVal(e.http.stall_threshold_ms, "ms")}`)),
      (e.http.cohorts_total || 0) > e.http.cohorts.length

// A series' probes (`s.http`): each probe block (its whole view where its recording was kept), then the
// check's and attribution blocks' recordings.
function seriesHttpEntries(s) {

/* ---------- bench --blocks: one build's blocks, their median and its interval, nothing compared ---------- */
// The median's interval over the blocks (order statistics): 95% from 6 blocks; fewer cover the median
// only 50, 75, 87.5 or 93.8% of the time (2 to 5 blocks), and are named a range with that coverage.
const blocks95 = (x) => finite(x?.confidence) && x.confidence >= 0.95 - 1e-9;
const coverageStr = (c) => `${+(100 * c).toFixed(1)}%`;
function blocksIntervalWords(x, n) {
  return blocks95(x) ? "95% interval" : `range over ${n} blocks (${finite(x?.confidence) ? coverageStr(x.confidence) : "unknown"} median coverage; 6 blocks needed for 95%)`;
}

function drawBlocksStrip(vals, p, u, n) {
  const xs = [...vals, p.lo, p.hi].filter(finite);
  if (!xs.length) return null;
  const min = Math.min(...xs), max = Math.max(...xs);
  const pad = (max - min) * 0.08 || Math.abs(max) * 0.05 || 1;
  const lo = min - pad, hi = max + pad;
  const x = (v) => `${(100 * (v - lo)) / (hi - lo)}%`;
  // Below 95% the band is drawn as an outline, and not at all from 2 blocks (50%: just their range).
  const band = finite(p.lo) && finite(p.hi) && (blocks95(p) || p.confidence > 0.5);
  return h("div", { class: "blk-strip" },
    h("i", { class: "blk-axis" }),
    band
      ? h("i", {
          class: "blk-band",
          style: `left:${x(p.lo)};width:calc(${x(p.hi)} - ${x(p.lo)})${blocks95(p) ? "" : ";background:none;border-style:dashed"}`,
          title: `${capFirst(blocksIntervalWords(p, n))}: ${fmtVal(p.lo, u)} … ${fmtVal(p.hi, u)}`,
        })
      : null,
    finite(p.median) ? h("i", { class: "blk-med", style: `left:${x(p.median)}`, title: `median ${fmtVal(p.median, u)}` }) : null,
    vals.map((v, i) => (finite(v) ? h("i", { class: "blk-dot", style: `left:${x(v)}`, title: `block ${i + 1}: ${fmtVal(v, u)}` }) : null)),
    h("span", { class: "blk-tick", style: `left:${x(min)}` }, fmtVal(min, u)),
    min !== max ? h("span", { class: "blk-tick", style: `left:${x(max)}` }, fmtVal(max, u)) : null
  );
}

// One metric over the blocks in words: its median and interval, one value, or why a block refused it.
function blocksText(x, n) {
  const u = x.unit || unitOf(x.metric);
  if (x.verdict) return x.verdict;
  if (x.refused) return `refused in ${x.refused_blocks} of ${n} blocks (${String(x.refused).replace(`: ${x.metric}: `, ": ")})`;
  const got = (x.values || []).filter(finite);
  if (finite(x.median)) {
    return `median ${fmtVal(x.median, u)}  [${fmtVal(x.lo, u)} … ${fmtVal(x.hi, u)}]${blocks95(x) ? "" : ` (range over ${got.length} blocks, ${finite(x.confidence) ? coverageStr(x.confidence) : "unknown"} median coverage)`}`;
  }
  if (got.length === 1) return `${fmtVal(got[0], u)} (1 block)`;
  return "no value (nothing in these blocks measured it)";
}

          ),

                  : [`One build measured in ${n} fresh blocks. The median's ${blocksIntervalWords(p, n)} is `, h("strong", {}, `${fmtVal(p.lo, u)} … ${fmtVal(p.hi, u)}`), `. Nothing was compared: no better, worse or same is claimed.`]

          ),

        )

          h("div", { class: "card-bd" },
