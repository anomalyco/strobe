      h("span", { class: "stat-sub" }, `${fmtVal(cB ?? 0, "count")} → ${fmtVal(cH ?? 0, "count")} events/run`)
    );
  };

  return h("section", { class: "card-surface", id: "forced-layout" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Forced synchronous layout & style"),
        h("span", { class: "sec-sub" }, "Mid-script geometry reads after DOM writes vs normal once-per-frame rendering")
      )
    ),
    h("div", { class: "stat-strip" },
      statCell("Forced layout (mid-script)", flB.count_per_run, flH.count_per_run, flB.ms_per_run, flH.ms_per_run, true),
      statCell("Forced style (mid-script)", fsB.count_per_run, fsH.count_per_run, fsB.ms_per_run, fsH.ms_per_run, true),
      statCell("Frame-lifecycle layout", llB.count_per_run, llH.count_per_run, llB.ms_per_run, llH.ms_per_run, false),
      statCell("Frame-lifecycle style", lsB.count_per_run, lsH.count_per_run, lsB.ms_per_run, lsH.ms_per_run, false)
    ),
    zeroForced
      ? h("div", { class: "attr-foot", style: "border-top:0" }, "Clean: zero synchronous forced layouts or style recalculations detected in either build.")
      : merged.length
        ? h("div", { class: "attr-table" },
            h("div", { class: "attr-row hd" },
              h("span", {}, "JavaScript call site forcing layout / style"),
              h("span", { class: "col-ba" }, "Base → Head / run"),
              h("span", { style: "text-align:center" }, "← Less forced time · More forced time →"),
              h("span", { style: "text-align:right" }, "Δ / run")
            ),
            merged.flatMap((x) => {
              const left = Math.min(posPct(0), posPct(x.delta));
              const width = Math.max(0.8, Math.abs(posPct(x.delta) - posPct(0)));
              const saved = x.delta <= 0;
              const barCls = saved ? (aa ? "saved-aa" : "saved") : (aa ? "added" : "added-warn");
              const canExpand = !!(x.b?.stacks?.length || x.hd?.stacks?.length || (x.where && x.where !== "(native)"));
              const isOpen = canExpand && state.openRows.has(x.key);

              const rowEl = h("div", {
                class: "attr-row" + (canExpand ? " clickable" : ""),
                title: cleanPath(x.where || x.name),
                onclick: canExpand ? () => {
                  if (state.openRows.has(x.key)) state.openRows.delete(x.key);
                  else state.openRows.add(x.key);
                  render();
                } : null,
              },
                h("div", { class: "fn-stack-cell" },
                  h("div", { class: "fn-primary-line" },
                    h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                    h("span", { class: "fn-name" }, x.name),
                    h("span", { class: "fn-where" }, shortLocation(x.where))
                  ),
                  h("div", { class: "fn-caller-hint" }, `${fmtVal(x.evB, "count")} → ${fmtVal(x.evH, "count")} forced events/run`)
                ),
                h("span", { class: "mono col-ba", style: "color:var(--ink-3);font-size:11.5px" }, `${shortNum(x.bv)} → ${fmtVal(x.hv, "ms")}`),
                h("div", { class: "div-track" },
                  h("i", { class: "div-zero" }),
                  h("i", { class: `div-bar ${barCls}`, style: `left:${left}%;width:${width}%` })
                ),
                h("span", { class: "mono", style: `text-align:right;color:${saved && x.delta < -0.2 && !aa ? "var(--win-ink)" : !saved && x.delta > 0.2 && !aa ? "var(--loss-ink)" : "var(--ink-2)"}` }, fmtSigned(x.delta, "ms"))
              );
              return isOpen ? [rowEl, renderStackDrawer(x.b, x.hd)] : [rowEl];
            })
          )
        : null
  );
}

/* ---------- Deep Dive 4: Memory Allocations & Garbage Collection ---------- */
function renderAllocGcSection(s, aa) {
  const hsB = s.hotspots?.base, hsH = s.hotspots?.head;
  const alB = hsB?.alloc, alH = hsH?.alloc;
  const gcB = hsB?.gc?.values, gcH = hsH?.gc?.values;
  if (!alB && !alH && !gcB && !gcH) return null;

  const runsB = hsB?.runs || STROBE?.data?.plan?.runs_per_block || 1;
  const runsH = hsH?.runs || STROBE?.data?.plan?.runs_per_block || 1;

  const totAllocB = finite(alB?.total) ? alB.total / runsB : NaN;
  const totAllocH = finite(alH?.total) ? alH.total / runsH : NaN;

  // Group allocation rows by function or by file (derived from `where` if `alloc.files` is absent)
  const byFile = state.allocBy === "file";
  const fileRowsOf = (al) => {
    if (al?.files?.length) return al.files;
    return (al?.rows || []).map((r) => ({
      ...r,
      name: !r.where || r.where === "(native)" ? r.name : cleanPath(r.where).replace(/:\d+(?::\d+)?$/, ""),
    }));
  };

  const listB = byFile ? fileRowsOf(alB) : (alB?.rows || []);
  const listH = byFile ? fileRowsOf(alH) : (alH?.rows || []);
  const B = groupWeightedRows(listB, byFile, runsB, (r) => r.weight || 0);
  const H = groupWeightedRows(listH, byFile, runsH, (r) => r.weight || 0);

  const merged = [...new Set([...B.keys(), ...H.keys()])].map((k) => {
    const b = B.get(k), hd = H.get(k);
    const primary = hd || b;
    if (/^\((root|idle|program)\)$/.test(primary.name)) return null;
    const bv = b ? b.val : 0;
    const hv = hd ? hd.val : 0;
    return { key: "alloc:" + k, name: primary.name, fullFile: primary.fullFile, where: primary.where, b, hd, bv, hv, delta: hv - bv };
  }).filter(Boolean).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta) || (b.bv + b.hv) - (a.bv + a.hv)).slice(0, 6);

  const maxAbs = Math.max(...merged.map((r) => Math.abs(r.delta)), 1024);
  const scale = Math.max(maxAbs * 1.15, 128 * 1024); // 128 KB/run floor prevents tiny sampling blips from filling width
  const posPct = (v) => 50 + (v / scale) * 50;

  const hasAllocRows = merged.length > 0;
  const toggle = hasAllocRows
    ? h("div", { class: "seg", role: "group", "aria-label": "Group allocations" },
        [["fn", "By function"], ["file", "By file"]].map(([val, lbl]) =>
          h("button", { type: "button", "aria-pressed": String(state.allocBy === val), onclick: () => { state.allocBy = val; render(); } }, lbl)
        )
      )
    : null;

  const cells = [
    finite(totAllocB) || finite(totAllocH)
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, "Sampled allocations / run"),
          h("span", { class: "stat-v" }, `${fmtBytes(totAllocB)} → ${fmtBytes(totAllocH)}`),
          h("span", { class: "stat-sub" }, `${fmtSignedBytes(totAllocH - totAllocB)} (incl. ephemeral objects)`)
        )
      : null,
    gcB || gcH
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, "Main-thread GC / run"),
          h("span", { class: "stat-v" }, `${fmtBare(gcB?.main_ms_per_run, "ms")} → ${fmtVal(gcH?.main_ms_per_run, "ms")}`),
          h("span", { class: "stat-sub" }, "Pauses & incremental marking")
        )
      : null,
    gcB || gcH
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, "Background GC / run"),
          h("span", { class: "stat-v" }, `${fmtBare(gcB?.helper_ms_per_run, "ms")} → ${fmtVal(gcH?.helper_ms_per_run, "ms")}`),
          h("span", { class: "stat-sub" }, "Concurrent worker threads")
        )
      : null,
    gcB || gcH
      ? h("div", { class: "stat-cell" },
          h("span", { class: "stat-k" }, "Collections & freed / run"),
          h("span", { class: "stat-v" }, `${fmtVal(gcB?.minor_per_run, "count")}→${fmtVal(gcH?.minor_per_run, "count")} minor · ${fmtVal(gcB?.major_per_run, "count")}→${fmtVal(gcH?.major_per_run, "count")} major`),
          h("span", { class: "stat-sub" }, `Freed: ${fmtBytes(gcB?.freed_bytes_per_run)} → ${fmtBytes(gcH?.freed_bytes_per_run)}`)
        )
      : null,
  ].filter(Boolean);

  const hasAlloc = !!(alB || alH);
  return h("section", { class: "card-surface", id: "alloc-gc" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, hasAlloc ? "Memory allocations & garbage collection" : "Garbage collection"),
        h("span", { class: "sec-sub" }, hasAlloc
          ? `Heap sampled every ${Math.round((alH?.interval_bytes || alB?.interval_bytes || 32768) / 1024)} KB · 1 attribution launch per build`
          : "Measured from trace GC phases · 1 attribution launch per build")
      ),
      h("div", { class: "card-hd-right" }, toggle)
    ),
    cells.length ? h("div", { class: "stat-strip" }, cells) : null,
    hasAllocRows
      ? h("div", { class: "attr-table" },
          h("div", { class: "attr-row hd" },
            h("span", {}, byFile ? "File / script" : "Allocating function"),
            h("span", { class: "col-ba" }, "Base → Head / run"),
            h("span", { style: "text-align:center" }, aa ? "← Fewer bytes · More bytes →" : "← Less allocated · More allocated →"),
            h("span", { style: "text-align:right" }, "Δ / run")
          ),
          merged.flatMap((x) => {
            const left = Math.min(posPct(0), posPct(x.delta));
            const width = Math.max(0.8, Math.abs(posPct(x.delta) - posPct(0)));
            const saved = x.delta <= 0;
            const barCls = saved ? (aa ? "saved-aa" : "saved") : "added";
            const rawB = x.b ? (byFile ? { name: x.name, where: x.b.fullFile, weight: x.b.weight, stacks: x.b.stacks || [] } : x.b) : null;
            const rawH = x.hd ? (byFile ? { name: x.name, where: x.hd.fullFile, weight: x.hd.weight, stacks: x.hd.stacks || [] } : x.hd) : null;
            const canExpand = !!(rawB?.stacks?.length || rawH?.stacks?.length || (rawB?.where && rawB.where !== "(native)") || (rawH?.where && rawH.where !== "(native)"));
            const isOpen = canExpand && state.openRows.has(x.key);

            const isNativeLeaf = !byFile && (!x.where || /^\(native\)/.test(x.where));
            const caller = isNativeLeaf ? (extractNativeCaller(x.hd?.stacks) || extractNativeCaller(x.b?.stacks)) : null;

            const rowEl = h("div", {
              class: "attr-row" + (canExpand ? " clickable" : ""),

              onclick: canExpand ? () => {
                if (state.openRows.has(x.key)) state.openRows.delete(x.key);
                else state.openRows.add(x.key);
                render();
              } : null,
            },
              h("div", { class: "fn-stack-cell" },
                h("div", { class: "fn-primary-line" },
                  h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                  h("span", { class: "fn-name" }, x.name),
                  !byFile ? h("span", { class: "fn-where" }, shortLocation(x.where)) : null
                ),
                caller ? h("div", { class: "fn-caller-hint" }, "← ", caller.fn ? h("b", {}, caller.fn) : null, caller.fn && caller.shortLoc ? " · " : "", caller.shortLoc) : null
              ),
              h("span", { class: "mono col-ba", style: "color:var(--ink-3);font-size:11.5px" }, `${fmtBytes(x.bv)} → ${fmtBytes(x.hv)}`),
              h("div", { class: "div-track" },
                h("i", { class: "div-zero" }),
                h("i", { class: `div-bar ${barCls}`, style: `left:${left}%;width:${width}%` })
              ),
              h("span", { class: "mono", style: `text-align:right;color:${saved && x.delta < -65536 && !aa ? "var(--win-ink)" : "var(--ink-2)"}` }, fmtSignedBytes(x.delta))
            );
            return isOpen ? [rowEl, renderStackDrawer(rawB, rawH)] : [rowEl];
          })
        )
      : null
  );
}

/* ---------- Deep Dive 4b: Live Heap Snapshot & Diff (Experiments) ---------- */
function fmtCountSigned(n) {
  if (!finite(n)) return "—";
  const abs = Math.abs(Math.round(n)).toLocaleString("en-US");
  return n < 0 ? "−" + abs : n > 0 ? "+" + abs : "0";
}

function fmtCount(n) {
  return finite(n) ? Math.round(n).toLocaleString("en-US") : "—";
}

function normHeapLocKey(loc) {
  if (!loc?.url) return "";
  return normLocationKey(loc.url) + (loc.line > 1 ? `:${loc.line}` : "");
}

function classLookupKey(name, loc) {
  return `${name || ""}\0${normHeapLocKey(loc)}`;
}

// Coalesces class diff rows split only by ephemeral localhost port (e.g. :61607 vs :61610) or bundle chunk hash
function coalesceHeapDiffClasses(rawRows) {
  const list = rawRows || [];
  const hadPortSplit = list.some((r, i) =>
    list.some((o, j) => i !== j && r.class === o.class && normHeapLocKey(r.location) === normHeapLocKey(o.location) && r.location?.url !== o.location?.url)
  );
  const byKey = new Map();
  for (const r of list) {
    const k = `${r.class || ""}\0${r.type || ""}\0${normHeapLocKey(r.location)}`;
    const cur = byKey.get(k);
    if (!cur) {
      byKey.set(k, {
        class: r.class,
        type: r.type,
        location: r.location,
        base: { ...(r.base || { count: 0, self_size: 0, retained_size: 0 }) },
        head: { ...(r.head || { count: 0, self_size: 0, retained_size: 0 }) },
        delta: { ...(r.delta || { count: 0, self_size: 0, retained_size: 0 }) },
        merged: 1,
      });
    } else {
      cur.base.count += r.base?.count || 0;
      cur.base.self_size += r.base?.self_size || 0;
      cur.base.retained_size += r.base?.retained_size || 0;
      cur.head.count += r.head?.count || 0;
      cur.head.self_size += r.head?.self_size || 0;
      cur.head.retained_size += r.head?.retained_size || 0;
      cur.delta.count += r.delta?.count || 0;
      cur.delta.self_size += r.delta?.self_size || 0;
      cur.delta.retained_size += r.delta?.retained_size || 0;
      if (r.head?.count > 0 && r.location) cur.location = r.location;
      cur.merged++;
    }
  }
  return [...byKey.values()]
    .filter((r) => {
      // Drop unpaired tail row cut off at the top-15 boundary when ephemeral ports split every script class
      if (hadPortSplit && list.length >= 15 && r.merged === 1 && r.location?.url && (r.base.count === 0 || r.head.count === 0)) {
        return false;
      }
      return Math.abs(r.delta.retained_size) >= 4096 || Math.abs(r.delta.self_size) >= 4096;
    })
    .sort((a, b) => Math.abs(b.delta.retained_size) - Math.abs(a.delta.retained_size));
}

function renderLiveHeapExperimentSection(s, aa) {
  const diff = s.heap_diff;
  const heapB = s.hotspots?.base?.heap;
  const heapH = s.hotspots?.head?.heap;
  if (!diff && !heapB && !heapH) return null;
  if (!diff && heapH) return renderLiveHeapSingleSection(heapH, "Head live heap (post-GC snapshot)");

  // Index head & base class details so diff rows inherit largest.path & allocations
  const headClassMap = new Map();
  for (const r of [...(heapH?.classes || []), ...(diff?.new?.classes || [])]) {
    const k = classLookupKey(r.class, r.location);
    if (!headClassMap.has(k)) headClassMap.set(k, r);
    if (!headClassMap.has(r.class)) headClassMap.set(r.class, r);
  }
  const baseClassMap = new Map();
  for (const r of heapB?.classes || []) {
    const k = classLookupKey(r.class, r.location);
    if (!baseClassMap.has(k)) baseClassMap.set(k, r);
    if (!baseClassMap.has(r.class)) baseClassMap.set(r.class, r);
  }
  const newOnlyNames = new Set((diff?.new?.by === "class" ? diff?.new?.classes || [] : []).map((c) => classLookupKey(c.class, c.location)));

  const detB = heapB?.detached || { count: 0, retained_size: 0, classes: [] };
  const detH = heapH?.detached || { count: 0, retained_size: 0, classes: [] };
  const detDelta = (detH.count || 0) - (detB.count || 0);

  const classRows = coalesceHeapDiffClasses(diff?.classes).slice(0, 8);
  const hadPortMirror = (diff?.classes?.length || 0) > classRows.length && (diff?.classes_changed || 0) > 1000;
  const maxAbsRet = Math.max(...classRows.map((r) => Math.abs(r.delta?.retained_size || 0)), 1024);
  const scale = Math.max(maxAbsRet * 1.15, 64 * 1024);
  const posPct = (v) => 50 + (v / scale) * 50;

  const newOnlyList = diff?.new?.classes || [];
  const largestOwners = (heapH?.largest || []).filter((o) => !/^system\s*\/\s*(NativeContext|Context)$/.test(o.name || "")).slice(0, 5);
  const detClasses = (detH.classes?.length ? detH.classes : detB.classes) || [];

  return h("section", { class: "card-surface", id: "live-heap" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Live heap (post-GC snapshot)"),
        h("span", { class: "sec-sub" }, "Objects still alive after garbage collection · click rows to inspect full GC retainer paths")
      )
    ),
    h("div", { class: "heap-explain" },
      h("b", {}, "How to read this: "),
      "Measured after forcing garbage collection at the end of the run, so temporary objects are gone. ",
      h("b", {}, "Retained size"),
      " is the total memory freed if that class or object were collected (including everything it exclusively keeps alive); ",
      h("b", {}, "self size"),
      " is only its own shallow bytes."
    ),
    h("div", { class: "stat-strip" },
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Live heap (self)"),
        h("span", { class: "stat-v" }, `${fmtBytes(diff.base?.self_size)} → ${fmtBytes(diff.head?.self_size)}`),
        h("span", { class: "stat-sub" }, `${fmtSignedBytes(diff.delta?.self_size)} net shallow bytes`)
      ),
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Live objects"),
        h("span", { class: "stat-v" }, `${fmtCount(diff.base?.nodes)} → ${fmtCount(diff.head?.nodes)}`),
        h("span", { class: "stat-sub" }, `${fmtCountSigned(diff.delta?.nodes)} objects`)
      ),
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Detached DOM nodes"),
        h("span", {
          class: "stat-v",
          style: !aa && detH.count > detB.count ? "color:var(--loss-ink)" : !aa && detH.count < detB.count ? "color:var(--win-ink)" : "",
        }, `${fmtCount(detB.count)} → ${fmtCount(detH.count)}`),
        h("span", { class: "stat-sub" },
          detH.count > 0 || detB.count > 0
            ? `Retained: ${fmtBytes(detB.retained_size)} → ${fmtBytes(detH.retained_size)}`
            : "Clean · no leaked DOM subtrees"
        )
      ),
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Class footprint changes"),
        h("span", { class: "stat-v" }, hadPortMirror ? `${fmtCount(classRows.length)} ≥ 4 KB` : `${fmtCount(diff.classes_changed)} classes`),
        h("span", { class: "stat-sub" },
          hadPortMirror
            ? "Normalized across build origins"
            : newOnlyList.length > 0
              ? `${newOnlyList.length} ${newOnlyList.length === 1 ? "class" : "classes"} only in head`
              : "No head-only classes"
        )
      )
    ),
    !classRows.length
      ? h("div", { class: "attr-foot", style: "border-top:0" }, "Steady post-GC class footprint: no object class shifted retained memory by ≥ 4 KB between base and head.")
      : null,
    classRows.length
      ? h("div", { class: "attr-table" },
          h("div", { class: "attr-row hd" },
            h("span", {}, "Class & retainer chain (sorted by |Δ retained|)"),
            h("span", { class: "col-ba" }, "Objects (Base → Head)"),
            h("span", { style: "text-align:center" }, aa ? "← Smaller in head · Larger in head →" : "← Freed in head · Retained in head →"),
            h("span", { style: "text-align:right" }, "Δ retained")
          ),
          classRows.flatMap((r, idx) => {
            const dRet = r.delta?.retained_size || 0;
            const left = Math.min(posPct(0), posPct(dRet));
            const width = Math.max(0.8, Math.abs(posPct(dRet) - posPct(0)));
            const shrunk = dRet <= 0;
            const barCls = shrunk ? (aa ? "saved-aa" : "saved") : (aa ? "added" : dRet > 256 * 1024 ? "added-warn" : "added");

            const k = classLookupKey(r.class, r.location);
            const detHCls = headClassMap.get(k) || headClassMap.get(r.class);
            const detBCls = baseClassMap.get(k) || baseClassMap.get(r.class);
            const path = detHCls?.largest?.path || detBCls?.largest?.path || null;
            const allocs = detHCls?.allocations || detBCls?.allocations || null;
            const onlyHead = newOnlyNames.has(k) || (r.base?.count === 0 && r.head?.count > 0);

            const rowKey = `hdiff:${idx}:${r.class}`;
            const canExpand = !!(path?.length || heapLocFull(r.location) || allocs?.length);
            const isOpen = canExpand && state.openRows.has(rowKey);

            const rowEl = h("div", {
              class: "attr-row" + (canExpand ? " clickable" : ""),
              title: `${r.class} — retained ${fmtBytes(r.base?.retained_size)} → ${fmtBytes(r.head?.retained_size)} (self ${fmtBytes(r.base?.self_size)} → ${fmtBytes(r.head?.self_size)})`,
              onclick: canExpand ? () => {
                if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
                else state.openRows.add(rowKey);
                render();
              } : null,
            },
              h("div", { class: "fn-stack-cell" },
                h("div", { class: "fn-primary-line" },
                  h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                  h("span", { class: "fn-name" }, r.class),
                  r.location ? h("span", { class: "fn-where" }, heapLocShort(r.location)) : null,
                  onlyHead && !aa ? h("span", { class: "fn-where", style: "color:var(--warn-ink);font-weight:600" }, "new in head") : null
                ),
                path?.length
                  ? h("div", { class: "fn-caller-hint" }, `↳ ${compactRetainerPath(path)}`)
                  : h("div", { class: "fn-caller-hint" }, `Retained: ${fmtBytes(r.base?.retained_size)} → ${fmtBytes(r.head?.retained_size)}`)
              ),
              h("span", { class: "mono col-ba", style: "color:var(--ink-3);font-size:11.5px" },
                `${fmtCount(r.base?.count)} → ${fmtCount(r.head?.count)}`
              ),
              h("div", { class: "div-track" },
                h("i", { class: "div-zero" }),
                h("i", { class: `div-bar ${barCls}`, style: `left:${left}%;width:${width}%` })
              ),
              h("span", {
                class: "mono",
                style: `text-align:right;font-weight:${Math.abs(dRet) >= 131072 && !aa ? 600 : 400};color:${shrunk && dRet < -131072 && !aa ? "var(--win-ink)" : !shrunk && dRet > 262144 && !aa ? "var(--loss-ink)" : "var(--ink-2)"}`,
              }, fmtSignedBytes(dRet))
            );
            return isOpen ? [rowEl, renderRetainerDrawer(path, detBCls?.location, r.location || detHCls?.location, allocs)] : [rowEl];
          })
        )
      : null,
    (detH.count > 0 || detB.count > 0) && detClasses.length
      ? renderDetachedDomList(detClasses, detB, detH, "exp")
      : null,
    largestOwners.length
      ? renderLargestOwnersList(largestOwners, "Largest memory owners in head (dominator choke points)")
      : null
  );
}

function renderLiveHeapSingleSection(heap, customTitle) {

      ),

        h("span", { class: "stat-k" }, "Unreachable (post-GC)"),

            const isOpen = canExpand && state.openRows.has(rowKey);
            const pct = Math.min(100, Math.max(1, ((c.retained_size || 0) / maxRet) * 100));

            const rowEl = h("div", {

/* ---------- Deep Dive 5: Frame Pacing & Tail Jank ---------- */
// A block's frames reached a display and were kept (as the PR block's frames_kept): never a headless
// page's, nor a block that counted none or whose frames or gaps a validator refused (a percentile's
// TailTooShort only says it had too few). Older results kept such gaps beside the refusal.
function framesKept(s, b) {
  const gaps = (m) => m === "frames.n" || m.startsWith("frames.interval.") || m.startsWith("frames.dropped");
  const refused = Object.entries(b.refused || {}).some(([m, why]) => gaps(m) && !String(why).startsWith("TailTooShort"));
  return s.headless !== true && (b.values?.["frames.n"] || 0) > 0 && !refused;
}

// Gaps come from the pairs whose two blocks both kept frames, each with at least 30 gaps, as the PR
// block's late frames count them (extract::late_frames): a pair's other half is never pooled alone.
function getFrameArrays(s, kind) {
  const inPair = new Set();
  for (const p of pairsOf(s, "frames.n")) {
    const ok = (b) => framesKept(s, b) && (kind !== "gaps" || (b.intervals || []).length >= 30);
    if (ok(p.base) && ok(p.head)) { inPair.add(p.base); inPair.add(p.head); }
  }
  const blocks = timedBlocks(s).filter((b) => inPair.has(b));
  const per = blocks
    .map((b) => ({ variant: b.variant, arr: Float64Array.from((kind === "gaps" ? b.intervals : b.frames) || []).sort() }))
    .filter((x) => x.arr.length > 0);
  return {
    base: pooledSorted(per.filter((x) => x.variant === "base").map((x) => x.arr)),
    head: pooledSorted(per.filter((x) => x.variant === "head").map((x) => x.arr)),
    launchesB: per.filter((x) => x.variant === "base").length,
    launchesH: per.filter((x) => x.variant === "head").length,
  };
}

function renderFramePacingSection(r, s, imp) {
  const vs = imp.vs;
  if (!finite(vs)) return null;
  const gaps = getFrameArrays(s, "gaps");
  if (!gaps.base.length || !gaps.head.length) return null;

  const bucketShare = (arr) => {
    const n = arr.length;
    // Late from 1.5 frame times (a gap of exactly 1.5 is late, as the PR block counts it).
    const c1 = lowerBound(arr, 1.5 * vs);
    const c2 = lowerBound(arr, 2.5 * vs);
    const c3 = lowerBound(arr, 3.5 * vs);
    return { onTime: c1 / n, v2: (c2 - c1) / n, v3: (c3 - c2) / n, v4: (n - c3) / n, missed: (n - c1) / n };
  };

  const bB = bucketShare(gaps.base);
  const bH = bucketShare(gaps.head);
  const maxMissed = Math.max(bB.missed, bH.missed, 0.002) * 1.15;

  const missedRowEl = (label, swCls, bk) => h("div", { class: "missed-row" },
    h("span", { class: "missed-lbl" }, h("i", { class: `swatch ${swCls}` }), label),
    h("div", { class: "missed-bar-bg", title: `${(bk.missed * 100).toFixed(2)}% of frame gaps were 1.5× vsync or longer` },
      bk.v2 > 0 ? h("i", { class: "missed-seg-2", style: `width:${(bk.v2 / maxMissed) * 100}%` }) : null,
      bk.v3 > 0 ? h("i", { class: "missed-seg-3", style: `width:${(bk.v3 / maxMissed) * 100}%` }) : null,
      bk.v4 > 0 ? h("i", { class: "missed-seg-4", style: `width:${(bk.v4 / maxMissed) * 100}%` }) : null
    ),
    h("span", { class: "mono", style: "text-align:right;font-size:11.5px;color:var(--ink-2)" }, `${(bk.missed * 100).toFixed(2)}% skipped`)
  );

  return h("section", { class: "card-surface", id: "frames" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Frame pacing & jank tail"),
        h("span", { class: "sec-sub" }, `1 vsync = ${shortNum(vs)} ms (${Math.round(imp.hz)} Hz) · pooled over ${gaps.launchesB}+${gaps.launchesH} launches`)
      ),
      h("div", { class: "card-hd-right" },
        h("button", {
          type: "button",
          class: "btn-ghost",
          "aria-pressed": String(state.distOpen),
          onclick: () => { state.distOpen = !state.distOpen; render(); },
        }, state.distOpen ? "Hide CDF / histogram" : "Explore CDF / histogram")
      )
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "pacing-grid" },
        h("div", {},
          h("div", { class: "plot-caption" },
            h("span", {}, "Skipped display refreshes (≥2× vsync)"),
            h("span", { class: "dim" }, SIDES
              ? `on time: ${SIDES.base} ${((1 - bB.missed) * 100).toFixed(2)}%, ${SIDES.head} ${((1 - bH.missed) * 100).toFixed(2)}%`
              : `${((1 - bB.missed) * 100).toFixed(2)}% → ${((1 - bH.missed) * 100).toFixed(2)}% on time`)
          ),
          h("div", { class: "missed-rows" }, missedRowEl(sideWord("base", true), "base", bB), missedRowEl(sideWord("head", true), "head", bH)),
          h("div", { class: "legend-inline" },
            h("span", {}, h("i", { class: "lg-box missed-seg-2" }), "2× vsync"),
            h("span", {}, h("i", { class: "lg-box missed-seg-3" }), "3× vsync"),
            h("span", {}, h("i", { class: "lg-box missed-seg-4" }), "4+ vsyncs (freeze)")
          )
        ),
        h("div", { class: "plot-col" },
          h("div", { class: "plot-caption" }, h("span", {}, "Tail frame gaps in vsync multiples"), h("span", { class: "dim" }, `○ ${sideWord("base", true)}  ·  ● ${sideWord("head", true)}`)),
          chartBox(106, (w) => drawTailDumbbells(w, gaps, vs))
        )
      )
    )
  );
}

function drawTailDumbbells(w, gaps, vs) {
  const H = 106;
  const m = { l: 42, r: 16, t: 8, b: 20 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const levels = [["p50", 0.5], ["p95", 0.95], ["p99", 0.99], ["max", 1.0]];
  const valAt = (arr, p) => (p === 1.0 ? arr[arr.length - 1] : quant(arr, p)) / vs;
  const all = levels.flatMap(([, p]) => [valAt(gaps.base, p), valAt(gaps.head, p)]).filter(finite);
  const top = Math.max(2.4, ...all) * 1.08;
  const x = lin(0, top, m.l, w - m.r);

  const step = x(1) - x(0) >= 24 ? 1 : x(1) - x(0) >= 12 ? 2 : 4;
  for (let k = 1; k <= top; k++) {
    svg.append(S("line", { x1: x(k), y1: m.t, x2: x(k), y2: H - m.b, stroke: k === 1 ? "var(--border-strong)" : "var(--hairline)", "stroke-dasharray": k === 1 ? "3 2" : "2 3" }));
    if (k === 1 || k % step === 0) svg.append(S("text", { x: x(k), y: H - 4, "text-anchor": "middle", style: "font-size:10px" }, `${k}×`));
  }

  levels.forEach(([lbl, p], idx) => {
    const cy = m.t + 10 + idx * 20;
    const vb = valAt(gaps.base, p), vh = valAt(gaps.head, p);
    svg.append(
      S("text", { x: m.l - 8, y: cy + 3.5, "text-anchor": "end", style: "font-size:10.5px" }, lbl),
      S("line", { x1: m.l, y1: cy, x2: w - m.r, y2: cy, class: "gridline" })
    );
    if (finite(vb) && finite(vh)) svg.append(S("line", { x1: x(vb), y1: cy, x2: x(vh), y2: cy, stroke: "var(--ink-4)", "stroke-width": 1.5 }));
    if (finite(vb)) svg.append(S("circle", { cx: x(vb), cy, r: 4, fill: "var(--surface)", stroke: "var(--base-tone)", "stroke-width": 1.6 }));
    if (finite(vh)) svg.append(S("circle", { cx: x(vh), cy, r: 3.5, fill: "var(--head-tone)" }));
  });
  return svg;
}

function drawDistCurve(w, arrs, vs, isCdf) {
  const H = 220;
  const m = { l: 46, r: 16, t: 14, b: 26 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const xmax = Math.max(quant(arrs.base, 0.995), quant(arrs.head, 0.995), finite(vs) ? vs * 1.4 : 10) * 1.06;
  const x = lin(0, xmax, m.l, w - m.r);
  const bins = 48, bw = xmax / bins;

  const mkHist = (a) => {
    const c = new Array(bins).fill(0);
    for (const v of a) if (v >= 0 && v < xmax) c[Math.min(bins - 1, Math.floor(v / bw))]++;
    return c.map((n) => n / a.length);
  };
  const hB = isCdf ? null : mkHist(arrs.base);
  const hH = isCdf ? null : mkHist(arrs.head);
  const ymax = isCdf ? 1 : Math.max(...hB, ...hH, 0.01) * 1.12;
  const y = lin(0, ymax, H - m.b, m.t);

  for (const t of (isCdf ? [0, 0.25, 0.5, 0.75, 1] : niceTicks(0, ymax, 4))) {
    svg.append(
      S("line", { x1: m.l, y1: y(t), x2: w - m.r, y2: y(t), class: "gridline" }),
      S("text", { x: m.l - 6, y: y(t) + 3.5, "text-anchor": "end", style: "font-size:10px" }, `${Math.round(t * 100)}%`)
    );
  }
  const xTicks = niceTicks(0, xmax, 5);
  for (const t of xTicks) {
    svg.append(S("text", { x: x(t), y: H - 6, "text-anchor": "middle", style: "font-size:10px" }, fmtAxisTick(t, "ms", xTicks, (v) => `${parseFloat(v.toPrecision(4))} ms`)));
  }
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: w - m.r, y2: H - m.b, class: "axisline" }));

  [["base", arrs.base, hB, "var(--base-tone)"], ["head", arrs.head, hH, "var(--accent)"]].forEach(([key, arr, hist, color]) => {
    if (isCdf) {
      const pts = [];
      for (let px = m.l; px <= w - m.r; px += 2) pts.push(`${px},${y(upperBound(arr, x.inv(px)) / arr.length)}`);
      svg.append(S("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": key === "head" ? 2 : 1.5 }));
    } else {
      let d = `M${x(0)},${y(0)}`;
      hist.forEach((v, i) => { d += `L${x(i * bw)},${y(v)}L${x((i + 1) * bw)},${y(v)}`; });
      d += `L${x(xmax)},${y(0)}Z`;
      svg.append(S("path", { d, fill: color, "fill-opacity": 0.16, stroke: color, "stroke-width": 1.2 }));
    }
  });
  return svg;
}

/* ---------- Deep Dive 6: All Measured Metrics & CLI Trace Queries ---------- */
function renderAllMetricsDisclosure(s, aa) {
  const items = allComparisons(s);
  if (!items.length) return null;
  const tested = items.filter((x) => x.role !== "descriptive");
  const desc = items.filter((x) => x.role === "descriptive");
  const bnd = finite(s.bound) ? s.bound : 0.02;
  const dom = [-5 * bnd, 5 * bnd];
  const focus = state.focusMetric || s.primary?.metric;

  return h("details", {
    class: "disclosure",
    open: state.metricsOpen,
    ontoggle: (e) => { state.metricsOpen = e.currentTarget.open; },
  },
    h("summary", {},
      h("span", { class: "chev" }, makeChevSvg()),
      h("span", { class: "sec-title" }, `All ${items.length} measured metrics`),
      // Tested: rows a test ran on (a refused or untested secondary had none).
      h("span", { class: "sec-sub" }, `${tested.filter((x) => !["untested", "refused"].includes(x.c.verdict_kind) && !/^(—|refused)/.test(x.c.verdict || "")).length} hypothesis-tested · ${desc.length} context metrics · click any row to inspect pairs`)
    ),
    h("div", { class: "forest-wrap" },
      h("div", { class: "forest-row hd" },
        h("span", {}, "Metric"),
        h("span", { style: "text-align:right" }, sideWord("base", true)),
        h("span", { style: "text-align:right" }, sideWord("head", true)),
        h("span", { style: "text-align:right" }, "Paired Δ"),
        h("span", { style: "text-align:center" }, `Interval (±${parseFloat((bnd * 500).toPrecision(3))}% scale)`),
        h("span", {}, "Range"),
        h("span", {}, "Outcome")
      ),
      tested.map((x) => forestRow(x, dom, focus, aa)),
      desc.length ? h("div", { class: "forest-group" }, "Context metrics (descriptive, not hypothesis-tested)") : null,
      desc.map((x) => forestRow(x, dom, focus, aa))
    )
  );
}

function forestRow(item, dom, focus, aa) {
  // A refused comparison shows no number: results from before strobe cleared them still hold some.
  const refusedRow = item.c?.verdict_kind === "refused" || /^refused/.test(item.c?.verdict || "");
  const c = refusedRow ? { ...item.c, base: null, head: null, estimate: null, lo: null, hi: null } : item.c;
  const m = c.metric;
  const u = unitOf(m);
  const cl = item.role !== "descriptive" && c.decided ? classify(c, m, aa) : { tone: "neutral", kind: item.role === "descriptive" ? "desc" : "unconfirmed" };
  const rowDom = c.relative !== false ? dom : (() => {
    const sp = Math.max(Math.abs(c.lo || 0), Math.abs(c.hi || 0), Math.abs(c.bound || 1)) * 1.2 || 1;
    return [-sp, sp];
  })();

  const [d0, d1] = rowDom;
  const rawPct = (v) => ((v - d0) / (d1 - d0)) * 100;
  const pct = (v) => Math.max(0, Math.min(100, rawPct(v)));
  const b = Math.abs(c.bound || 0);
  const clipLeft = finite(c.lo) && rawPct(c.lo) < 0;
  const clipRight = finite(c.hi) && rawPct(c.hi) > 100;
  const inBoundsEst = finite(c.estimate) && rawPct(c.estimate) >= 0 && rawPct(c.estimate) <= 100;

  const track = h("div", { class: "f-track" },
    // A no-worse margin passes everything on the better side of it: one-sided.
    b > 0 ? (() => {
      const [l, r] = !finite(c.noworse) ? [pct(-b), pct(b)] : higherBetter(m, c) ? [pct(-b), 100] : [0, pct(b)];
      return h("i", { class: "f-band", style: `left:${l}%;width:${r - l}%` });
    })() : null,
    h("i", { class: "f-zero", style: "left:50%" }),
    finite(c.lo) && finite(c.hi) && rawPct(c.hi) >= 0 && rawPct(c.lo) <= 100
      ? h("i", { class: "f-ci", style: `left:${pct(c.lo)}%;width:${Math.max(0.8, pct(c.hi) - pct(c.lo))}%` })
      : null,
    clipLeft ? h("span", { class: "f-clip l", title: "Interval extends beyond left axis" }, "‹") : null,
    clipRight ? h("span", { class: "f-clip r", title: "Interval extends beyond right axis" }, "›") : null,
    inBoundsEst ? h("i", { class: "f-dot", style: `left:${pct(c.estimate)}%` }) : null
  );

  const outcomeStr = refusedRow
    ? `Refused (${refusalOf(c).validator || "see why"})`
    : item.role === "descriptive" ? "Context"
    : c.verdict_kind === "untested" || (!c.verdict_kind && c.verdict === "—") ? "Not tested"
    : !c.decided ? (c.lo > 0 || c.hi < 0 ? "Unconfirmed" : "Inconclusive")
    : cl.kind === "same" ? `Same (${fmtBound(c, u)})`
    : cl.kind === "noworse" ? `No worse (${fmtMargin(c, u)})`
    : cl.kind === "inconclusive" ? "Inconclusive"
    : cl.kind === "aa-fp" ? "False positive"
    : cl.tone === "win" ? "Confirmed better" : "Confirmed worse";

  const rowCls = cl.tone === "win" ? "f-row-win" : cl.tone === "loss" ? "f-row-loss" : item.role === "descriptive" ? "f-row-desc" : "";

  return h("div", {
    class: `forest-row ${rowCls}${m === focus ? " focused" : ""}`,
    onclick: () => {
      state.focusMetric = m;
      render();
      document.getElementById("evidence")?.scrollIntoView({ behavior: "smooth", block: "start" });
    },
  },
    h("span", { style: "font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title: CATALOG.get(m)?.about || m },
      item.role === "primary" ? "★ " : "", labelOf(m)
    ),
    h("span", { class: "mono", style: "text-align:right;color:var(--ink-3)" }, fmtVal(c.base, u)),
    h("span", { class: "mono", style: "text-align:right" }, fmtVal(c.head, u)),
    h("span", { class: "mono", style: `text-align:right;color:${cl.tone === "win" ? "var(--win-ink)" : cl.tone === "loss" ? "var(--loss-ink)" : "var(--ink-2)"}` }, fmtDelta(c.estimate, c, u)),
    track,
    h("span", { class: "mono", style: "color:var(--ink-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" }, fmtRange(c, u, " … ")),
    h("span", { style: `font-size:12px;color:${cl.tone === "win" ? "var(--win-ink)" : cl.tone === "loss" ? "var(--loss-ink)" : "var(--ink-3)"}` }, outcomeStr)
  );
}

function renderTraceQueriesDisclosure(r, s) {
  const cmds = [];
  const a = s.attribution || {};
  if (a.head) cmds.push(["Open head's profiled launch in Perfetto (flame graphs, timeline)", `strobe open ${a.head}`]);
  if (a.base) cmds.push(["Open base's profiled launch in Perfetto", `strobe open ${a.base}`]);
  for (const b of timedBlocks(s).filter((b) => b.recording)) cmds.push([`Open the kept ${b.variant || ""} block (pair ${finite(b.pair) ? b.pair + 1 : "?"}) in Perfetto`, `strobe open ${b.recording}`]);
  if (a.head) {
    cmds.push(["CPU hotspots in head (by package)", `strobe query ${a.head} hotspots --by package`]);
    cmds.push(["Forced layout & style stacks in head", `strobe query ${a.head} layout`]);
    // Firefox recordings hold no allocation samples: GC alone.
    cmds.push(s.engine === "firefox" ? ["GC in head", `strobe query ${a.head} gc`] : ["Heap allocations & GC in head", `strobe query ${a.head} alloc`]);
  }
  if (a.base) {
    cmds.push(["CPU hotspots in base (by package)", `strobe query ${a.base} hotspots --by package`]);
  }
  const tr = s.timing_recordings || [];
  const th = tr.find((t) => t.variant === "head") || timedBlocks(s).find((b) => b.variant === "head");
  const tb = tr.find((t) => t.variant === "base") || timedBlocks(s).find((b) => b.variant === "base");
  if (th?.recording) cmds.push(["Worst frames in a head launch", `strobe query ${th.recording} frames`]);
  if (tb?.recording) cmds.push(["Worst frames in a base launch", `strobe query ${tb.recording} frames`]);
  if (th?.recording) cmds.push(["Thread busy share in a head launch", `strobe query ${th.recording} threads`]);

  if (!cmds.length) return null;

  return h("details", {
    class: "disclosure",
    open: state.queriesOpen,
    ontoggle: (e) => { state.queriesOpen = e.currentTarget.open; },
  },
    h("summary", {},
      h("span", { class: "chev" }, makeChevSvg()),
      h("span", { class: "sec-title" }, `Recording & Perfetto SQL queries (${cmds.length})`),
      h("span", { class: "sec-sub" }, "Inspect individual trace recordings from the CLI")
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "next-list" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
    )
  );
}
