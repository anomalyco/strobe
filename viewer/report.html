/* ---------- Feature 3: Where the Memory Is (By Process & Layer) ---------- */
const LAYER_GROUPS = [
  ["ly-pa", "PartitionAlloc", ["partition_alloc"]],
  ["ly-malloc", "Malloc", ["malloc"]],
  ["ly-v8", "V8 JS", ["v8"]],
  ["ly-blink", "Blink & DOM", ["blink_gc", "blink_objects"]],
  ["ly-gpu", "GPU & Skia", ["gpu", "skia"]],
  ["ly-cc", "Compositor (cc)", ["cc"]],
  ["ly-storage", "SQLite & Cache", ["sqlite", "site_storage", "leveldatabase", "web_cache"]],
];

function decomposeProcessLayers(proc) {
  const raw = proc?.layers || {};
  const usedKeys = new Set();
  const segs = [];
  let sumAlloc = 0;
  for (const [cls, label, keys] of LAYER_GROUPS) {
    let val = 0;
    for (const k of keys) {
      usedKeys.add(k);
      if (finite(raw[k]) && raw[k] > 0) val += raw[k];
    }
    if (val > 0) { segs.push({ cls, label, bytes: val }); sumAlloc += val; }
  }
  let otherAlloc = 0;
  for (const [k, v] of Object.entries(raw)) {
    // shared_memory is tracked separately from private allocator_bytes in Chromium memory-infra
    if (k === "shared_memory" || usedKeys.has(k)) continue;
    if (finite(v) && v > 0) otherAlloc += v;
  }
  if (otherAlloc > 0) { segs.push({ cls: "ly-other", label: "Other Chromium", bytes: otherAlloc }); sumAlloc += otherAlloc; }

  const unexp = proc?.unexplained_bytes;
  if (finite(unexp) && unexp > 0) {
    segs.push({ cls: "ly-unexp", label: "Unexplained OS (est.)", bytes: unexp });
  } else if (!segs.length && finite(proc?.private_bytes) && proc.private_bytes > 0) {
    segs.push({ cls: "ly-unexp", label: "OS private (no allocator dump)", bytes: proc.private_bytes });
  }
  const barTotal = segs.reduce((s, x) => s + x.bytes, 0);
  return { segs, barTotal, sumAlloc, unexp };
}

const PROC_ORDER = ["renderer (page)", "GPU", "browser", "network", "storage", "renderer", "other", "tracing (strobe's)"];
function procRank(type, strobeOwn) {
  if (strobeOwn) return 999;
  const idx = PROC_ORDER.indexOf(type);
  return idx >= 0 ? idx : 50;
}

function summarizeProcessGroups(mem) {
  const groups = new Map();
  for (const p of mem?.processes || []) {
    const key = `${p.strobe_own ? "1" : "0"}:${p.type || "other"}`;
    const cur = groups.get(key);
    if (!cur) {
      groups.set(key, {
        type: p.type || "other",
        page: !!p.page,
        strobe_own: !!p.strobe_own,
        count: 1,
        pids: [p.pid],
        private_bytes: p.private_bytes || 0,
        working_set_bytes: p.working_set_bytes || 0,
        allocator_bytes: finite(p.allocator_bytes) ? p.allocator_bytes : null,
        unexplained_bytes: finite(p.unexplained_bytes) ? p.unexplained_bytes : null,
        layers: { ...(p.layers || {}) },
      });
    } else {
      cur.count++;
      cur.pids.push(p.pid);
      cur.page = cur.page || !!p.page;
      cur.private_bytes += p.private_bytes || 0;
      cur.working_set_bytes += p.working_set_bytes || 0;
      if (finite(p.allocator_bytes)) cur.allocator_bytes = (cur.allocator_bytes || 0) + p.allocator_bytes;
      if (finite(p.unexplained_bytes)) cur.unexplained_bytes = (cur.unexplained_bytes || 0) + p.unexplained_bytes;
      for (const [lk, lv] of Object.entries(p.layers || {})) {
        if (finite(lv)) cur.layers[lk] = (cur.layers[lk] || 0) + lv;
      }
    }
  }
  return [...groups.values()].sort((a, b) => procRank(a.type, a.strobe_own) - procRank(b.type, b.strobe_own) || b.private_bytes - a.private_bytes);
}

function renderLayerLegend() {
  return h("div", { class: "legend-inline", style: "padding:10px 24px 14px;border-top:1px solid var(--hairline);margin-top:0" },
    ...LAYER_GROUPS.map(([cls, lbl]) => h("span", {}, h("i", { class: `lg-box ${cls}` }), lbl)),
    h("span", {}, h("i", { class: "lg-box ly-unexp", style: "border:1px solid var(--border-strong)" }), "Unexplained OS est. (OS private − allocators)")
  );
}

function renderProcessMemoryExperimentSection(s) {
  const memB = s.hotspots?.base?.memory;
  const memH = s.hotspots?.head?.memory;
  if (!memB && !memH) return null;
  if (!memB && memH) return renderProcessMemorySingleSection(memH, s.hotspots?.head?.memory_layers, "Where the memory is (head attribution launch · descriptive)");

  const grpsB = summarizeProcessGroups(memB);
  const grpsH = summarizeProcessGroups(memH);
  const mapB = new Map(grpsB.map((g) => [`${g.strobe_own ? 1 : 0}:${g.type}`, g]));
  const mapH = new Map(grpsH.map((g) => [`${g.strobe_own ? 1 : 0}:${g.type}`, g]));
  const allKeys = [...new Set([...mapH.keys(), ...mapB.keys()])].sort((ka, kb) => {
    const a = mapH.get(ka) || mapB.get(ka);
    const b = mapH.get(kb) || mapB.get(kb);
    return procRank(a.type, a.strobe_own) - procRank(b.type, b.strobe_own);
  });

  const totTarget = (grps) => grps.filter((g) => !g.strobe_own).reduce((sum, g) => sum + g.private_bytes, 0);
  const totB = totTarget(grpsB), totH = totTarget(grpsH);
  const domB = memB.page?.dom || {}, domH = memH.page?.dom || {};

  const maxBar = Math.max(
    ...allKeys.flatMap((k) => [decomposeProcessLayers(mapB.get(k)).barTotal, decomposeProcessLayers(mapH.get(k)).barTotal]),
    1024 * 1024
  );

  const inflated = !!(memB.os_after_snapshot || memH.os_after_snapshot);

  const drawProcBar = (proc, osAfterSnap) => {
    if (!proc) return h("div", { class: "proc-bar-track" });
    const dec = decomposeProcessLayers(proc);
    const tipRows = [
      ["OS private", fmtBytes(proc.private_bytes) + (osAfterSnap && proc.page ? " (post-snapshot, inflated)" : "")],
      ["Working set", fmtBytes(proc.working_set_bytes)],
      ...dec.segs.map((sg) => [sg.label, fmtBytes(sg.bytes)]),
      finite(proc.unexplained_bytes) && proc.unexplained_bytes < 0
        ? ["Unexplained (est.)", `${fmtSignedBytes(proc.unexplained_bytes)} (allocators exceed OS private via shared/uncommitted pages)`]
        : null,
    ];
    const bar = h("div", { class: "proc-bar-track" },
      dec.segs.map((sg) => h("i", {
        class: `proc-seg ${sg.cls}`,
        style: `width:${(sg.bytes / maxBar) * 100}%`,
      }))
    );
    bar.addEventListener("pointerenter", (e) => showTip(e, `${proc.type}${proc.count > 1 ? ` (×${proc.count} processes)` : ""}`, tipRows));
    bar.addEventListener("pointermove", moveTip);
    bar.addEventListener("pointerleave", hideTip);
    return bar;
  };

  return h("section", { class: "card-surface", id: "process-memory" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Where the memory is (by process & layer)"),
        h("span", { class: "sec-sub" }, "1 attribution launch per build · descriptive, not hypothesis-tested · strobe's tracing process excluded from totals")
      )
    ),
    inflated
      ? h("div", { class: "perturbed-note", style: "border-top:0;border-bottom:1px solid var(--hairline)" },
          h("b", {}, "Post-snapshot OS reading: "),
          "The page renderer's OS private bytes were read after serializing a V8 heap snapshot and are inflated by snapshot metadata."
        )
      : null,
    h("div", { class: "stat-strip" },
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Target OS private RAM"),
        h("span", { class: "stat-v" }, `${fmtBytes(totB)} → ${fmtBytes(totH)}`),
        h("span", { class: "stat-sub" }, `${fmtSignedBytes(totH - totB)} across target processes`)
      ),
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Page V8 JS heap"),
        h("span", { class: "stat-v" }, `${fmtBytes(memB.page?.js_heap_bytes)} → ${fmtBytes(memH.page?.js_heap_bytes)}`),
        h("span", { class: "stat-sub" }, `Total committed: ${fmtBytes(memH.page?.js_heap_total_bytes)}`)
      ),
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Page DOM nodes"),
        h("span", { class: "stat-v" }, `${fmtCount(domB.nodes)} → ${fmtCount(domH.nodes)}`),
        h("span", { class: "stat-sub" }, `${fmtCount(domH.documents)} docs · ${fmtCount(domH.listeners)} event listeners`)
      )
    ),
    h("div", { class: "proc-list" },
      allKeys.flatMap((k) => {
        const b = mapB.get(k), hd = mapH.get(k);
        const ref = hd || b;
        const countTag = (b?.count || 0) > 1 || (hd?.count || 0) > 1 ? ` ×${hd?.count || b?.count}` : "";
        const negUnexp = [b, hd].find((x) => finite(x?.unexplained_bytes) && x.unexplained_bytes < 0);
        const snapInflated = (memH.os_after_snapshot || memB.os_after_snapshot) && ref.page;

        const metaLines = [
          ref.strobe_own ? "excluded from target totals" : null,
          snapUnexpNote(snapInflated, negUnexp),
        ].filter(Boolean).join(" · ");

        return [
          h("div", { class: "proc-row" + (ref.strobe_own ? " strobe-own" : ""), style: "padding-bottom:3px" },
            h("div", { class: "proc-type" },
              h("span", {}, `${ref.type}${countTag}`),
              metaLines ? h("span", { class: "proc-meta" }, metaLines) : null
            ),
            h("span", { class: "mono proc-side", style: "color:var(--ink-3);font-size:11px" }, "Base"),
            drawProcBar(b, memB.os_after_snapshot),
            h("span", { class: "mono", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, b ? fmtBytes(b.private_bytes) : "—")
          ),
          h("div", { class: "proc-row" + (ref.strobe_own ? " strobe-own" : ""), style: "border-top:0;padding-top:2px" },
            h("div", {}),
            h("span", { class: "mono proc-side", style: "color:var(--ink-2);font-size:11px;font-weight:500" }, "Head"),
            drawProcBar(hd, memH.os_after_snapshot),
            h("span", { class: "mono", style: "text-align:right;font-weight:600;font-size:11.5px" }, hd ? fmtBytes(hd.private_bytes) : "—")
          ),
        ];
      })
    ),
    renderLayerLegend()
  );
}

function snapUnexpNote(snapInflated, negProc) {
  const parts = [];
  if (snapInflated) parts.push("OS inflated post-snapshot");
  if (negProc) parts.push(`unexplained est. ${fmtSignedBytes(negProc.unexplained_bytes)}`);
  return parts.join(" · ");
}

function renderProcessMemorySingleSection(mem, memLayers, customTitle) {
  if (!mem?.processes?.length) return null;
  const grps = summarizeProcessGroups(mem);
  const totPrivate = grps.filter((g) => !g.strobe_own).reduce((s, g) => s + g.private_bytes, 0);
  const maxBar = Math.max(...grps.map((g) => decomposeProcessLayers(g).barTotal), 1024 * 1024);
  const dom = mem.page?.dom || {};

  return h("section", { class: "card-surface", id: "process-memory" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, customTitle || "Where the memory is (by process & layer)"),
        h("span", { class: "sec-sub" }, `${mem.census || "Memory dump"} · strobe's tracing process excluded from totals`)
      )
    ),
    mem.os_after_snapshot
      ? h("div", { class: "perturbed-note", style: "border-top:0;border-bottom:1px solid var(--hairline)" },
          h("b", {}, "Post-snapshot OS reading: "),
          "The page renderer's OS private bytes were read after taking a heap snapshot and include snapshot serialization overhead."
        )
      : null,
    h("div", { class: "stat-strip" },
      h("div", { class: "stat-cell" },
        h("span", { class: "stat-k" }, "Target OS private RAM"),
        h("span", { class: "stat-v" }, fmtBytes(memLayers?.os_private_bytes || totPrivate)),
        h("span", { class: "stat-sub" }, `${grps.filter((g) => !g.strobe_own).reduce((s, g) => s + g.count, 0)} target processes`)
      ),
      finite(mem.page?.js_heap_bytes)
        ? h("div", { class: "stat-cell" },
            h("span", { class: "stat-k" }, "Page V8 JS heap"),
            h("span", { class: "stat-v" }, fmtBytes(mem.page.js_heap_bytes)),
            h("span", { class: "stat-sub" }, `Committed: ${fmtBytes(mem.page.js_heap_total_bytes)}`)
          )
        : null,
      finite(dom.nodes)
        ? h("div", { class: "stat-cell" },
            h("span", { class: "stat-k" }, "Page DOM & listeners"),
            h("span", { class: "stat-v" }, `${fmtCount(dom.nodes)} nodes`),
            h("span", { class: "stat-sub" }, `${fmtCount(dom.documents)} docs · ${fmtCount(dom.listeners)} listeners`)
          )
        : null
    ),
    h("div", { class: "proc-list" },
      grps.map((g) => {
        const dec = decomposeProcessLayers(g);
        const countTag = g.count > 1 ? ` ×${g.count}` : "";
        const snapInflated = mem.os_after_snapshot && g.page;
        const negUnexp = finite(g.unexplained_bytes) && g.unexplained_bytes < 0 ? g : null;
        const metaLines = [
          g.strobe_own ? "excluded from totals" : null,
          snapUnexpNote(snapInflated, negUnexp),
        ].filter(Boolean).join(" · ");

        const tipRows = [
          ["OS private", fmtBytes(g.private_bytes) + (snapInflated ? " (post-snapshot, inflated)" : "")],
          ["Working set", fmtBytes(g.working_set_bytes)],
          ...dec.segs.map((sg) => [sg.label, fmtBytes(sg.bytes)]),
          negUnexp ? ["Unexplained (est.)", `${fmtSignedBytes(g.unexplained_bytes)} (allocators exceed OS private)`] : null,
        ];

        const bar = h("div", { class: "proc-bar-track" },
          dec.segs.map((sg) => h("i", { class: `proc-seg ${sg.cls}`, style: `width:${(sg.bytes / maxBar) * 100}%` }))
        );
        bar.addEventListener("pointerenter", (e) => showTip(e, `${g.type}${countTag}`, tipRows));
        bar.addEventListener("pointermove", moveTip);
        bar.addEventListener("pointerleave", hideTip);

        return h("div", { class: "proc-row single" + (g.strobe_own ? " strobe-own" : "") },
          h("div", { class: "proc-type" },
            h("span", {}, `${g.type}${countTag}`),
            metaLines ? h("span", { class: "proc-meta" }, metaLines) : null
          ),
          bar,
          h("span", { class: "mono", style: "text-align:right;font-weight:600;font-size:11.5px" }, fmtBytes(g.private_bytes))
        );
      })
    ),
    renderLayerLegend()
  );
}

/* ---------- Feature 1: Leak Runs (`s.kind === "leak"`) ---------- */
function isV8EngineClass(clsName, typeName) {
  if (typeName === "code" || typeName === "hidden" || typeName === "object shape") return true;
  return /^\((compiled code|system|object shape|bytecode|shared function)\)$/i.test(clsName || "") || /^system\s*\//.test(clsName || "");
}

function renderLeakSeries(shell, r, s, seriesList, aa, baseVar, headVar, baseTag, headTag) {
  const lh = s.leak?.head;
  const lb = s.leak?.base;
  const mainSide = lh || lb || {};
  const jh = mainSide.js_heap || {};
  const dn = mainSide.dom_nodes || {};
  const susp = mainSide.suspects || {};
  const appSusp = susp.app || { count: 0, retained_size: 0, self_size: 0 };
  const verdictStr = s.primary?.verdict || jh.verdict || "unclear";
  const cl = classifyLeakVerdict(verdictStr, s.decided ?? jh.decided);

  const realWarnings = dedupWarnings([...(r.warnings || []), ...(s.warnings || [])]).filter((w) => w.level === "warn" || w.level === "error");
  const caveatEl = realWarnings.length
    ? h("div", { class: "caveat-bar" },
        realWarnings.map((w) => h("div", { class: "caveat-item" }, h("span", { class: "caveat-label" }, `Caveat · ${w.id}`), h("span", { class: "caveat-text" }, w.text)))
      )
    : null;

  let pillLabel = "Inconclusive";
  let headline = capFirst(verdictStr);
  if (verdictStr.startsWith("leaks")) {
    pillLabel = "Confirmed leak";
    headline = `JS heap ${verdictStr}`;
  } else if (verdictStr.startsWith("no app leak")) {
    pillLabel = "Confirmed · No app leak";
    headline = "No app leak — heap growth is V8 JIT warmup";
  } else if (verdictStr.startsWith("grows, then levels off")) {
    pillLabel = "Confirmed · Levels off";
    headline = "Heap grows in first half, then levels off";
  } else if (verdictStr.startsWith("no growth")) {
    pillLabel = "Confirmed · No growth";
    headline = `No JS heap growth ${verdictStr.replace(/^no growth\s*/, "")}`;
  } else {
    headline = `Heap growth inconclusive over ${mainSide.runs || "?"} runs`;
  }

  const halfN = s.runs_per_half || Math.floor((mainSide.runs || 0) / 2);
  const v8Retained = Math.max(0, (susp.retained_size || 0) - (appSusp.retained_size || 0));
  const v8Count = Math.max(0, (susp.count || 0) - (appSusp.count || 0));

  const heroCard = h("section", { class: "card-surface" },
    caveatEl,
    h("div", { class: "hero-body" },
      h("div", { class: "hero-header" },
        h("div", { class: "eyebrow-row" },
          h("span", { class: `status-pill ${cl.tone}` }, pillLabel),
          h("span", { class: "eyebrow-meta" }, `${s.label || s.case || "Leak check"} · ${mainSide.runs || "?"} runs (${mainSide.censuses || "?"} post-GC censuses)`)
        ),
        h("h1", { class: "hero-headline" }, headline),
        h("p", { class: "hero-prose" },
          h("strong", {}, "Strobe verdict: "),
          verdictStr,
          dn.verdict ? [` · DOM nodes: ${dn.verdict}.`] : "."
        ),
        headVar?.subject
          ? h("div", { class: "ba-commits", style: "margin-top:2px" },
              h("div", { title: headVar.subject }, h("span", { class: "k" }, headTag), headVar.subject)
            )
          : null
      ),
      h("div", { class: "leak-metrics-grid" },
        h("div", { class: "leak-mcol" },
          h("span", { class: "leak-mk" }, "JS heap slope (Theil–Sen)"),
          h("span", { class: `leak-mv ${cl.tone === "loss" ? "loss" : ""}` }, finite(jh.slope) ? `${fmtSignedBytes(jh.slope)}/run` : "—"),
          h("span", { class: "leak-msub" },
            finite(jh.lo) && finite(jh.hi) ? `95% range: ${fmtSignedBytes(jh.lo)} … ${fmtSignedBytes(jh.hi)}/run` : "—"
          )
        ),
        h("div", { class: "leak-mcol" },
          h("span", { class: "leak-mk" }, `1st vs 2nd half (${halfN}+${halfN} runs)`),
          h("span", { class: "leak-mv" },
            finite(jh.first_half) && finite(jh.second_half)
              ? `${fmtSignedBytes(jh.first_half)} → ${fmtSignedBytes(jh.second_half)}`
              : "—"
          ),
          h("span", { class: "leak-msub" }, "Per-run slope in runs 0–S1 vs S1–S2")
        ),
        h("div", { class: "leak-mcol" },
          h("span", { class: "leak-mk" }, "App objects (S0→S1 at S2)"),
          h("span", { class: `leak-mv ${cl.tone === "loss" ? "loss" : cl.tone === "win" ? "win" : ""}` },
            finite(jh.app_per_run) ? `${fmtSignedBytes(jh.app_per_run)}/run` : fmtBytes(appSusp.retained_size)
          ),
          h("span", { class: "leak-msub" }, `${fmtBytes(appSusp.retained_size)} app · ${fmtBytes(v8Retained)} V8/JIT`)
        ),
        h("div", { class: "leak-mcol" },
          h("span", { class: "leak-mk" }, "DOM node slope"),
          h("span", { class: "leak-mv" }, finite(dn.slope) ? `${fmtSigned(dn.slope, "count")} /run` : "—"),
          h("span", { class: "leak-msub" }, dn.verdict || "—")
        )
      ),
      lb
        ? h("div", { class: "coarse-note" },
            h("b", {}, `Base (${baseTag}) comparison: `),
            `Base verdict: ${lb.js_heap?.verdict || "—"} (slope ${fmtSignedBytes(lb.js_heap?.slope)}/run, app ${fmtSignedBytes(lb.js_heap?.app_per_run)}/run).`
          )
        : null
    )
  );

  // 2. Census Trajectory Charts (JS Heap & DOM Nodes across S0..S1..S2)
  const chartSection = h("section", { class: "card-surface" },
    h("div", { class: "card-hd" },
      h("div", { class: "card-hd-left" },
        h("h2", { class: "sec-title" }, "Post-GC memory across runs (S0 → S1 → S2)"),
        h("span", { class: "sec-sub" }, `After warmup, strobe takes S0 at run 0, S1 at run ${halfN}, and S2 at run ${mainSide.runs || halfN * 2}`)
      )
    ),
    h("div", { class: "card-bd" },
      h("div", { class: "census-grid" },
        h("div", { class: "plot-col" },
          h("div", { class: "plot-caption" },
            h("span", {}, "Post-GC JS heap per census"),
            h("span", { class: "dim" }, `Line & cone: ${fmtSignedBytes(jh.slope)}/run (95% slope interval)`)
          ),
          chartBox(182, (w) => drawLeakSeriesChart(w, mainSide.js_heap_bytes || [], lb?.js_heap_bytes, jh, halfN, fmtBytes, cl.tone))
        ),
        h("div", { class: "plot-col" },
          h("div", { class: "plot-caption" },
            h("span", {}, "Live DOM nodes per census"),
            h("span", { class: "dim" }, dn.verdict || "")
          ),
          chartBox(182, (w) => drawLeakSeriesChart(w, mainSide.dom_node_counts || [], lb?.dom_node_counts, dn, halfN, fmtCount, "neutral"))
        )
      )
    )
  );

  // 3. Suspects Table with App vs V8 Engine Split
  const totSuspBytes = Math.max(susp.retained_size || 0, 1);
  const appPct = Math.min(100, Math.max(0, ((appSusp.retained_size || 0) / totSuspBytes) * 100));
  const suspClasses = (susp.classes || []).slice(0, 10);
  const maxClsRet = Math.max(...suspClasses.map((c) => c.retained_size || 0), 1);

  const suspectsSection = susp.count != null
    ? h("section", { class: "card-surface", id: "leak-suspects" },
        h("div", { class: "card-hd" },
          h("div", { class: "card-hd-left" },
            h("h2", { class: "sec-title" }, `Surviving S0 → S1 allocations at S2`),
            h("span", { class: "sec-sub" }, `${fmtCount(susp.count)} objects (${fmtBytes(susp.retained_size)} retained) · app objects separated from V8 JIT code & internals`)
          )
        ),
        susp.retained_size > 0
          ? h("div", { class: "split-bar-wrap" },
              h("div", { class: "plot-caption" },
                h("span", {}, h("b", {}, `App objects: ${fmtBytes(appSusp.retained_size)}`), ` (${fmtCount(appSusp.count)} objects · ${appPct.toFixed(1)}%)`),
                h("span", { class: "dim" }, `V8 compiled code & internals: ${fmtBytes(v8Retained)} (${fmtCount(v8Count)} objects · ${(100 - appPct).toFixed(1)}%)`)
              ),
              h("div", { class: "split-track" },
                appPct > 0 ? h("i", { class: "split-app", style: `width:${appPct}%` }) : null,
                100 - appPct > 0 ? h("i", { class: "split-v8", style: `width:${100 - appPct}%` }) : null
              )
            )
          : null,
        !suspClasses.length
          ? h("div", { class: "attr-foot", style: "border-top:0" }, "No objects allocated between S0 and S1 remained alive at S2.")
          : h("div", { class: "attr-table" },
              h("div", { class: "single-row hd" },
                h("span", {}, "Surviving class & retainer chain"),
                h("span", {}, "Retained share"),
                h("span", { style: "text-align:right" }, "Retained"),
                h("span", { class: "col-share", style: "text-align:right" }, "Alive at S2")
              ),
              suspClasses.flatMap((c, idx) => {
                const path = c.largest?.path || null;
                const rowKey = `lrun:${idx}:${c.class}`;
                const canExpand = !!(path?.length || heapLocFull(c.location));
                const isOpen = canExpand && state.openRows.has(rowKey);
                const pct = Math.min(100, Math.max(1, ((c.retained_size || 0) / maxClsRet) * 100));
                const isEngine = isV8EngineClass(c.class, c.type);

                const rowEl = h("div", {
                  class: "single-row" + (canExpand ? " clickable" : ""),
                  style: isEngine ? "opacity:0.74" : "",
                  onclick: canExpand ? () => {
                    if (state.openRows.has(rowKey)) state.openRows.delete(rowKey);
                    else state.openRows.add(rowKey);
                    render();
                  } : null,
                },
                  h("div", { class: "fn-stack-cell" },
                    h("div", { class: "fn-primary-line" },
                      h("span", { class: "row-exp-icon" + (isOpen ? " open" : "") }, canExpand ? makeChevSvg(10) : ""),
                      h("span", { class: "fn-name" }, c.class),
                      c.location ? h("span", { class: "fn-where" }, heapLocShort(c.location)) : null,
                      h("span", { class: "fn-where", style: isEngine ? "color:var(--ink-4)" : "color:var(--accent)" }, isEngine ? "V8 / engine" : "app")
                    ),
                    path?.length ? h("div", { class: "fn-caller-hint" }, `↳ ${compactRetainerPath(path)}`) : null
                  ),
                  h("div", { class: "share-track" },
                    h("div", { class: "share-fill" + (!isEngine && cl.tone === "loss" ? " warn" : ""), style: `width:${pct}%;${isEngine ? "background:var(--ink-4);opacity:0.55" : ""}` })
                  ),
                  h("span", { class: "mono", style: "text-align:right;font-weight:600" }, fmtBytes(c.retained_size)),
                  h("span", { class: "mono col-share", style: "text-align:right;color:var(--ink-3);font-size:11.5px" }, fmtCount(c.count))
                );
                return isOpen ? [rowEl, renderRetainerDrawer(path, null, c.location, c.allocations)] : [rowEl];
              })
            )
      )
    : null;

  // 4. Next Steps & CLI commands
  const recHandle = mainSide.recording || s.attribution?.head;
  const cmds = [
    !s.decided ? ["Run with a higher --repeat count to narrow the slope interval:", `strobe bench ${quoteArg(cleanPath(r.file || "<file>"))} --probes memory --repeat ${(halfN || 5) * 2}`] : null,
    // Firefox leak runs keep about:memory censuses, no heap snapshots.
    recHandle && s.engine !== "firefox" ? ["Inspect surviving objects & retainer chains from CLI:", `strobe query ${recHandle} leaks`] : null,
    recHandle && s.engine !== "firefox" ? ["Inspect full end-of-run S2 heap snapshot:", `strobe query ${recHandle} heap`] : null,
    recHandle && s.engine === "firefox" ? ["about:memory after the first and the last run:", `strobe query ${recHandle} memory --at 0 · strobe query ${recHandle} memory`] : null,
    ["Export Markdown summary:", `strobe report experiment ${r.id} --format md`],
  ].filter(Boolean);

  const nextSection = h("section", { class: "card-surface" },
    h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Recommended next step"))),
    h("div", { class: "card-bd" },
      h("div", { class: "next-list" }, cmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
    )
  );

  appendKids(shell, [
    seriesList.length > 1 ? renderScorecard(seriesList, aa) : null,
    heroCard,
    chartSection,
    suspectsSection,
    renderExperimentInsightsSection(r, s),
    nextSection,
    renderRigFooter(r, { isLeakRun: true, runs: mainSide.runs, censuses: mainSide.censuses, elapsed_ms: s.elapsed_ms, warnings: s.warnings }, { hz: r.refresh_hz, vs: r.refresh_hz > 0 ? 1000 / r.refresh_hz : NaN }),
  ]);
}

function drawLeakSeriesChart(w, headArr, baseArr, gStats, halfN, fmtFn, tone) {
  const H = 182;
  const m = { l: 60, r: 22, t: 22, b: 26 };
  const svg = S("svg", { class: "plot", width: w, height: H, viewBox: `0 0 ${w} ${H}` });
  const nPts = headArr.length;
  if (nPts < 2) {
    svg.append(S("text", { x: w / 2, y: H / 2, "text-anchor": "middle", class: "sans" }, "Insufficient census points"));
    return svg;
  }

  const maxIdx = nPts - 1;
  const s1Idx = Math.min(maxIdx, halfN || Math.floor(maxIdx / 2));

  const allVals = [...headArr, ...(baseArr || [])].filter(finite);
  let y0 = Math.min(...allVals);
  let y1 = Math.max(...allVals);

  // Include slope cone bounds anchored at midpoint S1
  const anchorY = headArr[s1Idx];
  if (finite(anchorY) && finite(gStats?.lo) && finite(gStats?.hi)) {
    for (const sl of [gStats.lo, gStats.hi, gStats.slope]) {
      if (finite(sl)) {
        y0 = Math.min(y0, anchorY + sl * (0 - s1Idx), anchorY + sl * (maxIdx - s1Idx));
        y1 = Math.max(y1, anchorY + sl * (0 - s1Idx), anchorY + sl * (maxIdx - s1Idx));
      }
    }
  }

  if (y1 - y0 <= 0) { const pad = fmtFn === fmtCount ? Math.max(1, Math.round(Math.abs(y0) * 0.05)) : Math.abs(y0) * 0.05 || 1; y0 -= pad; y1 += pad; }
  const yPad = (y1 - y0) * 0.14;
  const yLoBound = Math.max(0, y0 - yPad);
  const yHiBound = y1 + yPad;
  const y = lin(yLoBound, yHiBound, H - m.b, m.t);

  const rawYTicks = niceTicks(yLoBound, yHiBound, 4);
  const yTicks = fmtFn === fmtCount ? rawYTicks.filter((t) => Math.abs(t - Math.round(t)) < 1e-9) : rawYTicks;
  const labels = yTicks.map(fmtFn);
  m.l = axisLeft(labels, m.l, 10);
  const x = lin(0, maxIdx, m.l, w - m.r);
  yTicks.forEach((tk, i) => {
    svg.append(
      S("line", { x1: m.l, y1: y(tk), x2: w - m.r, y2: y(tk), class: "gridline" }),
      S("text", { x: m.l - 7, y: y(tk) + 3.5, "text-anchor": "end", style: "font-size:10px" }, labels[i])
    );
  });
  svg.append(S("line", { x1: m.l, y1: H - m.b, x2: w - m.r, y2: H - m.b, class: "axisline" }));

  // Vertical markers for S0, S1, S2
  for (const [idx, lbl] of [[0, "S0"], [s1Idx, "S1"], [maxIdx, "S2"]]) {
    const px = x(idx);
    const anchor = idx === 0 ? "start" : idx === maxIdx ? "end" : "middle";
    svg.append(
      S("line", { x1: px, y1: m.t - 4, x2: px, y2: H - m.b, stroke: "var(--border-strong)", "stroke-dasharray": "3 2" }),
      S("text", { x: px, y: m.t - 8, "text-anchor": anchor, class: "strong", style: "font-size:10.5px;fill:var(--ink-3)" }, `${lbl} (r${idx})`)
    );
  }

  // Theil-Sen slope & 95% interval cone anchored at S1
  const lineColor = tone === "loss" ? "var(--loss)" : tone === "win" ? "var(--win)" : "var(--accent)";
  const coneFill = tone === "loss" ? "var(--loss-bg)" : tone === "win" ? "var(--win-bg)" : "var(--accent-bg)";
  if (finite(anchorY) && finite(gStats?.slope)) {
    if (finite(gStats.lo) && finite(gStats.hi) && gStats.hi !== gStats.lo) {
      const y0Lo = anchorY + gStats.lo * (0 - s1Idx);
      const y0Hi = anchorY + gStats.hi * (0 - s1Idx);
      const yNLo = anchorY + gStats.lo * (maxIdx - s1Idx);
      const yNHi = anchorY + gStats.hi * (maxIdx - s1Idx);
      const poly = [
        `${x(0)},${y(Math.min(y0Lo, y0Hi))}`,
        `${x(maxIdx)},${y(Math.max(yNLo, yNHi))}`,
        `${x(maxIdx)},${y(Math.min(yNLo, yNHi))}`,
        `${x(0)},${y(Math.max(y0Lo, y0Hi))}`,
      ].join(" ");
      svg.append(S("polygon", { points: poly, fill: coneFill }));
    }
    svg.append(S("line", {
      x1: x(0), y1: y(anchorY + gStats.slope * (0 - s1Idx)),
      x2: x(maxIdx), y2: y(anchorY + gStats.slope * (maxIdx - s1Idx)),
      stroke: lineColor, "stroke-width": 1.4, "stroke-dasharray": "4 3", "stroke-opacity": 0.85,
    }));
  }

  if (baseArr?.length === nPts) {
    svg.append(S("polyline", {
      points: baseArr.map((v, i) => `${x(i)},${y(v)}`).join(" "),
      fill: "none", stroke: "var(--base-tone)", "stroke-width": 1.5, "stroke-dasharray": "2 2",
    }));
  }

  svg.append(S("polyline", {
    points: headArr.map((v, i) => `${x(i)},${y(v)}`).join(" "),
    fill: "none", stroke: lineColor, "stroke-width": 2,
  }));

  headArr.forEach((v, i) => {
    if (!finite(v)) return;
    const isSnap = i === 0 || i === s1Idx || i === maxIdx;
    const dot = S("circle", {
      cx: x(i), cy: y(v),
      r: isSnap ? 4.5 : 3,
      fill: isSnap ? lineColor : "var(--surface)",
      stroke: lineColor, "stroke-width": 1.8,
    });
    const hit = S("rect", { x: x(i) - 10, y: m.t, width: 20, height: H - m.b - m.t, fill: "transparent" });
    hit.addEventListener("pointerenter", (e) => showTip(e, `Run ${i}${i === 0 ? " (S0)" : i === s1Idx ? " (S1)" : i === maxIdx ? " (S2)" : ""}`, [
      ["Value", fmtFn(v)],
      i > 0 ? ["Change vs S0", v >= headArr[0] ? "+" + fmtFn(v - headArr[0]) : "−" + fmtFn(headArr[0] - v)] : null,
    ]));
    hit.addEventListener("pointermove", moveTip);
    hit.addEventListener("pointerleave", hideTip);
    svg.append(dot, hit);
  });

  for (let i = 0; i <= maxIdx; i++) {
    if (nPts <= 13 || i === 0 || i === s1Idx || i === maxIdx || i % 5 === 0) {
      svg.append(S("text", { x: x(i), y: H - 6, "text-anchor": "middle", style: "font-size:10px" }, String(i)));
    }
  }
  return svg;
}

/* ---------- Feature 2: Bisect (`r.kind === "bisect"`) ---------- */
function renderBisect(r) {
  document.title = `strobe · bisect ${r.id || ""}`;
  const createdStr = r.created
    ? new Date(r.created).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : null;

  const topbar = h("header", { class: "topbar" },
    h("div", { class: "brand-cluster" },
      h("span", { class: "wordmark" }, "strobe"),
      r.file ? [h("span", { class: "sep" }, "/"), h("span", { class: "meta-suite", title: cleanPath(r.file) }, baseName(r.file))] : null,
      r.id ? [h("span", { class: "sep" }, "·"), h("span", { class: "mono meta-dim" }, r.id)] : null,
      createdStr ? [h("span", { class: "sep" }, "·"), h("span", { class: "meta-dim" }, createdStr)] : null
    ),
    h("div", { class: "top-actions" },
      r.range ? h("span", { class: "ref-pill" }, `bisect ${r.range}`) : null,
      r.text
        ? h("button", {
            type: "button", class: "btn-ghost", "aria-pressed": String(state.cliOpen),
            onclick: () => { state.cliOpen = !state.cliOpen; render(); },
          }, state.cliOpen ? "Report view" : "CLI output")
        : null
    )
  );

  const shell = h("div", { class: "shell" }, topbar);
  app.replaceChildren(shell);

  if (state.cliOpen && r.text) {
    shell.append(
      h("section", { class: "card-surface" },
        h("div", { class: "card-hd" },
          h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Plain-text CLI output")),
          h("div", { class: "card-hd-right" }, copyBtn(r.text, "Copy text"))
        ),
        h("pre", { class: "cli-pre" }, r.text)
      )
    );
    return;
  }

  const vStr = String(r.verdict || "");
  const steps = r.steps || [];
  const step0 = steps[0] || {};
  const metric = r.metric || step0.metric || "";
  const u = unitOf(metric);

  const isFound = vStr.startsWith("found:");
  const isNoChange = vStr.startsWith("no change:");
  const step0Cl = step0.decided ? classify(step0, metric, false) : { tone: "neutral" };
  const pillTone = isFound ? step0Cl.tone : isNoChange ? "neutral" : "warn";
  const pillText = isFound
    ? "Bisect · Culprit found"
    : isNoChange
      ? "Bisect · No change across range"
      : "Bisect · Unclear (undecided steps)";

  let headline;
  if (isFound && r.culprit) {
    headline = `Culprit commit: ${r.culprit.short}`;
  } else if (r.culprit && !isNoChange) {
    headline = `Likeliest culprit: ${r.culprit.short} (unresolved steps remain)`;
  } else if (isNoChange) {
    headline = `${labelOf(metric)} did not move across ${r.range || "range"}`;
  } else {
    headline = capFirst(vStr);
  }

  // Resolve honest `remaining` range (`r.remaining` when present; fallback for older payloads)
  const initGoodFull = r.good || (r.range || "").split("..")[0] || step0.good || "good";
  let remRangeObj = null;
  if (r.remaining !== undefined) {
    remRangeObj = r.remaining;
  } else if (!isFound && !isNoChange) {
    const firstUndec = steps.find((st) => st.step > 0 && st.decided === false);
    if (firstUndec && r.culprit) {
      remRangeObj = { good: firstUndec.good, bad: r.culprit.commit || r.culprit.short };
    }
  }
  const matchHash = (a, b) => !!(a && b && (a === b || a.startsWith(b) || b.startsWith(a)));

  const stepOutcome = (st) => {
    if (!st.decided) {
      const mNeed = /~(\d+)\s+pairs/.exec(st.verdict || "");
      return { tag: "No verdict", detail: mNeed ? `No verdict (~${mNeed[1]} pairs needed)` : "No verdict", cls: "undecided", tone: "warn" };
    }
    if (String(st.verdict || "").startsWith("same")) return { tag: "Not moved", detail: "Not moved", cls: "same", tone: "neutral" };
    const cl = classify(st, st.metric || metric, false);
    return { tag: `Moved (${st.verdict})`, detail: `Moved (${st.verdict})`, cls: "moved", tone: cl.tone };
  };

  // Shared interval domain across all steps
  const allBounds = steps.flatMap((st) => [st.lo, st.hi, st.estimate]).filter(finite).map(Math.abs);
  const maxDom = Math.max(0.04, ...allBounds) * 1.18;
  const dom = [-maxDom, maxDom];
  const rawPct = (v) => ((v - dom[0]) / (dom[1] - dom[0])) * 100;
  const clampPct = (v) => Math.max(0, Math.min(100, rawPct(v)));

  // Build commit rail: uses full `r.commits` when available (with untested dots & shaded `remaining` sub-range)
  const commits = Array.isArray(r.commits) && r.commits.length ? r.commits : null;
  let railNodes;

  const renderCommitNode = (c) => {
    const st = steps.find((s) => matchHash(s.commit, c.commit) || matchHash(s.short, c.short));
    if (!st) {
      const dot = h("i", { class: "bdot-untested" });
      dot.addEventListener("pointerenter", (e) => showTip(e, `${c.short || c.commit?.slice(0, 10)} · untested`, [
        c.subject ? ["Commit", c.subject] : null,
      ]));
      dot.addEventListener("pointermove", moveTip);
      dot.addEventListener("pointerleave", hideTip);
      return dot;
    }
    const out = stepOutcome(st);
    const isCulp = r.culprit && (matchHash(r.culprit.commit, c.commit) || matchHash(r.culprit.short, c.short));
    const el = h("span", {
      class: `bnode ${isCulp || out.cls === "moved" ? "culprit" : out.cls === "undecided" ? "undecided" : ""}`,
    }, `${(c.short || st.short || c.commit || "").slice(0, 8)} · ${out.tag}`);
    el.addEventListener("pointerenter", (e) => showTip(e, `Step ${st.step} · ${c.short || st.short}`, [
      c.subject || st.subject ? ["Subject", c.subject || st.subject] : null,
      ["Outcome", st.verdict || out.detail],
    ]));
    el.addEventListener("pointermove", moveTip);
    el.addEventListener("pointerleave", hideTip);
    return el;
  };

  if (commits) {
    let remStart = -1, remEnd = -1;
    if (remRangeObj?.good && remRangeObj?.bad) {
      if (matchHash(remRangeObj.good, initGoodFull)) {
        remStart = 0;
      } else {
        const gIdx = commits.findIndex((c) => matchHash(c.commit, remRangeObj.good) || matchHash(c.short, remRangeObj.good));
        if (gIdx >= 0) remStart = gIdx + 1;
      }
      remEnd = commits.findIndex((c) => matchHash(c.commit, remRangeObj.bad) || matchHash(c.short, remRangeObj.bad));
    }

    const withArrows = (arr) => arr.flatMap((c, idx) => [idx > 0 ? h("span", { class: "bnode-arrow" }, "→") : null, renderCommitNode(c)]);

    if (remStart >= 0 && remEnd >= remStart) {
      const before = commits.slice(0, remStart);
      const inside = commits.slice(remStart, remEnd + 1);
      const after = commits.slice(remEnd + 1);
      railNodes = [
        h("span", { class: "bnode", title: `Known good baseline (${initGoodFull})` }, `good · ${initGoodFull.slice(0, 8)}`),
        before.length ? [h("span", { class: "bnode-arrow" }, "→"), ...withArrows(before)] : null,
        h("span", { class: "bnode-arrow" }, "→"),
        h("span", {
          class: "bisect-rem-span",
          title: `Remaining candidate range: ${remRangeObj.good.slice(0, 10)}..${remRangeObj.bad.slice(0, 10)} (${inside.length} commits)`,
        },
          h("span", { class: "bisect-rem-tag" }, `remaining (${inside.length})`),
          ...withArrows(inside)
        ),
        after.length ? [h("span", { class: "bnode-arrow" }, "→"), ...withArrows(after)] : null,
      ];
    } else {
      railNodes = [
        h("span", { class: "bnode", title: `Known good baseline (${initGoodFull})` }, `good · ${initGoodFull.slice(0, 8)}`),
        h("span", { class: "bnode-arrow" }, "→"),
        ...withArrows(commits),
      ];
    }
  } else {
    railNodes = [
      h("span", { class: "bnode", title: "Known good baseline" }, `good · ${initGoodFull.slice(0, 10)}`),
      ...steps.slice(1).flatMap((st) => {
        const out = stepOutcome(st);
        return [
          h("span", { class: "bnode-arrow" }, "→"),
          h("span", {
            class: `bnode ${out.cls === "undecided" ? "undecided" : out.cls === "moved" ? "culprit" : ""}`,
            title: `Step ${st.step}: ${st.subject || ""} (${st.verdict})`,
          }, `${st.short?.slice(0, 8) || st.commit?.slice(0, 8)} · ${out.tag}`),
        ];
      }),
      step0.short
        ? [
            h("span", { class: "bnode-arrow" }, "→"),
            h("span", {
              class: `bnode ${r.culprit?.short === step0.short ? "culprit" : ""}`,
              title: `Step 0 (end of range): ${step0.subject || ""}`,
            }, `${step0.short.slice(0, 8)} · ${stepOutcome(step0).tag}`),
          ]
        : null,
    ];
  }

  const nextRange = remRangeObj?.good && remRangeObj?.bad
    ? `${remRangeObj.good.slice(0, 10)}..${remRangeObj.bad.slice(0, 10)}`
    : r.range;
  const nextCmds = [
    remRangeObj && r.file && nextRange
      ? [`Re-run bisect on ${nextRange} with automatic pair budget to settle undecided steps:`, `strobe bench ${quoteArg(cleanPath(r.file))} --bisect ${nextRange} --pairs auto`]
      : null,
    r.culprit && step0.experiment
      ? ["Open the step experiment that isolated the move:", `strobe report experiment ${(steps.slice().reverse().find((x) => x.short === r.culprit.short) || step0).experiment} --open`]
      : null,
    ["Export Markdown summary:", `strobe report experiment ${r.id} --format md`],
  ].filter(Boolean);

  appendKids(shell, [
    // 1. Outcome Hero
    h("section", { class: "card-surface" },
      h("div", { class: "hero-body" },
        h("div", { class: "hero-header" },
          h("div", { class: "eyebrow-row" },
            h("span", { class: `status-pill ${pillTone}` }, pillText),
            h("span", { class: "eyebrow-meta" }, `${r.series || "Benchmark"} · Primary: ${labelOf(metric)} · ${steps.length} ${steps.length === 1 ? "step" : "steps"}`)
          ),
          h("h1", { class: "hero-headline" }, headline),
          r.culprit?.subject
            ? h("div", { style: "font:500 16px/24px var(--sans);color:var(--ink)" }, r.culprit.subject)
            : null,
          h("p", { class: "hero-prose", style: "margin-top:4px" }, vStr)
        )
      )
    ),
    // 2. Commit Line & Bisect Steps
    h("section", { class: "card-surface" },
      h("div", { class: "card-hd" },
        h("div", { class: "card-hd-left" },
          h("h2", { class: "sec-title" }, "First-parent commit line & bisect steps"),
          h("span", { class: "sec-sub" }, "Step 0 tests bad vs good; later steps test the midpoint commit against the current good baseline")
        )
      ),
      h("div", { class: "bisect-rail" }, railNodes),
      h("div", { class: "attr-table" },
        steps.flatMap((st) => {
          const out = stepOutcome(st);
          const cObj = { estimate: st.estimate, lo: st.lo, hi: st.hi, relative: st.relative !== false, bound: 0.02 };
          const rowToneCls = out.tone === "win" ? "f-row-win" : out.tone === "loss" ? "f-row-loss" : "";
          const track = h("div", { class: "f-track bs-track" },
            h("i", { class: "f-band", style: `left:${clampPct(-0.02)}%;width:${clampPct(0.02) - clampPct(-0.02)}%` }),
            h("i", { class: "f-zero", style: "left:50%" }),
            finite(st.lo) && finite(st.hi)
              ? h("i", { class: "f-ci", style: `left:${clampPct(st.lo)}%;width:${Math.max(0.8, clampPct(st.hi) - clampPct(st.lo))}%` })
              : null,
            finite(st.estimate) ? h("i", { class: "f-dot", style: `left:${clampPct(st.estimate)}%` }) : null
          );

          return [
            h("div", { class: `bstep-row ${rowToneCls}` },
              h("span", { class: "mono", style: "color:var(--ink-3);font-weight:600" }, `Step ${st.step}`),
              h("div", { class: "fn-stack-cell" },
                h("div", { class: "fn-primary-line" },
                  h("span", { class: "fn-name" }, st.short || st.commit?.slice(0, 10)),
                  h("span", { class: "fn-where" }, `vs ${(st.good || "").slice(0, 8)} · ${st.pairs || "?"} pairs`)
                ),
                st.subject ? h("div", { class: "fn-caller-hint", style: "padding-left:0;font-family:var(--sans);font-size:12.5px;color:var(--ink-2)" }, st.subject) : null
              ),
              h("div", { class: "mono", style: "text-align:right" },
                h("div", { style: "font-weight:600;color:var(--ink)" }, fmtDelta(st.estimate, cObj, u)),
                h("div", { style: "font-size:11px;color:var(--ink-3)" }, `[${fmtRange(cObj, u, " … ")}]`)
              ),
              track,
              h("span", {
                class: "bs-verdict",
                style: `font-size:12px;font-weight:500;text-align:right;color:${out.tone === "win" ? "var(--win-ink)" : out.tone === "loss" ? "var(--loss-ink)" : out.tone === "warn" ? "var(--warn-ink)" : "var(--ink-3)"}`,
              }, out.detail)
            ),
            st.experiment
              ? h("div", { class: "bstep-cmd" }, cmdRow(`strobe report experiment ${st.experiment} --open`))
              : null,
          ];
        })
      )
    ),
    // 3. Recommended next step
    nextCmds.length
      ? h("section", { class: "card-surface" },
          h("div", { class: "card-hd" }, h("div", { class: "card-hd-left" }, h("h2", { class: "sec-title" }, "Recommended next step"))),
          h("div", { class: "card-bd" },
            h("div", { class: "next-list" }, nextCmds.map(([lbl, c]) => h("div", { class: "next-item" }, h("div", { class: "next-why" }, lbl), cmdRow(c))))
          )
        )
      : null
  ]);
}

/* ---------- Boot ---------- */
{
  // A view by its address (`#series=1&scope=host&metric=cpu.work`), so a link or a headless look shows
  // it: the series, the CPU profile's scope (runs, host, startup, setup) and the metric across pairs.
  const params = [new URLSearchParams((location.hash || "").replace(/^#/, "")), new URLSearchParams(location.search || "")];
  const asked = (k) => params.map((p) => p.get(k)).find((v) => v !== null) ?? null;
  const series = asked("series");
  if (series !== null && /^\d+$/.test(series)) state.series = +series;
  // Two implementations open on the headline journey, as the card and PR block lead with it.
  else if (isImpl(STROBE?.data)) {
    const i = (STROBE.data.series || []).findIndex((s) => s.headline);
    if (i >= 0) state.series = i;
  }
  const scope = asked("scope");
  if (scope === "runs" || Object.hasOwn(CPU_SCOPES, scope ?? "")) state.cpuScope = scope;
  const metric = asked("metric");
  if (metric) state.focusMetric = metric;
  render();
  const shown = metric ? document.getElementById("evidence") : scope ? document.querySelector('[aria-label="CPU profile scope"]')?.closest("section") : null;
  shown?.scrollIntoView({ block: "start" });
}
