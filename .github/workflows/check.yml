name: Check

# Every push builds strobe and lints it with clippy on Windows (x64 and Arm), Linux and macOS: each OS compiles
# its own code paths (ETW, /proc and perf events, libproc and CoreGraphics), which no other OS's build sees. No tests
# (SPEC rule 5): builds and lints only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, toolchain: stable-x86_64-pc-windows-gnu, rustflags: "-C link-self-contained=yes" }
          - { os: windows-11-arm, toolchain: stable-aarch64-pc-windows-msvc, rustflags: "" }
          - { os: ubuntu-24.04, toolchain: stable, rustflags: "" }
          - { os: macos-15, toolchain: stable, rustflags: "" }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy && rustup default ${{ matrix.toolchain }}
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked

  # The tree stays rustfmt-clean, so a builder's `cargo fmt` only ever touches its own lines.
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Format
        run: cargo fmt --all --check

  # Rule 15 (SPEC §1): no product names outside scripts/generic.ts's allowlist.
  generic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Generic
        run: bun scripts/generic.ts
