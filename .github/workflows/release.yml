name: Release

# A version tag (v0.2.0; only v<major>.<minor>.<patch>: the action's moving v<major>.<minor> tags never
# start a release) builds strobe for every platform and publishes its npm packages at Cargo.toml's
# version: @hona/strobe-<platform>-<arch> with the binaries (win32-x64, win32-arm64, darwin-arm64, darwin-x64,
# linux-x64, linux-arm64), @hona/strobe (the `strobe` command and the bench SDK) and the @hona/strobe-bench
# alias. npm trusts this workflow in the npm environment (trusted publishing over OIDC), so a publish needs
# no npm token and every version gets provenance.
# npm trusts a workflow only for a package that exists. For a new package, first stage a throwaway version
# (`npm stage publish --tag init` at 0.0.0-init), then `npm trust github <name> --file release.yml
# --repo anomalyco/strobe --env npm --allow-publish`, and `npm access set mfa=publish <name>`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (windows-gnu, as strobe builds locally)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      # Rust's bundled MinGW linker and CRT, as on a machine with no gcc on PATH. A gcc on PATH, the runner's or
      # the bundled one put there, makes rustc skip its CRT objects, and ld fails on crt2.o.
      - name: Build
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -C link-self-contained=yes
      - name: Collect
        shell: bash
        run: mkdir -p out/win32-x64 && cp target/release/strobe.exe target/release/strobew.exe out/win32-x64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64
          path: out
          retention-days: 1

  # Windows on Arm: native MSVC on an Arm runner, as Check builds it. The C runtime is linked in statically, so
  # the binaries need no Visual C++ Redistributable (Windows on Arm does not always have one).
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        shell: bash
        run: rustup toolchain install stable-aarch64-pc-windows-msvc --profile minimal && rustup default stable-aarch64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Check no runtime DLL is imported
        shell: bash
        run: |
          for f in strobe.exe strobew.exe; do
            if grep -aqiE 'vcruntime140|api-ms-win-crt-' "target/release/$f"; then echo "::error::$f imports the Visual C++ runtime or the dynamic UCRT"; exit 1; fi
          done
      - name: Collect
        shell: bash
        run: mkdir -p out/win32-arm64 && cp target/release/strobe.exe target/release/strobew.exe out/win32-arm64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-arm64
          path: out
          retention-days: 1

  # Linux: static musl binaries, so one build runs on any distribution (glibc or musl).
  linux:
    strategy:
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-musl }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.triple }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Collect
        run: mkdir -p out/${{ matrix.target }} && cp target/${{ matrix.triple }}/release/strobe out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out
          retention-days: 1

  # macOS: both architectures from the arm64 runner (x64 cross-compiled with the runner's SDK).
  # With the signing secrets (scripts/macos-sign.sh lists them) each binary is Developer ID-signed under
  # the hardened runtime and notarized, so macOS keeps its Accessibility and Screen Recording grants
  # across updates; without them it ships ad-hoc signed, as before, and a tag build warns.
  macos:
    strategy:
      matrix:
        include:
          - { target: darwin-arm64, triple: aarch64-apple-darwin }
          - { target: darwin-x64, triple: x86_64-apple-darwin }
    runs-on: blacksmith-6vcpu-macos-15
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.triple }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Sign and notarize (Developer ID)
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash scripts/macos-sign.sh target/${{ matrix.triple }}/release/strobe
      - name: Unsigned
        if: env.SIGNING != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: echo "::warning::no MACOS_CERTIFICATE_P12 secret; the macOS binaries ship ad-hoc signed, and every update drops their privacy grants"
      - name: Collect
        run: mkdir -p out/${{ matrix.target }} && cp target/${{ matrix.triple }}/release/strobe out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out
          retention-days: 1

  # On a v* tag this publishes. Run by hand on a branch, it packs every package without publishing (a dry run).
  publish:
    needs: [windows-x64, windows-arm64, linux, macos]
    runs-on: ubuntu-24.04
    # The npm environment takes deployments from v* tags only, and npm trusts only this environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bin
          merge-multiple: true
      # No caches in a release build: a poisoned cache would ship in the packages.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag names Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml says $want"; exit 1; }
      # Platform packages first; @hona/strobe only once npm serves every one of them (npm view and the abbreviated
      # document installers read), and @hona/strobe-bench once @hona/strobe is served, polled for up to 15 minutes
      # each. An install right after the release then never resolves @hona/strobe without a platform package.
      - name: Publish
        timeout-minutes: 60
        run: bun scripts/release.ts --bin bin ${{ startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}

  # Once the release is on npm, its GitHub Release: strobe's changelog. The notes are the commits since the
  # previous release tag (main takes direct pushes, so GitHub's pull-request notes would be empty), read
  # through the API with this run's token: no checkout, no repository code, no secrets. Nothing here can fail
  # the release: a note that cannot be built leaves a link to the commits, and a failed job is only reported.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Notes
        continue-on-error: true
        run: |
          set -o pipefail
          version="${TAG#v}"
          prev=$(gh api "repos/$REPO/tags?per_page=100" --paginate --jq '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }')
          # One line per commit, oldest first. A work-package prefix (`W5-3: `, `W6-3 review (wip): `,
          # `w7b review 2: `) goes;
          # merges, version bumps, formatting fixes and ci/docs/chore commits (`docs:`, `SPEC …`, one package
          # folding another's text: `W6-1's text …`) are left out. The subject is escaped: no HTML, emphasis,
          # code span, math, link or list syntax takes effect, and no `@name` notifies anyone. GitHub renders
          # `$…$` as math even when escaped (`\$`, `&#36;`): only a `$` in a span of its own stays a `$`.
          notes_jq=$(cat <<'JQ'
          .commits[]
          | select(.parents | length == 1)
          | (.commit.message | split("\n")[0] | gsub("\r"; "") | sub("^[Ww][0-9]+(-[0-9]+|[a-z])[^:']*: "; "")) as $s
          | select($s | test("^(release: v?[0-9]|fmt: ([A-Za-z0-9_./-]+\\.rs|rustfmt|cargo fmt)|ci:|docs:|chore:|[Mm]erge |SPEC\\b|W[0-9]+-[0-9]+'s )") | not)
          | "- " + ($s
              | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")
              | gsub("(?<c>[\\\\`*_~|\\[\\]])"; "\\\(.c)")
              | gsub("\\$"; "<span>$</span>")
              | gsub("@(?<c>[A-Za-z0-9])"; "@\u200b\(.c)")
              | sub("^(?<c>[-+#])"; "\\\(.c)")
              | sub("^(?<n>[0-9]+)(?<p>[.)])"; "\(.n)\\\(.p)"))
            + " (" + .sha[0:7] + ")"
          JQ
          )
          {
            echo "Install: \`bun add -d @hona/strobe@$version\` (or \`strobe update\`). npm: https://www.npmjs.com/package/@hona/strobe/v/$version"
            if [ -n "$prev" ]; then
              lines=$(gh api "repos/$REPO/compare/$prev...$TAG?per_page=100" --paginate | jq -r "$notes_jq")
              if [ -n "$lines" ]; then
                printf '\n## Changes since %s\n\n%s\n' "$prev" "$lines"
              fi
              printf '\nAll commits: https://github.com/%s/compare/%s...%s\n' "$REPO" "$prev" "$TAG"
            fi
          } > notes.part
          # Whole or not at all: a step that failed midway leaves no notes.md, and the release says where the commits are.
          mv notes.part notes.md
          cat notes.md
      - name: Release
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$TAG is a pre-release: no GitHub Release"; exit 0; fi
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then echo "$TAG already has a release"; exit 0; fi
          [ -s notes.md ] || echo "The commits of this release: https://github.com/$REPO/commits/$TAG" > notes.md
          # Latest only for the highest version: a patch of an older minor, tagged later, leaves it where it is.
          top=$(gh api "repos/$REPO/tags?per_page=100" --paginate --jq '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1) || top=""
          latest=false
          [ "$TAG" = "$top" ] && latest=true
          gh release create "$TAG" -R "$REPO" --verify-tag --latest="$latest" --title "strobe ${TAG#v}" --notes-file notes.md

  # Once the release is on npm, the action's tag for its minor version (v0.29 for v0.29.1) moves to it:
  # `uses: anomalyco/strobe@v0.29` takes each patch release of 0.29 (pre-1.0, a minor version may break).
  # Only forward, never to a commit the tag's current one is not an ancestor of, and never for a
  # pre-release. Through the API with this run's token: no checkout, no repository code, no secrets.
  tag-action:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Move v<major>.<minor>
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then echo "$TAG is a pre-release: no action tag moves"; exit 0; fi
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          if ! old=$(gh api "repos/$REPO/git/ref/tags/$minor" --jq .object.sha 2>/dev/null); then
            gh api "repos/$REPO/git/refs" -X POST -f ref="refs/tags/$minor" -f sha="$SHA" >/dev/null
            echo "created $minor at $SHA"
            exit 0
          fi
          # By the tag's name, so an annotated tag peels to its commit.
          status=$(gh api "repos/$REPO/compare/$minor...$SHA" --jq .status)
          case "$status" in
            identical) echo "$minor is already at $SHA" ;;
            ahead) gh api "repos/$REPO/git/refs/tags/$minor" -X PATCH -f sha="$SHA" -F force=true >/dev/null && echo "moved $minor from $old to $SHA" ;;
            *) echo "::error::$minor is at $old, which $TAG ($SHA) does not descend from ($status): moved by hand only"; exit 1 ;;
          esac
