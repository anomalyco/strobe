name: Release

# A version tag (v0.2.0) builds strobe for every platform and publishes its npm packages at Cargo.toml's
# version: @hona/strobe-<platform>-<arch> with the binaries (win32-x64, darwin-arm64, darwin-x64,
# linux-x64, linux-arm64), @hona/strobe (the `strobe` command and the bench SDK) and the @hona/strobe-bench
# alias. npm trusts this workflow in the npm environment (trusted publishing over OIDC), so a publish needs
# no npm token and every version gets provenance.
# npm trusts a workflow only for a package that exists. For a new package, first stage a throwaway version
# (`npm stage publish --tag init` at 0.0.0-init), then `npm trust github <name> --file release.yml
# --repo anomalyco/strobe --env npm --allow-publish`, and `npm access set mfa=publish <name>`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (windows-gnu, as strobe builds locally)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      # Rust's bundled MinGW linker and CRT, as on a machine with no gcc on PATH. A gcc on PATH, the runner's or
      # the bundled one put there, makes rustc skip its CRT objects, and ld fails on crt2.o.
      - name: Build
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -C link-self-contained=yes
      - name: Collect
        shell: bash
        run: mkdir -p out/win32-x64 && cp target/release/strobe.exe target/release/strobew.exe out/win32-x64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64
          path: out
          retention-days: 1

  # Linux: static musl binaries, so one build runs on any distribution (glibc or musl).
  linux:
    strategy:
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-musl }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.triple }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Collect
        run: mkdir -p out/${{ matrix.target }} && cp target/${{ matrix.triple }}/release/strobe out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out
          retention-days: 1

  # macOS: both architectures from the arm64 runner (x64 cross-compiled with the runner's SDK).
  # With the signing secrets (scripts/macos-sign.sh lists them) each binary is Developer ID-signed under
  # the hardened runtime and notarized, so macOS keeps its Accessibility and Screen Recording grants
  # across updates; without them it ships ad-hoc signed, as before, and a tag build warns.
  macos:
    strategy:
      matrix:
        include:
          - { target: darwin-arm64, triple: aarch64-apple-darwin }
          - { target: darwin-x64, triple: x86_64-apple-darwin }
    runs-on: macos-15
    env:
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.triple }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Sign and notarize (Developer ID)
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash scripts/macos-sign.sh target/${{ matrix.triple }}/release/strobe
      - name: Unsigned
        if: env.SIGNING != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: echo "::warning::no MACOS_CERTIFICATE_P12 secret; the macOS binaries ship ad-hoc signed, and every update drops their privacy grants"
      - name: Collect
        run: mkdir -p out/${{ matrix.target }} && cp target/${{ matrix.triple }}/release/strobe out/${{ matrix.target }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out
          retention-days: 1

  # On a v* tag this publishes. Run by hand on a branch, it packs every package without publishing (a dry run).
  publish:
    needs: [windows-x64, linux, macos]
    runs-on: ubuntu-24.04
    # The npm environment takes deployments from v* tags only, and npm trusts only this environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bin
          merge-multiple: true
      # No caches in a release build: a poisoned cache would ship in the packages.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag names Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml says $want"; exit 1; }
      # Platform packages first; @hona/strobe only once npm serves every one of them (npm view and the abbreviated
      # document installers read), and @hona/strobe-bench once @hona/strobe is served, polled for up to 15 minutes
      # each. An install right after the release then never resolves @hona/strobe without a platform package.
      - name: Publish
        timeout-minutes: 60
        run: bun scripts/release.ts --bin bin ${{ startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}
